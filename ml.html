<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>사회약학 연구방법 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;600;700&display=swap">
<style>
/* Layout: study-notes reader — slim top bar, chapter rail on the left, reading column (~46rem), section index on the right at wide widths. */
:root {
  --bg: #f5f7f6;
  --surface: #ffffff;
  --surface-2: #eef2f1;
  --ink: #16201e;
  --ink-2: #435150;
  --muted: #72807d;
  --line: #d9e0de;
  --line-strong: #b9c4c1;
  --accent: #0c6a60;
  --accent-ink: #0a5a51;
  --accent-soft: #e2f0ed;
  --note: #22598c;  --note-soft: #e7eff8;
  --warn: #9b4611;  --warn-soft: #fbefe5;
  --deep: #4f3f94;  --deep-soft: #efedf8;
  --good: #2c6e2f;  --good-soft: #e8f3e6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #7d8986;
  --grid: #e3e8e6; --axis: #b9c4c1;
  --code-bg: #f0f3f2;
  --hl-kw: #a626a4; --hl-str: #3f8f3e; --hl-num: #986801; --hl-com: #7b8784; --hl-fn: #2f6bd6; --hl-bi: #b1670a;
  --f-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-serif: "Noto Serif KR", "AppleMyungjo", "Batang", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --read: 46rem;
  --topbar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615; --surface: #171d1c; --surface-2: #1e2625;
    --ink: #e4ebe9; --ink-2: #b2bebb; --muted: #84918e;
    --line: #2a3432; --line-strong: #3b4745;
    --accent: #5fc4b4; --accent-ink: #7fd3c5; --accent-soft: #15302c;
    --note: #8fbbe9; --note-soft: #172636;
    --warn: #f0a46c; --warn-soft: #33241a;
    --deep: #b6aaf0; --deep-soft: #24203a;
    --good: #8fd08f; --good-soft: #1a2c1b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #8b9794;
    --grid: #253030; --axis: #3b4745; --code-bg: #1d2524; --hl-kw: #c98be0; --hl-str: #98c379; --hl-num: #d19a66; --hl-com: #7f8c89; --hl-fn: #6cb2f0; --hl-bi: #e5c07b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615; --surface: #171d1c; --surface-2: #1e2625;
  --ink: #e4ebe9; --ink-2: #b2bebb; --muted: #84918e;
  --line: #2a3432; --line-strong: #3b4745;
  --accent: #5fc4b4; --accent-ink: #7fd3c5; --accent-soft: #15302c;
  --note: #8fbbe9; --note-soft: #172636;
  --warn: #f0a46c; --warn-soft: #33241a;
  --deep: #b6aaf0; --deep-soft: #24203a;
  --good: #8fd08f; --good-soft: #1a2c1b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #8b9794;
  --grid: #253030; --axis: #3b4745; --code-bg: #1d2524; --hl-kw: #c98be0; --hl-str: #98c379; --hl-num: #d19a66; --hl-com: #7f8c89; --hl-fn: #6cb2f0; --hl-bi: #e5c07b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--topbar) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-sans); font-size: 16px; line-height: 1.8;
  word-break: keep-all; overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.35; }
button { font: inherit; color: inherit; }
code, kbd { font-family: var(--f-mono); font-size: .9em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; }

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--topbar); background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding-inline: 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand b { font-family: var(--f-serif); font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
[hidden] { display: none !important; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2);
  cursor: pointer; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.tb-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
#menuBtn { display: none; }
/* 읽던 곳으로 돌아가기 */
.back-btn { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; flex: none; }
.back-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.back-btn small { font-weight: 400; font-size: 12.5px; opacity: .85; max-width: 11rem; overflow: hidden; text-overflow: ellipsis; }
.back-btn small:empty { display: none; }
.brand { overflow: hidden; }
.brand b { overflow: hidden; text-overflow: ellipsis; }

/* shells */
.page { padding-inline: 16px; padding-block: 32px 80px; }
.wrap { max-width: 1120px; margin: 0 auto; }

/* home */
.home-hero { max-width: 44rem; padding-block: 28px 12px; }
.eyebrow { font-size: 13px; letter-spacing: .06em; color: var(--accent-ink); font-weight: 600; margin: 0 0 10px; }
.home-hero h1 { font-family: var(--f-serif); font-weight: 700; font-size: clamp(30px, 5vw, 42px); margin: 0 0 14px; letter-spacing: -.02em; }
.home-hero p { color: var(--ink-2); font-size: 17px; margin: 0; }
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 36px; }
.part-card {
  display: flex; flex-direction: column; gap: 10px; padding: 22px 22px 20px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0;
}
a.part-card:hover { border-color: var(--accent); }
.part-card .pc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.part-card .pc-tag { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; }
.part-card h2 { font-family: var(--f-serif); font-size: 23px; margin: 0; }
.part-card p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.7; }
.part-card .pc-meta { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.part-card.soon { background: transparent; border-style: dashed; color: var(--muted); }
.part-card.soon h2 { color: var(--ink-2); }
.pill { display: inline-block; font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--accent-ink); }
.home-how { margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; max-width: 64rem; }
.home-how h3 { font-size: 15px; margin: 0 0 4px; }
.home-how p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.7; }

/* part (TOC) page */
.part-head { max-width: 46rem; margin-bottom: 28px; }
.crumbs { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent-ink); text-decoration: underline; }
.part-head h1 { font-family: var(--f-serif); font-size: clamp(28px, 4.5vw, 38px); margin: 0 0 12px; letter-spacing: -.02em; }
.part-head p { color: var(--ink-2); margin: 0 0 8px; }
.part-grid { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 40px; align-items: start; }
.part-grid.one { grid-template-columns: minmax(0, 46rem); }
.toc-part { margin-bottom: 36px; }
.toc-part > h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.toc-part > .tp-title { font-family: var(--f-serif); font-size: 22px; font-weight: 600; margin: 0 0 14px; }
.toc-ch { border-top: 1px solid var(--line); padding-block: 16px; display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); gap: 4px 12px; }
.toc-ch:last-child { border-bottom: 1px solid var(--line); }
.toc-no { font-family: var(--f-serif); font-size: 26px; font-weight: 600; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.toc-ch.off .toc-no { color: var(--line-strong); }
.toc-ch h3 { margin: 0; font-size: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toc-ch h3 a { color: var(--ink); text-decoration: none; }
.toc-ch h3 a:hover { color: var(--accent-ink); text-decoration: underline; }
.toc-ch.off h3 { color: var(--ink-2); font-weight: 500; }
.toc-secs { grid-column: 2; list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 14.5px; }
.toc-secs li { color: var(--muted); }
/* PART 안의 접히는 묶음 (PART 5 A·B) */
details.toc-sub { border-top: 1px solid var(--line); }
details.toc-sub:last-child { border-bottom: 1px solid var(--line); }
details.toc-sub > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding-block: 16px; }
details.toc-sub > summary::-webkit-details-marker { display: none; }
details.toc-sub > summary .ts-t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
details.toc-sub > summary b { font-size: 18px; }
details.toc-sub > summary small { color: var(--muted); font-size: 13.5px; }
details.toc-sub > summary .chev { width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 6px; }
details.toc-sub[open] > summary .chev { transform: rotate(-135deg); }
details.toc-sub > summary:hover b { color: var(--accent-ink); }
details.toc-sub > .ts-body { margin: 0 0 14px 1.1rem; padding-left: 1.1rem; border-left: 2px solid var(--line); }
details.toc-sub > .ts-body .toc-ch:first-child { border-top: 0; padding-top: 4px; }
details.toc-sub > .ts-body .toc-ch:last-child { border-bottom: 0; }
details.rail-sub > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); font-weight: 600; }
details.rail-sub > summary::-webkit-details-marker { display: none; }
details.rail-sub > summary::before { content: ""; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.rail-sub[open] > summary::before { transform: rotate(45deg); }
details.rail-sub > summary:hover { background: var(--surface-2); color: var(--ink); }
details.rail-sub > summary small { font-weight: 400; color: var(--muted); font-size: 12px; }
details.rail-sub > ol { margin-left: 6px; padding-left: 6px; border-left: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { details.toc-sub > summary .chev, details.rail-sub > summary::before { transition: none; } }
.toc-secs a { color: var(--ink-2); text-decoration: none; }
.toc-secs a:hover { color: var(--accent-ink); text-decoration: underline; }
.toc-secs .sn { color: var(--muted); margin-right: 4px; }
.side-card { position: sticky; top: calc(var(--topbar) + 24px); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 18px 14px; }
.side-card h3 { margin: 0 0 4px; font-size: 15px; }
.side-card p { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; line-height: 1.65; }
.guide { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 1.5; }
.guide th, .guide td { text-align: left; vertical-align: top; padding: 7px 6px; border-top: 1px solid var(--line); }
.guide th { font-weight: 600; color: var(--muted); font-size: 12.5px; border-top: 0; }
.guide td a { text-decoration: none; }
.guide .gno { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* reader layout */
.reader { display: grid; grid-template-columns: 250px minmax(0, 1fr) 200px; gap: 40px; max-width: 1320px; margin: 0 auto; }
.rail { position: sticky; top: calc(var(--topbar) + 20px); align-self: start; max-height: calc(100vh - var(--topbar) - 40px); overflow-y: auto; padding-right: 6px; font-size: 14px; }
.rail h4 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.rail h4:first-child { margin-top: 0; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li > a, .rail li > span { display: grid; grid-template-columns: 1.8rem 1fr; gap: 4px; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; line-height: 1.45; }
.rail li a:hover { background: var(--surface-2); color: var(--ink); }
.rail li a.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.rail li > span { color: var(--muted); opacity: .7; }
.rail .rn { font-variant-numeric: tabular-nums; color: var(--muted); }
.rail li a.on .rn { color: var(--accent-ink); }
.rail .back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
.rail .back:hover { color: var(--accent-ink); }
.article { min-width: 0; max-width: var(--read); }
.onpage { position: sticky; top: calc(var(--topbar) + 20px); align-self: start; font-size: 13.5px; }
.onpage h4 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.onpage ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.onpage a { display: block; padding: 4px 0 4px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; line-height: 1.45; }
.onpage a:hover { color: var(--ink); }
.onpage a.on { color: var(--accent-ink); border-left-color: var(--accent); }

/* chapter header */
.ch-head { margin-bottom: 36px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.ch-head .crumbs { margin-bottom: 18px; }
.ch-no { font-family: var(--f-serif); font-size: 15px; font-weight: 600; color: var(--accent-ink); letter-spacing: .04em; margin: 0 0 6px; }
.ch-head h1 { font-family: var(--f-serif); font-size: clamp(28px, 4.4vw, 38px); margin: 0 0 16px; letter-spacing: -.02em; font-weight: 700; }
.lead { font-size: 17px; color: var(--ink-2); margin: 0; }
.ch-map { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
.ch-map a { font-size: 13.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--ink-2); background: var(--surface); }
.ch-map a:hover { border-color: var(--accent); color: var(--accent-ink); }

/* article typography */
.sec { padding-top: 12px; margin-bottom: 64px; }
.sec > h2 { font-family: var(--f-serif); font-size: clamp(23px, 3.2vw, 28px); font-weight: 700; margin: 0 0 20px; display: flex; gap: 12px; align-items: baseline; letter-spacing: -.01em; }
.sec > h2 .sec-no { color: var(--accent); font-size: .85em; }
.article h3 { font-size: 19px; font-weight: 600; margin: 40px 0 12px; }
.article h4 { font-size: 16px; font-weight: 600; margin: 28px 0 8px; }
.article p { margin: 0 0 16px; }
.article ul, .article ol { margin: 0 0 16px; padding-left: 1.4em; }
.article li { margin-bottom: 6px; }
.article li::marker { color: var(--muted); }
.article strong { font-weight: 600; color: var(--ink); }
.en { color: var(--muted); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
mark { background: color-mix(in srgb, var(--s1) 18%, transparent); color: inherit; padding: 0 .15em; border-radius: 3px; }
.mjx { overflow-x: auto; overflow-y: hidden; }
.eq { margin: 18px 0 20px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.eq p { margin: 8px 0 0; font-size: 14.5px; color: var(--ink-2); }
mjx-container[display="true"] { margin: 6px 0 !important; }
mjx-container { color: var(--ink); }

/* glance */
.glance { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 0 0 24px; font-size: 15px; line-height: 1.65; overflow: hidden; }
.glance > div { display: contents; }
.glance dt, .glance dd { padding: 10px 14px; border-top: 1px solid var(--line); margin: 0; }
.glance dt { color: var(--muted); font-size: 13.5px; font-weight: 600; background: var(--surface-2); }
.glance > div:first-child dt, .glance > div:first-child dd { border-top: 0; }

/* callouts */
.callout { border-radius: 10px; padding: 14px 18px 4px; margin: 22px 0; font-size: 15.5px; line-height: 1.75; }
.callout .ct { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; margin: 0 0 6px; letter-spacing: .02em; }
.callout .ct svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; flex: none; }
.callout p, .callout ul, .callout ol { margin-bottom: 10px; }
.callout.note { background: var(--note-soft); } .callout.note .ct { color: var(--note); }
.callout.warn { background: var(--warn-soft); } .callout.warn .ct { color: var(--warn); }
.callout.deep { background: var(--deep-soft); } .callout.deep .ct { color: var(--deep); }
.callout.tip { background: var(--good-soft); } .callout.tip .ct { color: var(--good); }
.wrong { color: var(--ink); }
.wrong::after { content: " (X)"; color: var(--warn); font-weight: 700; white-space: nowrap; }
.lab-link { margin: 26px 0 0 !important; padding: 10px 14px; border: 1px dashed var(--line-strong); border-radius: 10px; font-size: 14.5px; color: var(--ink-2); }
.lab-link a { font-weight: 600; }
.nb-link { margin: 14px 0 18px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 14.5px; line-height: 1.7; color: var(--ink-2); }
.nb-link a { font-weight: 600; }
details.hw-ans { margin: 10px 0 22px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details.hw-ans > summary { cursor: pointer; padding: 9px 14px; font-weight: 600; font-size: 14.5px; color: var(--accent-ink); }
details.hw-ans[open] > summary { border-bottom: 1px dashed var(--line); }
details.hw-ans > div { padding: 10px 14px 12px; }

/* paper reading box */
.paper { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); margin: 28px 0; overflow: hidden; }
.paper-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.paper-h b { font-size: 14px; display: flex; align-items: center; gap: 8px; }
.paper-h b svg { width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 1.8; }
.paper-h span { font-size: 12.5px; color: var(--muted); }
.paper-b { padding: 18px 18px 6px; }
.paper-b > p { font-size: 15px; }
.excerpt { font-family: Georgia, "Times New Roman", var(--f-serif); font-size: 15.5px; line-height: 1.7; color: var(--ink); margin: 0 0 16px; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-strong); }
.excerpt .hl { background: color-mix(in srgb, var(--s2) 20%, transparent); border-radius: 3px; padding: 0 .1em; }
.marks { list-style: none; padding: 0 !important; margin: 16px 0 12px; display: grid; gap: 10px; font-size: 15px; line-height: 1.7; }
.marks li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; margin: 0 !important; }
.mk { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 50%; background: var(--s2); color: #fff; font-size: 11.5px; font-weight: 600; font-family: var(--f-sans); line-height: 1; vertical-align: 1px; margin: 0 2px; font-variant-numeric: tabular-nums; flex: none; }
.marks .mk { margin-top: 4px; }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 18px 0 22px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.55; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl thead th { background: var(--surface-2); font-weight: 600; font-size: 13.5px; color: var(--ink-2); border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl .hi td { background: color-mix(in srgb, var(--s1) 8%, transparent); }
.tbl-cap { font-size: 14px; color: var(--ink-2); margin: 0 0 8px; }
.tbl-cap b { color: var(--ink); }
/* journal-style table */
table.jt { border-collapse: collapse; width: 100%; min-width: 520px; font-family: Georgia, "Times New Roman", var(--f-serif); font-size: 14.5px; line-height: 1.5; color: var(--ink); }
.jt caption { caption-side: top; text-align: left; font-size: 14.5px; padding-bottom: 8px; }
.jt caption b { font-weight: 700; }
.jt thead tr:first-child th { border-top: 1.5px solid var(--ink); }
.jt thead th { font-weight: 700; border-bottom: 1px solid var(--ink); padding: 7px 10px; text-align: left; vertical-align: bottom; }
.jt td { padding: 6px 10px; vertical-align: top; }
.jt tbody tr:last-child td { border-bottom: 1.5px solid var(--ink); }
.jt td.r, .jt th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.jt td.c, .jt th.c { text-align: center; }
.jt .ind { padding-left: 26px; }
.jt .grp td { font-style: italic; padding-top: 10px; }
.jt-foot { font-family: Georgia, "Times New Roman", var(--f-serif); font-size: 13px; color: var(--ink-2); margin: 8px 0 0; line-height: 1.55; }

/* figures */
.fig { margin: 26px 0; }
.fig-body { display: grid; gap: 12px; }
.fig-grid.g2 .fig-body { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fig-grid.g3 .fig-body { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fig-panel { min-width: 0; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px 2px; }
.fig svg.viz { display: block; width: 100%; height: auto; }
.fig:not(.fig-grid) svg.viz { min-width: 460px; }
.fig figcaption { font-size: 14px; color: var(--ink-2); margin-top: 10px; line-height: 1.65; }
.fig-note { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.viz text { font-family: var(--f-sans); font-size: 13px; fill: var(--ink-2); }
.viz .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.viz .axlab { fill: var(--ink-2); font-size: 12.5px; }
.viz .ptitle { fill: var(--ink); font-weight: 600; font-size: 13px; }
.viz .lbl.strong { fill: var(--ink); font-weight: 600; }
.viz .lbl.mute { fill: var(--muted); }
.viz .small { font-size: 11.5px; }
.viz .grid { stroke: var(--grid); stroke-width: 1; }
.viz .axis { stroke: var(--axis); stroke-width: 1; }
.viz .ref { stroke: var(--muted); }
.viz .strongref { stroke: var(--ink-2); }
.viz .ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.viz .s1 { stroke: var(--s1); } .viz .s2 { stroke: var(--s2); } .viz .s3 { stroke: var(--s3); } .viz .s4 { stroke: var(--s4); }
.viz .f1 { fill: var(--s1); } .viz .f2 { fill: var(--s2); } .viz .f3 { fill: var(--s3); } .viz .f4 { fill: var(--s4); }
.viz .a1 { fill: var(--s1); fill-opacity: .16; } .viz .a2 { fill: var(--s2); fill-opacity: .22; } .viz .a3 { fill: var(--s3); fill-opacity: .18; } .viz .a4 { fill: var(--s4); fill-opacity: .2; }
.viz .pt { stroke: var(--surface); stroke-width: 1.5; }
.viz .pth { fill: var(--surface); stroke-width: 1.6; }

/* HTML diagrams */
.tree { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 22px 0; }
.tree-col { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px 10px; min-width: 0; }
.tree-col > h4 { margin: 0 0 2px !important; font-size: 16px; }
.tree-col > .sub { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.tree-leaf { border-top: 1px solid var(--line); padding: 10px 0 6px; }
.tree-leaf b { display: block; font-size: 15px; }
.tree-leaf p { margin: 2px 0 0 !important; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
.flow { display: grid; gap: 10px; margin: 22px 0; counter-reset: fl; }
.flow > div { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.flow > div::before { counter-increment: fl; content: counter(fl); width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; font-size: 14px; }
.flow > div > div > b { display: block; }
.flow p { margin: 2px 0 0 !important; font-size: 14.5px; color: var(--ink-2); line-height: 1.65; }
.matrix { display: grid; grid-template-columns: 7rem repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 22px 0; font-size: 14.5px; background: var(--surface); }
.matrix > div { padding: 12px 14px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); line-height: 1.55; }
.matrix > .mh { background: var(--surface-2); font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.matrix > .m-ok { background: color-mix(in srgb, var(--s3) 10%, var(--surface)); }
.matrix > .m-err { background: color-mix(in srgb, var(--s2) 12%, var(--surface)); }
.matrix > div:nth-child(-n+3) { border-top: 0; }
.matrix > div:nth-child(3n+1) { border-left: 0; }
.matrix small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }

/* key points */
.keypoints { border-top: 2px solid var(--ink); padding-top: 14px; margin-top: 34px; }
.keypoints .kt { font-size: 13.5px; font-weight: 600; letter-spacing: .04em; margin: 0 0 8px; }
.keypoints ul { list-style: none; padding: 0 !important; margin: 0; }
.keypoints li { position: relative; padding-left: 22px; margin-bottom: 8px; font-size: 15.5px; }
.keypoints li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); }

/* code */
details.code { margin: 18px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details.code summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
details.code pre { margin: 0; padding: 14px 16px; border-top: 1px solid var(--line); background: var(--code-bg); overflow-x: auto; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; border-radius: 0 0 10px 10px; }
details.code pre code { background: none; padding: 0; }
details.code .cm, .cm { color: var(--muted); }
pre.out { font-family: var(--f-mono); font-size: 13px; line-height: 1.55; background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0 0 12px; white-space: pre; }

/* widgets */
.widget { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: 16px 18px; margin: 26px 0; }
.widget .wt { font-size: 14px; font-weight: 600; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
.widget .wt .pill { font-weight: 500; }
.widget .wd { font-size: 14px; color: var(--ink-2); margin: 0 0 12px; }
.wrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--ink-2); border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.wbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.wbtn:hover { border-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.stat { border-top: 1px solid var(--line); padding-top: 8px; }
.stat .sl { font-size: 12.5px; color: var(--muted); }
.stat .sv { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
input[type="range"] { accent-color: var(--accent); width: min(320px, 100%); }
.wchart { overflow-x: auto; }
.wchart svg { display: block; width: 100%; height: auto; min-width: 420px; }

/* pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; border-top: 1px solid var(--line); padding-top: 22px; }
.pager a, .pager span { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--muted); font-size: 12.5px; }
.pager .nx { text-align: right; grid-column: 2; }
.pager span { visibility: hidden; }

/* citations & references */
a.cite { font-size: .78em; vertical-align: super; line-height: 0; text-decoration: none; margin-left: 1px; font-variant-numeric: tabular-nums; }
.reflist { list-style: none; padding: 0 !important; counter-reset: none; }
.reflist li { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.65; margin: 0 !important; }
.reflist li:target { background: var(--accent-soft); }
.reflist .rn { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; padding-right: 6px; }
.reflist .used { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* search */
.search-box { display: flex; gap: 8px; margin: 8px 0 22px; }
.search-box input { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 14px; font: inherit; background: var(--surface); color: var(--ink); }
.results { list-style: none; padding: 0; margin: 0; }
.results li { border-top: 1px solid var(--line); padding: 14px 0; }
.results a { font-weight: 600; text-decoration: none; }
.results .rp { font-size: 12.5px; color: var(--muted); }
.results p { margin: 4px 0 0; font-size: 14.5px; color: var(--ink-2); }
.soon-box { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 28px; color: var(--ink-2); }

/* drawer (mobile rail) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); background: var(--surface); z-index: 41; padding: calc(env(safe-area-inset-top, 0px) + 16px) 14px 24px; overflow-y: auto; border-right: 1px solid var(--line); }
.drawer .rail { position: static; max-height: none; }

@media (min-width: 1241px) { .ch-map { display: none; } }
@media (max-width: 1240px) {
  .reader { grid-template-columns: 240px minmax(0, 1fr); }
  .onpage { display: none; }
}
@media (max-width: 960px) {
  .reader { grid-template-columns: minmax(0, 1fr); }
  .reader > .rail { display: none; }
  #menuBtn { display: inline-flex; }
  .part-grid { grid-template-columns: minmax(0, 1fr); }
  .side-card { position: static; }
  .article { max-width: none; }
}
@media (max-width: 620px) {
  body { font-size: 15.5px; }
  .brand span { display: none; }
  .tree { grid-template-columns: minmax(0, 1fr); }
  .fig-grid.g2 .fig-body, .fig-grid.g3 .fig-body { grid-template-columns: minmax(0, 1fr); }
  .glance { grid-template-columns: minmax(0, 1fr); }
  .glance dt { border-top: 1px solid var(--line); padding-bottom: 4px; }
  .glance dd { border-top: 0; padding-top: 4px; }
  .matrix { grid-template-columns: 5rem repeat(2, minmax(0, 1fr)); font-size: 13.5px; }
  .toc-ch { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .toc-no { font-size: 22px; }
  .tb-btn .lbl-txt { display: none; }
  .back-btn small { display: none; }
  .topbar { gap: 8px; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .nx { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* python lab cells */
.cell { border: 1px solid var(--line-strong); border-radius: 10px; margin: 18px 0 10px; background: var(--surface); overflow: hidden; }
.cell-h { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.4; }
.cell-n { font-family: var(--f-mono); color: var(--accent-ink); font-weight: 600; white-space: nowrap; }
.cell-t { color: var(--ink-2); flex: 1; min-width: 0; }
button.copy { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
button.copy:hover { border-color: var(--accent); color: var(--accent-ink); }
pre.cell-in { margin: 0; padding: 12px 14px; background: var(--code-bg); overflow-x: auto; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; white-space: pre; }
pre.cell-in code { background: none; padding: 0; font-size: inherit; }
.cell-out { border-top: 1px solid var(--line); padding: 8px 14px 12px; min-width: 0; }
.cell-out-h { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: .03em; }
.cell-out pre { margin: 0; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5; overflow-x: auto; white-space: pre; color: var(--ink); }
.cell-out pre + pre, .cell-out pre + .df-wrap, .cell-out .df-wrap + pre { margin-top: 8px; }
.cell-out .warn-out { background: var(--warn-soft); color: var(--warn); padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; margin-top: 8px; }
.cell-out .err-out { background: color-mix(in srgb, var(--s2) 14%, var(--surface)); color: var(--ink); padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; margin-top: 8px; }
.cell-img { display: block; max-width: 100%; height: auto; margin-top: 8px; background: #fff; border-radius: 6px; }
.df-wrap { overflow-x: auto; }
table.dfout { border-collapse: collapse; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.45; }
.dfout th, .dfout td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.dfout thead th { border-bottom: 1px solid var(--line-strong); color: var(--ink-2); }
.dfout tbody th { text-align: left; color: var(--muted); font-weight: 500; }
.lines { list-style: none; padding: 0 !important; margin: 4px 0 22px; font-size: 15px; line-height: 1.7; }
.lines li { display: grid; grid-template-columns: minmax(0, 16rem) minmax(0, 1fr); gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); margin: 0 !important; }
.lines li:last-child { border-bottom: 1px solid var(--line); }
.lines li > code:first-child { white-space: pre-wrap; word-break: break-all; font-size: 12.5px; align-self: start; line-height: 1.5; padding: 4px 6px; }
/* beginner intuition box, "use in my study" box, real-paper guide */
.easy { background: var(--accent-soft); border-radius: 12px; padding: 16px 20px 8px; margin: 0 0 24px; }
.easy .et { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--accent-ink); margin: 0 0 6px; }
.easy .big { font-size: 17.5px; line-height: 1.7; font-weight: 500; color: var(--ink); margin: 0 0 10px; }
.easy ul { margin: 0 0 8px; padding-left: 1.2em; }
.easy li { margin-bottom: 6px; font-size: 15.5px; }
.easy li b { color: var(--ink); }
.callout.use { background: var(--surface); border: 1.5px solid var(--accent); }
.callout.use .ct { color: var(--accent-ink); }
.math-note { font-size: 14px; color: var(--muted); margin: -6px 0 14px !important; }
details.real-box { margin: -14px 0 28px; border: 1px solid var(--line-strong); border-top: 0; border-radius: 0 0 12px 12px; background: var(--surface); }
details.real-box > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--note); }
details.real-box > summary::-webkit-details-marker { display: none; }

details.real-box[open] > summary::before { transform: rotate(45deg); }
details.real-box > summary .cnt { font-weight: 400; font-size: 12.5px; color: var(--muted); }
details.real-box[open] > summary .cnt { display: none; }
.real-b { padding: 2px 18px 8px; border-top: 1px dashed var(--line); }
.real-b > p { font-size: 15px; }
.real-cite { font-size: 14px !important; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
.real-cite a { word-break: break-all; }
.real-note { font-size: 13px !important; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { details.real-box > summary::before { transition: none; } }
.paper:has(+ details.real-box) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 14px; }
details.lines-box { margin: 6px 0 22px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details.lines-box > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
details.lines-box > summary::-webkit-details-marker { display: none; }
details.lines-box > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; }

/* collapsed '심화' parts (build.py fold_deep) */

@media (prefers-reduced-motion: reduce) { details.lines-box > summary::before { transition: none; } }
.hljs-keyword, .hljs-operator.hljs-keyword { color: var(--hl-kw); }

@media (max-width: 620px) {
  .lines li { grid-template-columns: minmax(0, 1fr); gap: 4px; }

<section class="sec" id="ml00-s1">
<h2><span class="sec-no">가.</span>지도학습이란</h2>

<h3>쉽게 말하면</h3>
<p><strong>지도학습</strong><span class="en">(supervised learning)</span>은 정답이 붙은 자료로 규칙을 배우는 일입니다. 처방전 수백 장과 각각의 처방 감사 결과를 보며 "이런 조합이면 문제가 생긴다"는 감을 익히는 것과 비슷합니다. 컴퓨터는 이 감을 숫자로 된 규칙, 곧 <strong>모형</strong><span class="en">(model)</span>으로 만들고, 정답을 모르는 새 사람에게 적용해 답을 냅니다.</p>
<ul>
<li><b>특성과 목표.</b> 예측에 쓰는 변수를 <strong>특성</strong><span class="en">(feature)</span>, 맞히려는 변수를 <strong>목표</strong><span class="en">(target)</span>라고 합니다. 통계 과목의 설명변수와 결과변수입니다. 이 과목에서는 2022년의 나이, 진단, 의료이용, 처방, 검진 결과 39개가 특성이고 2023년의 결과가 목표입니다.</li>
<li><b>분류와 회귀.</b> 목표가 범주이면 <strong>분류</strong><span class="en">(classification)</span>, 숫자이면 <strong>회귀</strong><span class="en">(regression)</span>입니다. 분류 목표는 2023년 응급 입원 여부(<code>admit_2023</code>, 0/1), 회귀 목표는 2023년 총 의료비(<code>cost_2023</code>, 만원)입니다.</li>
<li><b>학습과 예측.</b> 정답이 있는 자료로 규칙을 찾는 단계가 <strong>학습</strong><span class="en">(fitting, training)</span>, 그 규칙을 새 사람에게 적용하는 단계가 <strong>예측</strong><span class="en">(prediction)</span>입니다. scikit-learn에서는 <code>fit</code>과 <code>predict</code>라는 두 함수입니다.</li>
</ul>

<h3>숫자로 따라가기</h3>
<p>환자 10명으로 가장 단순한 규칙을 배워 봅니다(가상의 숫자).</p>
<div class="tbl-wrap"><table class="tbl" style="max-width:34rem">
<thead><tr><th>환자</th><th class="r">나이</th><th class="r">2022년 응급실 방문</th><th class="r">2023년 응급 입원</th></tr></thead>
<tbody>
<tr><td>A</td><td class="r">52</td><td class="r">0</td><td class="r">0</td></tr>
<tr><td>B</td><td class="r">61</td><td class="r">0</td><td class="r">0</td></tr>
<tr><td>C</td><td class="r">47</td><td class="r">1</td><td class="r">0</td></tr>
<tr class="hi"><td>D</td><td class="r">78</td><td class="r">2</td><td class="r">1</td></tr>
<tr><td>E</td><td class="r">83</td><td class="r">0</td><td class="r">0</td></tr>
<tr><td>F</td><td class="r">69</td><td class="r">0</td><td class="r">0</td></tr>
<tr class="hi"><td>G</td><td class="r">88</td><td class="r">3</td><td class="r">1</td></tr>
<tr><td>H</td><td class="r">58</td><td class="r">1</td><td class="r">0</td></tr>
<tr class="hi"><td>I</td><td class="r">74</td><td class="r">2</td><td class="r">0</td></tr>
<tr><td>J</td><td class="r">81</td><td class="r">0</td><td class="r">1</td></tr>
</tbody></table></div>
<ol>
<li>특성은 나이와 응급실 방문, 목표는 응급 입원입니다. 10명 모두 목표의 정답이 있습니다.</li>
<li>응급실 방문 2회를 기준으로 둘로 나눕니다. 2회 이상은 D, G, I의 3명(색칠한 줄), 2회 미만은 7명입니다.</li>
<li>쪽마다 입원 비율을 셉니다. 2회 이상은 3명 중 2명(67%), 2회 미만은 7명 중 1명(14%)입니다. 이것이 이 자료에서 배운 규칙입니다.</li>
<li>정답을 모르는 새 환자 K(2022년 응급실 2회)에게 규칙을 적용하면 예측 확률은 67%입니다.</li>
</ol>
<p>이것은 1장 결정트리가 하는 일의 가장 작은 형태입니다. 같은 일을 공통 자료의 학습 자료(나 절)로 하면 응급실 2회 이상인 184명의 입원 비율은 20.7%, 2회 미만인 11,066명은 3.8%입니다. 10명으로 배운 67%가 얼마나 불안정한 값인지 알 수 있습니다.</p>

<h3>통계 과목의 회귀와 무엇이 다른가</h3>
<p>로지스틱 회귀와 선형회귀는 통계 과목에서도 썼습니다. 식은 같고 목적이 다릅니다(<a href="stats.html#ch09-s1">통계 9장 가 절</a>의 '원인 모형과 예측모형').</p>

<tbody>
<tr><td>질문</td><td>SGLT2 억제제가 입원 오즈를 몇 배로 바꾸는가</td><td>이 사람의 내년 응급 입원 확률은 얼마인가</td></tr>
<tr><td>보는 결과</td><td>계수 하나의 크기, 신뢰구간, p 값</td><td>모형을 만들 때 쓰지 않은 사람에서 예측이 얼마나 맞는가</td></tr>

<p>열의 뜻은 다음과 같습니다. 이 사이트가 만든 가상 자료이며 실제 환자 자료가 아닙니다. 만들 때 정해 둔 참 구조가 있어서, 뒤의 장에서 모형이 무엇을 잡아내고 무엇을 놓치는지 견주어 볼 수 있습니다. 같은 생성식으로 자료를 여러 벌(seed 22개) 만들어 본 뒤, 이 과목의 분할에서 모형들의 성능 순서가 같은 생성식으로 만든 큰 모의 집단의 평균적인 순서와 같게 나온 한 벌을 골라 공개했습니다. 그래서 뒤의 장에서 보는 모형 사이의 순서는 이 생성식에서 전형적인 순서이지만, 차이가 작은 곳은 다른 분할이나 다른 자료에서 뒤집힐 수 있습니다.</p>

<div class="cell"><div class="cell-h"><span class="cell-n">셀 3</span><span class="cell-t">결측이 있는 열과 나이별 검진 결측</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">miss = df.isna().mean().round(3)          # 열마다 결측 비율

<li><code>df.isna().mean()</code><span><code>isna()</code>는 결측이면 True인 같은 크기의 표를 만들고(<a href="stats.html#lab11-s1">실습 11 가 절</a>), <code>.mean()</code>은 열마다 True의 비율을 냅니다. True는 1, False는 0으로 계산되기 때문입니다.</span></li>
<li><code>miss[miss &gt; 0]</code><span>결측 비율이 0보다 큰 열만 고릅니다. 조건으로 고르기는 <a href="stats.html#lab00-s6">실습 0 바 절</a>과 같습니다.</span></li>
<li><code>pd.cut(df["age"], [39, 64, 79, 99])</code><span>나이를 40–64, 65–79, 80–99세의 세 구간으로 나눈 열입니다(<a href="stats.html#lab04-s4">실습 4 라 절</a>). <code>(39, 64]</code>는 39 초과 64 이하라는 뜻입니다.</span></li>
<li><code>df["bmi"].isna().groupby(age_grp, observed=True).mean()</code><span>BMI의 결측 여부(True/False)를 나이 구간별로 묶어 비율을 냅니다. <code>groupby</code>에는 열 이름 대신 같은 길이의 다른 열을 넣을 수도 있습니다. <code>observed=True</code>는 사람이 없는 구간을 빼라는 뜻이고, pandas 2에서 경고가 나오지 않게 해 줍니다.</span></li>
</ol></details>

<h3>특성 X와 목표 y</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 4</span><span class="cell-t">특성 X와 목표 y</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">y = df[&quot;admit_2023&quot;]                                  # 목표
X = df.drop(columns=[&quot;id&quot;, &quot;admit_2023&quot;, &quot;cost_2023&quot;])  # 특성
print(X.shape, y.shape)
print(X.dtypes.value_counts())</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>(15000, 39) (15000,)<span class="mk">1</span>
int64      30
float64     5
str         4<span class="mk">2</span>
Name: count, dtype: int64</pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">3개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>y = df["admit_2023"]</code><span>분류의 목표를 <code>y</code>에 담습니다. 특성을 대문자 <code>X</code>, 목표를 소문자 <code>y</code>로 쓰는 관례는 <a href="stats.html#lab09-s4">실습 9 라 절</a>과 같습니다.</span></li>
<li><code>X = df.drop(columns=["id", "admit_2023", "cost_2023"])</code><span>세 열을 뺀 나머지 39개 열이 특성입니다. <code>id</code>는 번호일 뿐이고, <code>cost_2023</code>은 2023년의 값이라 2022년 말에는 알 수 없으므로 특성에 넣으면 안 됩니다(다 절의 자료 누수).</span></li>
<li><code>X.dtypes.value_counts()</code><span>열의 자료형별 개수입니다.</span></li>
</ol></details>
<ol class="marks">
<li><span class="mk">1</span><span><b>(15000, 39) (15000,).</b> X는 15,000행 39열의 표, y는 15,000개 값의 한 줄입니다. 두 행의 순서가 같아 n번째 행의 특성과 n번째 목표가 한 사람의 것입니다.</span></li>
<li><span class="mk">2</span><span><b>str 4.</b> 글자 열이 4개(<code>insurance</code>, <code>region</code>, <code>smoking</code>, <code>alcohol</code>)입니다. pandas 2에서는 <code>object</code>로 표시됩니다. 숫자 열 35개 가운데 소수점이 있는 <code>cost_2022</code>와 결측이 섞인 검진 수치 네 열이 실수(float64)이고 나머지는 정수입니다.</span></li>
</ol>

<h3>fit과 predict</h3>
<p>scikit-learn의 모든 모형은 같은 순서로 씁니다. 모형을 고르고(만들고), <code>fit</code>으로 배우고, <code>predict</code>나 <code>predict_proba</code>로 예측합니다. 결측이 없는 특성 3개로 해 봅니다.</p>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 5</span><span class="cell-t">fit과 predict</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.linear_model import LogisticRegression

cols3 = [&quot;age&quot;, &quot;n_ed&quot;, &quot;n_drugs&quot;]       # 결측이 없는 특성 3개
model = LogisticRegression()             # (1) 모형을 고른다
model.fit(X[cols3], y)                   # (2) 정답이 있는 자료로 배운다

new = pd.DataFrame({&quot;age&quot;: [55, 85], &quot;n_ed&quot;: [0, 2],
                    &quot;n_drugs&quot;: [3, 11]})  # 새로운 두 사람
print(model.predict(new))                # (3) 예측: 0 또는 1
print(model.predict_proba(new).round(3)) #     예측: 확률</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>[0 0]<span class="mk">1</span>
[[0.978 0.022]<span class="mk">2</span>
 [0.64  0.36 ]<span class="mk">3</span>]</pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">5개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>model = LogisticRegression()</code><span>로지스틱 회귀 모형을 하나 만듭니다. 아직 아무것도 배우지 않은 빈 틀이며, 이런 모형 객체를 scikit-learn에서는 <strong>추정기</strong><span class="en">(estimator)</span>라고 부릅니다. 괄호 안에는 조절값, 곧 사람이 미리 정해 주는 설정을 넣습니다(라 절).</span></li>
<li><code>model.fit(X[cols3], y)</code><span>15,000행 × 3열의 특성과 15,000개의 정답으로 계수를 찾아 <code>model</code> 안에 저장합니다(<code>model.coef_</code>, <code>model.intercept_</code>). 결과를 다른 이름에 담지 않아도 <code>model</code> 자체가 바뀝니다.</span></li>
<li><code>new = pd.DataFrame({…})</code><span>예측할 새 두 사람입니다. 열 이름과 순서를 학습 때와 같게 맞춥니다.</span></li>
<li><code>model.predict(new)</code><span>사람마다 0 또는 1을 돌려줍니다. 입원 확률이 0.5 이상이면 1입니다.</span></li>
<li><code>model.predict_proba(new)</code><span>사람마다 [입원 안 할 확률, 입원할 확률]의 두 열을 돌려줍니다. 열의 순서와 <code>[:, 1]</code>의 뜻은 <a href="stats.html#lab09-s4">실습 9 라 절</a>에 자세히 있습니다.</span></li>
</ol></details>
<h4>출력 읽기</h4>
<ol class="marks">
<li><span class="mk">1</span><span><b>[0 0].</b> 두 사람 모두 '입원 안 함'으로 예측했습니다.</span></li>
<li><span class="mk">2</span><span><b>0.022.</b> 55세, 응급실 0회, 약 3가지인 사람의 입원 확률은 2.2%입니다.</span></li>
<li><span class="mk">3</span><span><b>0.36.</b> 85세, 응급실 2회, 약 11가지인 사람은 36%로 평균(4%)의 9배인데도 0.5에 못 미쳐 0으로 예측됩니다. 드문 결과에서는 <code>predict</code>의 0/1이 거의 언제나 0이라서 확률을 직접 씁니다(마 절).</span></li>
</ol>
<p>이 셀은 15,000명 전체로 배웠습니다. 쓰는 법을 보이려는 것이고, 성능을 재려면 배울 자료와 시험할 자료를 나눠야 합니다(나 절).</p>

<div class="callout warn"><p class="ct">흔한 오해</p>
<p><span class="wrong">예측을 잘하는 모형에 들어간 특성은 결과의 원인이다.</span> 예측모형은 함께 움직이는 관계를 이용할 뿐입니다. 이 자료를 만들 때 처방한 의사 수(<code>n_prescribers</code>)는 입원에 아무 영향도 주지 않게 했지만, 아픈 사람일수록 의사를 많이 만나므로 의사 5명 이상인 사람의 입원 비율은 10.5%로 2명 이하(3.1%)보다 높습니다. 특성이 원인인지는 통계 과목의 원인 모형과 연구 설계로 따집니다.</p></div>

<div class="keypoints"><p class="kt">정리</p><ul>
<li>지도학습은 특성과 정답(목표)이 함께 있는 자료로 규칙을 배워, 정답을 모르는 새 사람의 목표를 예측하는 일입니다. 목표가 범주이면 분류, 숫자이면 회귀입니다.</li>
<li>이 과목의 자료는 15,000명, 특성 39개, 목표 두 개(<code>admit_2023</code> 4.08%, <code>cost_2023</code> 중앙값 116만원)입니다. 검진 여섯 열은 약 31%가 비어 있고 나이가 많을수록 더 비어 있습니다.</li>
<li>scikit-learn은 모형 만들기 → <code>fit(X, y)</code> → <code>predict</code>/<code>predict_proba</code>의 순서로 씁니다. 드문 결과에서는 0/1 예측보다 확률을 봅니다.</li>
</ul></div>
</section>

<!-- ============================================================ 나 -->
<section class="sec" id="ml00-s2">
<h2><span class="sec-no">나.</span>자료 나누기</h2>

<h3>쉽게 말하면</h3>
<p>국가시험 기출문제로 공부한 뒤 같은 기출문제로 모의고사를 보면 점수가 높게 나오지만, 그 점수는 실력이 아니라 기억력입니다. 실력을 재려면 처음 보는 문제가 필요합니다. 모형도 같습니다.</p>
<ul>
<li><b>학습 자료와 시험 자료.</b> 자료를 미리 둘로 나눠 한쪽으로만 배우고(<strong>학습 자료</strong><span class="en">, training set</span>, 실습 9의 '훈련 자료'), 다른 쪽은 성능을 잴 때까지 손대지 않습니다(<strong>시험 자료</strong><span class="en">, test set</span>).</li>
<li><b>과적합.</b> 모형이 학습 자료의 우연한 무늬까지 외워 학습 자료에서는 잘 맞고 새 자료에서는 못 맞히는 상태를 <strong>과적합</strong><span class="en">(overfitting)</span>이라고 합니다.</li>
<li><b>층화.</b> 드문 결과는 무작위로 나누면 한쪽에 몰릴 수 있습니다. 결과의 비율이 두 자료에서 같도록 나누는 것을 <strong>층화</strong><span class="en">(stratification)</span>라고 합니다.</li>
</ul>

<h3>숫자로 따라가기</h3>
<p>40명 가운데 4명에게 사건이 있고, 10명(25%)을 시험 자료로 뽑는다고 해 봅시다.</p>
<ol>
<li>층화하지 않으면 40명 가운데 10명을 아무렇게나 뽑습니다.</li>
<li>사건이 있는 4명이 한 명도 뽑히지 않을 확률은 (사건 없는 36명에서 10명을 뽑는 경우의 수) ÷ (40명에서 10명을 뽑는 경우의 수) = <sub>36</sub>C<sub>10</sub> ÷ <sub>40</sub>C<sub>10</sub> = 0.300입니다.</li>
<li>열 번에 세 번은 시험 자료에 사건이 없어 민감도도 AUC도 계산할 수 없습니다.</li>
<li>층화하면 사건 있는 4명과 없는 36명에서 따로 25%씩 뽑으므로 시험 자료에 사건 1명, 사건 없는 9명이 들어갑니다.</li>
</ol>
<p>공통 자료처럼 15,000명에 사건 612명이면 이렇게 극단적이지는 않지만, 셀 7에서 보듯 층화하지 않은 분할 다섯 번에서 시험 자료의 사건 수가 138–160명으로 흔들립니다.</p>

<h3>이 과목의 분할</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 6</span><span class="cell-t">이 과목의 분할 (모든 장이 같은 분할)</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.model_selection import train_test_split

X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.25, stratify=y, random_state=2026)
print(X_train.shape, X_test.shape)
print(&quot;events:&quot;, y_train.sum(), y_test.sum())
print(&quot;rate  :&quot;, round(y_train.mean(), 4), round(y_test.mean(), 4))</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>(11250, 39) (3750, 39)<span class="mk">1</span>
events: 459 153<span class="mk">2</span>
rate  : 0.0408 0.0408<span class="mk">3</span></pre></div></div>
<p><code>train_test_split</code>의 쓰는 법과 네 개를 돌려받는 순서는 <a href="stats.html#lab09-s4">실습 9 라 절</a>과 같습니다. 이 과목은 시험 자료 25%(<code>test_size=0.25</code>), 입원 여부로 층화(<code>stratify=y</code>), seed 2026(<code>random_state=2026</code>)으로 나눕니다.</p>
<ol class="marks">
<li><span class="mk">1</span><span><b>(11250, 39) (3750, 39).</b> 학습 자료 11,250명, 시험 자료 3,750명입니다. 열(특성 39개)은 그대로입니다.</span></li>
<li><span class="mk">2</span><span><b>입원 459명과 153명.</b> 612명이 3 대 1로 나뉘었습니다.</span></li>
<li><span class="mk">3</span><span><b>0.0408과 0.0408.</b> 층화 덕분에 두 자료의 입원 비율이 전체(4.08%)와 같습니다.</span></li>
</ol>
<div class="callout note"><p class="ct">참고 · 이 과목의 약속</p>
<p>1–6장은 모두 이 셀과 똑같은 코드로 같은 사람들을 나눕니다. 그래야 장마다 다른 모형의 시험 성능을 같은 3,750명에서 비교할 수 있습니다. 회귀의 목표(<code>cost_2023</code>)도 같은 사람들로 나눕니다(셀 23). 시험 자료는 장마다 모형을 다 고른 뒤 마지막에 한 번만 씁니다(라 절).</p></div>

<div class="cell"><div class="cell-h"><span class="cell-n">셀 7</span><span class="cell-t">stratify 없이 나누면</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">for seed in [1, 2, 3, 4, 5]:
    _, _, _, yt = train_test_split(X, y, test_size=0.25,
                                   random_state=seed)
    print(&quot;seed&quot;, seed, &quot;events in test:&quot;, yt.sum(),
          &quot; rate:&quot;, round(yt.mean(), 4))</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>seed 1 events in test: 152  rate: 0.0405
seed 2 events in test: 159  rate: 0.0424
seed 3 events in test: 154  rate: 0.0411
seed 4 events in test: 160<span class="mk">2</span>  rate: 0.0427
seed 5 events in test: 138<span class="mk">1</span>  rate: 0.0368</pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">2개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>for seed in [1, 2, 3, 4, 5]:</code><span>seed를 다섯 번 바꿔 가며 아래 줄을 반복합니다. <code>stratify</code>는 주지 않았습니다.</span></li>
<li><code>_, _, _, yt = train_test_split(…)</code><span>돌려받는 네 개 가운데 마지막(시험 자료의 y)만 <code>yt</code>에 담고, 쓰지 않을 셋은 관례상 밑줄 <code>_</code>에 담아 버립니다.</span></li>
</ol></details>
<ol class="marks">
<li><span class="mk">1</span><span><b>seed 5에서 138명(3.68%).</b></span></li>
<li><span class="mk">2</span><span><b>seed 4에서 160명(4.27%).</b> 층화하지 않으면 어떤 seed를 고르느냐에 따라 시험 자료의 사건이 22명이나 달라집니다. 시험 자료의 사건이 적을수록 그 자료로 잰 성능도 흔들립니다.</span></li>
</ol>

<h3>배운 자료로 시험하면</h3>
<p>깊이 제한이 없는 결정트리는 학습 자료를 끝까지 쪼개 사람들을 거의 외울 수 있습니다. 1장에서 다룰 모형이지만 과적합을 보이기에 가장 좋아서 먼저 씁니다. 결측이 없는 특성 7개만 썼습니다.</p>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 8</span><span class="cell-t">배운 자료로 시험하면</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.tree import DecisionTreeClassifier
from sklearn.metrics import roc_auc_score

cols = [&quot;age&quot;, &quot;female&quot;, &quot;n_outpt&quot;, &quot;n_ed&quot;, &quot;n_admit&quot;,
        &quot;n_drugs&quot;, &quot;cost_2022&quot;]
tree = DecisionTreeClassifier(random_state=0)   # 깊이 제한 없음
tree.fit(X_train[cols], y_train)

p_tr = tree.predict_proba(X_train[cols])[:, 1]
p_te = tree.predict_proba(X_test[cols])[:, 1]
print(&quot;train AUC:&quot;, round(roc_auc_score(y_train, p_tr), 3))
print(&quot;test AUC :&quot;, round(roc_auc_score(y_test, p_te), 3))
print(&quot;leaves:&quot;, tree.get_n_leaves())</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>train AUC: 1.0<span class="mk">1</span>
test AUC : 0.558<span class="mk">2</span>
leaves: 838<span class="mk">3</span></pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">4개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>DecisionTreeClassifier(random_state=0)</code><span>결정트리 분류 모형입니다. 깊이를 정하는 조절값을 주지 않았으므로 잎마다 한 범주만 남을 때까지 나눕니다. <code>random_state</code>는 같은 결과가 나오게 하는 seed입니다.</span></li>
<li><code>p_tr = tree.predict_proba(X_train[cols])[:, 1]</code><span>배운 자료인 학습 자료에서의 입원 확률입니다. <code>p_te</code>는 처음 보는 시험 자료에서의 확률입니다.</span></li>
<li><code>roc_auc_score(y_train, p_tr)</code><span>AUC(C 통계량)입니다. 실제 결과와 확률을 이 순서로 넣습니다(<a href="stats.html#lab09-s4">실습 9 라 절</a>).</span></li>
<li><code>tree.get_n_leaves()</code><span>트리 끝에 있는 잎의 수입니다.</span></li>
</ol></details>
<h4>출력 읽기</h4>
<ol class="marks">
<li><span class="mk">1</span><span><b>학습 자료 AUC 1.0.</b> 학습 자료 11,250명의 입원자와 비입원자를 완벽하게 갈랐습니다.</span></li>
<li><span class="mk">2</span><span><b>시험 자료 AUC 0.558.</b> 처음 보는 3,750명에서는 동전 던지기(0.5)보다 조금 나은 정도입니다. 학습 자료의 점수가 실력이 아니었습니다.</span></li>
<li><span class="mk">3</span><span><b>잎 838개.</b> 잎 하나에 평균 13명 정도입니다. 트리가 일반적인 규칙을 배운 것이 아니라 작은 무리를 하나하나 외웠습니다. 1장에서 깊이와 잎의 크기를 제한해 이 차이를 줄입니다.</span></li>
</ol>

<div class="callout warn"><p class="ct">흔한 오해</p>
<ul>
<li><span class="wrong">학습 자료에서 AUC가 1.0이 나왔으니 아주 좋은 모형이다.</span> 셀 8의 트리는 학습 자료에서 1.0, 시험 자료에서 0.558이었습니다. 모형의 성능은 배우지 않은 자료에서 잽니다.</li>
<li><span class="wrong">한 번 나눠 얻은 시험 AUC는 그 모형의 정확한 성능이다.</span> 시험 자료의 사건이 153명뿐이라 시험 AUC도 표본 변동이 있습니다. 라 절에서 고른 모형의 시험 AUC 0.742는 95% 부트스트랩 신뢰구간이 0.695–0.785입니다(구한 방법은 마 절 논문 상자의 해설 1). 표본이 크지 않으면 자료를 나누기보다 전체로 만들고 부트스트랩으로 검증하는 편이 낫다는 점은 <a href="stats.html#ch09-s1">통계 9장</a>의 '내부 검증과 외부 검증'에 있습니다.</li>
</ul></div>

<div class="keypoints"><p class="kt">정리</p><ul>
<li>같은 자료로 배우고 시험하면 점수가 부풀려집니다. 깊이 제한 없는 트리는 학습 자료 AUC 1.0, 시험 자료 0.558이었습니다(과적합).</li>
<li>드문 결과는 <code>stratify=y</code>로 층화해 나눕니다. 이 과목의 분할은 <code>test_size=0.25, stratify=y, random_state=2026</code>이고 1–6장이 모두 같은 분할을 씁니다.</li>
</ul></div>
</section>

<!-- ============================================================ 다 -->
<section class="sec" id="ml00-s3">
<h2><span class="sec-no">다.</span>전처리와 파이프라인</h2>

<h3>쉽게 말하면</h3>
<p>자료를 모형이 받을 수 있는 모양으로 바꾸는 일을 <strong>전처리</strong><span class="en">(preprocessing)</span>라고 합니다. 조제 과정이 정해진 순서대로 매번 똑같이 이루어져야 하듯, 전처리도 학습 자료에서 정한 기준을 시험 자료와 새 환자에게 그대로 적용해야 합니다.</p>
<ul>
<li><b>결측 대체.</b> 빈칸을 값으로 채웁니다(<strong>결측 대체</strong><span class="en">, imputation</span>). 숫자 열은 학습 자료의 중앙값으로, 글자 열은 'missing'이라는 범주로 채웁니다.</li>
<li><b>원-핫 인코딩.</b> 글자 범주를 범주마다 0/1 열 하나씩으로 바꿉니다(<strong>원-핫 인코딩</strong><span class="en">, one-hot encoding</span>). 통계 과목의 가변수(<a href="stats.html#ch08-s7">통계 8장 사 절</a>)와 같은 생각이고, 기준범주를 빼지 않고 범주마다 열을 만든다는 점만 다릅니다.</li>
<li><b>표준화.</b> 숫자 열마다 평균을 빼고 표준편차로 나눠 평균 0, 표준편차 1로 맞춥니다(<strong>표준화</strong><span class="en">, standardization</span>). 단위가 다른 특성에 벌점(라 절의 규제)을 공평하게 주고 계산을 빨리 끝내게 합니다.</li>
<li><b>파이프라인.</b> 위 단계와 모형을 하나로 묶은 것이 <strong>파이프라인</strong><span class="en">(pipeline)</span>입니다. <code>fit</code> 한 번에 학습 자료로만 기준을 정하고, <code>predict</code> 때 같은 기준을 적용합니다.</li>
</ul>

<h3>숫자로 따라가기</h3>

<li><code>X_train[["smoking"]].fillna("missing")</code><span><code>fillna</code>는 결측을 정한 값으로 채웁니다. 대괄호를 두 겹 써서 한 열짜리 표(DataFrame)로 꺼냈습니다. scikit-learn의 전처리기는 2차원(행 × 열)을 받기 때문입니다. 파이프라인에서는 같은 일을 <code>SimpleImputer(strategy="constant", fill_value="missing")</code>이 합니다.</span></li>
<li><code>OneHotEncoder(handle_unknown="ignore", sparse_output=False)</code><span><code>handle_unknown="ignore"</code>는 학습 자료에 없던 범주가 새 자료에 나오면 오류 대신 모든 열을 0으로 두라는 뜻입니다. <code>sparse_output=False</code>는 결과를 보통의 배열로 달라는 뜻입니다(기본은 0을 생략해 저장하는 희소 행렬). 이 인자 이름은 scikit-learn 1.2부터 쓰며, 그보다 오래된 버전은 <code>sparse=False</code>입니다.</span></li>

<p><code>StandardScaler</code>의 쓰는 법은 <a href="stats.html#lab09-s4">실습 9 라 절</a>과 같습니다. 출력 <span class="mk">1</span>의 <code>mean_</code>은 학습 자료의 평균(나이 59.01세, 외래 18.17회), <span class="mk">2</span>의 <code>scale_</code>은 표준편차입니다. <code>StandardScaler</code>는 n − 1이 아니라 n으로 나눈 표준편차를 써서 pandas의 <code>.std()</code>와 끝자리가 조금 다를 수 있습니다. <span class="mk">3</span> 471번은 나이가 평균보다 1.16 표준편차 적고, 외래 방문이 1회로 0.72 표준편차 적습니다.</p>

<h3>ColumnTransformer와 Pipeline</h3>
<p>숫자 열과 글자 열은 처리 방법이 다릅니다. 열 종류마다 다른 단계를 거친 뒤 옆으로 이어 붙이는 도구가 <code>ColumnTransformer</code>이고, 전처리와 모형을 차례로 묶는 도구가 <code>Pipeline</code>입니다. 이 장의 파이프라인은 다음과 같습니다.</p>
<div class="tbl-wrap"><table class="tbl">
<thead><tr><th>열</th><th>1단계 · 결측 대체</th><th>2단계 · 변환</th><th class="r">결과 열</th></tr></thead>
<tbody>
<tr><td>숫자 35개</td><td>학습 자료의 중앙값 (<code>SimpleImputer</code>)</td><td>표준화 (<code>StandardScaler</code>)</td><td class="r">35</td></tr>
<tr><td>글자 4개</td><td>"missing" 범주 (<code>SimpleImputer</code>)</td><td>원-핫 (<code>OneHotEncoder</code>)</td><td class="r">13</td></tr>
<tr class="hi"><td colspan="3">이어 붙인 48열 → 로지스틱 회귀</td><td class="r">48</td></tr>
</tbody></table></div>
<p>이 묶음을 장마다 다시 쓰도록 함수로 만듭니다.</p>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 13</span><span class="cell-t">ColumnTransformer와 Pipeline</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.compose import ColumnTransformer
from sklearn.pipeline import Pipeline

def make_pipe(model, num=num_cols, cat=cat_cols):
    &quot;&quot;&quot;전처리(결측 대체, 표준화, 원-핫)와 모형을 묶습니다.&quot;&quot;&quot;
    num_steps = Pipeline([
        (&quot;impute&quot;, SimpleImputer(strategy=&quot;median&quot;)),
        (&quot;scale&quot;, StandardScaler())])
    cat_steps = Pipeline([
        (&quot;impute&quot;, SimpleImputer(strategy=&quot;constant&quot;,
                                 fill_value=&quot;missing&quot;)),
        (&quot;onehot&quot;, OneHotEncoder(handle_unknown=&quot;ignore&quot;,
                                 sparse_output=False))])
    prep = ColumnTransformer([(&quot;num&quot;, num_steps, num),
                              (&quot;cat&quot;, cat_steps, cat)])
    return Pipeline([(&quot;prep&quot;, prep), (&quot;model&quot;, model)])

pipe = make_pipe(LogisticRegression(max_iter=1000))
pipe.fit(X_train, y_train)
Z = pipe.named_steps[&quot;prep&quot;].transform(X_test)
print(&quot;after prep:&quot;, Z.shape)
p_test = pipe.predict_proba(X_test)[:, 1]
print(&quot;test AUC:&quot;, round(roc_auc_score(y_test, p_test), 3))</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>after prep: (3750, 48)<span class="mk">1</span>
test AUC: 0.74<span class="mk">2</span></pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">8개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>def make_pipe(model, num=num_cols, cat=cat_cols):</code><span>파이프라인을 만들어 돌려주는 함수를 정의합니다. <code>model</code>에는 모형 객체를 받고, <code>num</code>과 <code>cat</code>에는 숫자 열과 글자 열의 이름 목록을 받습니다. 둘은 기본값이 있어서 생략하면 셀 9의 <code>num_cols</code>, <code>cat_cols</code>를 씁니다. 모형만 바꿔 <code>make_pipe(LinearRegression())</code>처럼 부르면 같은 전처리를 거친 다른 모형이 됩니다(셀 23).</span></li>
<li><code>Pipeline([("impute", …), ("scale", …)])</code><span>(이름, 단계) 짝의 목록입니다. 앞 단계의 출력이 다음 단계의 입력이 됩니다. 이름은 마음대로 짓되, 라 절에서 조절값을 부를 때 씁니다.</span></li>
<li><code>SimpleImputer(strategy="constant", fill_value="missing")</code><span>글자 열의 결측을 "missing"이라는 글자로 채웁니다.</span></li>
<li><code>ColumnTransformer([("num", num_steps, num), ("cat", cat_steps, cat)])</code><span>(이름, 처리, 열 목록)의 짝마다 그 열들만 꺼내 처리한 뒤 결과를 옆으로 이어 붙입니다. 목록에 없는 열은 버립니다. 그래서 과제 1처럼 열 목록만 바꿔 특성 묶음을 바꿀 수 있습니다.</span></li>
<li><code>return Pipeline([("prep", prep), ("model", model)])</code><span>전처리(<code>"prep"</code>)와 모형(<code>"model"</code>)을 묶어 돌려줍니다.</span></li>
<li><code>pipe.fit(X_train, y_train)</code><span>학습 자료로 ① 숫자 열의 중앙값을 구해 채우고 ② 평균과 표준편차를 구해 표준화하고 ③ 글자 열의 범주 목록을 기억해 원-핫으로 바꾼 뒤 ④ 48열로 로지스틱 회귀를 학습합니다.</span></li>
<li><code>pipe.named_steps["prep"].transform(X_test)</code><span>파이프라인 안의 단계를 이름으로 꺼내 전처리만 해 본 것입니다. 시험 자료에는 학습 자료에서 구한 기준이 그대로 쓰입니다.</span></li>
<li><code>pipe.predict_proba(X_test)[:, 1]</code><span>시험 자료를 같은 전처리에 통과시킨 뒤 입원 확률을 냅니다.</span></li>
</ol></details>
<h4>출력 읽기</h4>
<ol class="marks">
<li><span class="mk">1</span><span><b>(3750, 48).</b> 숫자 35열과 원-핫 13열(보험 2, 지역 3, 흡연 4, 음주 4)입니다.</span></li>
<li><span class="mk">2</span><span><b>시험 AUC 0.740.</b> 출력의 0.74는 <code>round(…, 3)</code>의 결과 0.740에서 끝자리 0이 생략된 것입니다. 셀 8의 깊은 트리(0.558)보다 훨씬 낫습니다. 이 장에서는 현상을 보여 주려고 시험 자료를 여러 번 들여다보지만, 실제 분석에서는 라 절의 순서를 따릅니다.</span></li>
</ol>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 14</span><span class="cell-t">표준화하지 않으면</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">raw = Pipeline([(&quot;impute&quot;, SimpleImputer(strategy=&quot;median&quot;)),
                (&quot;model&quot;, LogisticRegression())])   # 표준화 없음
raw.fit(X_train[num_cols], y_train)
print(&quot;iterations, no scaling:&quot;, raw.named_steps[&quot;model&quot;].n_iter_)
print(&quot;iterations, scaled    :&quot;, pipe.named_steps[&quot;model&quot;].n_iter_)</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>iterations, no scaling: [100]<span class="mk">1</span>
iterations, scaled    : [33]<span class="mk">2</span></pre><pre class="warn-out">ConvergenceWarning: lbfgs failed to converge after 100 iteration(s) (status=1):

Please also refer to the documentation for alternative solver options:
    https://scikit-learn.org/stable/modules/linear_model.html#logistic-regression</pre></div></div>
<p>로지스틱 회귀는 계수를 한 번에 계산하지 못하고 조금씩 고쳐 가는 반복 계산으로 찾습니다. 더 고칠 것이 없는 상태에 이르는 것을 <strong>수렴</strong><span class="en">(convergence)</span>이라고 합니다. 셀 14는 표준화를 빼고 같은 모형을 적합한 것입니다. <code>n_iter_</code>는 실제로 반복한 횟수입니다.</p>
<ol class="marks">
<li><span class="mk">1</span><span><b>표준화하지 않으면 [100].</b> 기본 한도 100회를 다 쓰고도 수렴하지 못해 노란 상자의 <code>ConvergenceWarning</code>이 나왔습니다. 2022년 의료비(0–7,950)와 여성(0/1)처럼 크기가 크게 다른 열이 섞이면 계산이 더딥니다. 경고 문구는 버전에 따라 다릅니다.</span></li>
<li><span class="mk">2</span><span><b>표준화하면 [33].</b> 33회 만에 끝났습니다. 해결 방법은 표준화(권장)나 <code>max_iter</code>를 늘리는 것입니다. <code>make_pipe</code>에 넣은 로지스틱 회귀에 모두 <code>max_iter=1000</code>을 준 것은 여유를 두려는 것입니다. 경고를 무시하고 넘어가면 덜 계산된 계수로 예측하게 됩니다.</span></li>
</ol>

<h3>자료 누수</h3>
<p>예측하는 시점에는 알 수 없는 정보가 학습에 섞여 들어가는 것을 <strong>자료 누수</strong><span class="en">(data leakage)</span>라고 합니다. 2022년 말에 2023년을 예측하는 모형이라면 특성은 모두 2022년 12월 31일까지의 기록이어야 합니다. 응급 입원은 대개 응급실을 거치므로 '2023년 응급실 방문 수'는 결과와 거의 같은 정보입니다. 이 열을 실수로 넣었다고 해 봅시다. 공개 자료에는 없으므로 결과를 이용해 흉내 낸 열을 만듭니다.</p>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 15</span><span class="cell-t">자료 누수: 결과 뒤의 정보가 섞이면</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">rng = np.random.default_rng(0)
# 2023년(결과 기간)의 응급실 방문 수를 흉내 낸 열. 실제로는 쓰면 안 됨
ed_2023 = np.where(y == 1, rng.poisson(1.5, len(y)) + 1,
                   rng.poisson(0.08, len(y)))
X_leak = X.assign(n_ed_2023=ed_2023)

XL_train, XL_test = train_test_split(
    X_leak, test_size=0.25, stratify=y, random_state=2026)
leaky = make_pipe(LogisticRegression(max_iter=1000),
                  num=num_cols + [&quot;n_ed_2023&quot;])
leaky.fit(XL_train, y_train)
p_leak = leaky.predict_proba(XL_test)[:, 1]
print(&quot;test AUC with n_ed_2023:&quot;, round(roc_auc_score(y_test, p_leak), 3))</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>test AUC with n_ed_2023: 0.996<span class="mk">1</span></pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">4개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>np.where(y == 1, rng.poisson(1.5, len(y)) + 1, rng.poisson(0.08, len(y)))</code><span>입원한 사람은 1회 이상(평균 2.5회), 입원하지 않은 사람은 대부분 0회인 가짜 열입니다. <code>np.where(조건, 참일 때, 거짓일 때)</code>는 <a href="stats.html#lab05-s3">실습 5 다 절</a>, <code>rng.poisson(평균, 개수)</code>는 포아송 분포의 난수입니다.</span></li>
<li><code>X_leak = X.assign(n_ed_2023=ed_2023)</code><span>새 열을 붙인 복사본입니다(<a href="stats.html#lab09-s2">실습 9 나 절</a>의 <code>assign</code>).</span></li>
<li><code>train_test_split(X_leak, test_size=0.25, stratify=y, random_state=2026)</code><span>y를 넘기지 않아 두 개만 돌려받습니다. 같은 y, 같은 비율, 같은 seed이므로 셀 6과 같은 사람들이 나뉩니다.</span></li>
<li><code>make_pipe(…, num=num_cols + ["n_ed_2023"])</code><span>숫자 열 목록에 새 열을 더해 같은 파이프라인을 만듭니다.</span></li>
</ol></details>
<ol class="marks">
<li><span class="mk">1</span><span><b>시험 AUC 0.996.</b> 0.740에서 갑자기 거의 완벽해졌습니다. 모형이 좋아진 것이 아니라 답을 보고 푼 것입니다. 실제 연구에서 이런 숫자가 나오면 먼저 특성의 측정 시점을 의심합니다. 입원 중 처방, 퇴원 요약의 진단, 결과 기간의 의료비가 흔한 예입니다.</span></li>
</ol>
<p>누수는 전처리에서도 생깁니다. 결측 대체나 표준화의 기준을 시험 자료까지 포함한 전체 자료로 구한 뒤 나누면 시험 자료의 정보가 학습에 들어갑니다. 이 자료에서는 BMI 중앙값이 전체와 학습 자료 모두 24.4라서 시험 AUC가 0.7396과 0.7398로 거의 같지만, 결과와 상관이 큰 특성 고르기나 사건을 복제해 늘리는 처리처럼 결과를 쓰는 전처리를 나누기 전에 하면 차이가 커집니다. 파이프라인으로 묶어 두면 <code>fit</code>이 언제나 학습 자료로만 기준을 정하고, 라 절의 교차검증에서도 겹마다 다시 정하므로 이 실수를 막아 줍니다.</p>

<div class="callout warn"><p class="ct">흔한 오해</p>
<ul>
<li><span class="wrong">결측을 중앙값으로 채웠으니 결측 문제는 해결되었다.</span> 대체는 모형이 돌아가게 해 줄 뿐입니다. 이 자료의 검진 결측은 80세 이상에서 58%로 나이와 관련되어 있습니다. 숫자 열을 중앙값으로 채우면 "검진을 받지 않았다"는 정보가 사라지므로, 이 장에서는 글자 열의 'missing' 범주로 그 정보를 남겼습니다. 결측의 종류와 다중대체는 <a href="stats.html#ap01-s4">통계 부록 A 라 절</a>에 있습니다.</li>
<li><span class="wrong">특성 하나를 더했더니 시험 AUC가 0.99가 되었으니 중요한 위험인자를 찾았다.</span> 너무 좋은 결과는 누수부터 의심합니다. 행정자료로 만든 입원 예측모형의 C 통계량은 0.6–0.7대인 경우가 많습니다(통계 9장).</li>
</ul></div>

<div class="keypoints"><p class="kt">정리</p><ul>
<li>숫자 열은 중앙값 대체 후 표준화, 글자 열은 'missing' 범주로 채운 뒤 원-핫 인코딩합니다. 기준값은 모두 학습 자료에서 구합니다.</li>
<li><code>ColumnTransformer</code>로 열 종류마다 다른 처리를 하고 <code>Pipeline</code>으로 모형과 묶습니다. 이 장의 <code>make_pipe(model)</code>을 이후 장에서도 씁니다.</li>
<li>표준화하지 않은 로지스틱 회귀는 수렴 경고가 나기 쉽습니다. 경고를 그냥 넘기지 않습니다.</li>
<li>예측 시점 이후의 정보가 특성에 섞이면 시험 AUC가 0.996처럼 비현실적으로 높아집니다(자료 누수).</li>
</ul></div>
</section>

<section class="sec" id="ml00-s4">
<h2><span class="sec-no">라.</span>교차검증과 조절값 탐색</h2>

<h3>쉽게 말하면</h3>
<p>모형에는 자료에서 배우는 값(로지스틱 회귀의 계수)과 사람이 미리 정해 주는 값이 있습니다. 미리 정해 주는 값을 <strong>조절값</strong><span class="en">(hyperparameter, 하이퍼파라미터)</span>이라고 합니다. 로지스틱 회귀의 <code>C</code>는 계수를 0 쪽으로 줄이는 벌점, 곧 <strong>규제</strong><span class="en">(regularization)</span>의 세기를 정하며, 작을수록 규제가 강합니다(<a href="stats.html#lab09-s4">실습 9 라 절</a>, 자세히는 6장). 좋은 C를 고르려면 여러 값을 비교해야 하는데, 시험 자료로 비교하면 시험 자료가 더 이상 처음 보는 자료가 아니게 됩니다. 그래서 학습 자료 안에서 다시 나눠 점수를 매깁니다.</p>
<ul>
<li><b>검증 자료.</b> 학습 자료 안에서 조절값을 고르는 데 쓰려고 떼어 둔 부분을 <strong>검증 자료</strong><span class="en">(validation set)</span>라고 합니다.</li>
<li><b>k겹 교차검증.</b> 학습 자료를 k개의 <strong>겹</strong><span class="en">(fold)</span>으로 나눠 한 겹씩 돌아가며 검증 자료로 쓰고 k개의 점수를 평균합니다(<strong>교차검증</strong><span class="en">, cross-validation</span>). 모든 사람이 한 번씩 검증에 쓰이므로, 검증 자료를 한 번 떼어 내는 것보다 덜 흔들립니다.</li>
<li><b>시험 자료는 마지막에 한 번.</b> 조절값과 모형을 모두 정한 뒤에 시험 자료로 한 번 평가합니다.</li>
</ul>
<figure class="fig"><div class="fig-body"><div class="fig-panel"><svg viewBox="0 0 640 300" class="viz" role="img" aria-label="자료 나누기와 5겹 교차검증" xmlns="http://www.w3.org/2000/svg"><text x="108.0" y="37.0" text-anchor="end" class="lbl strong">All 15,000</text><rect x="118.0" y="22" width="322.5" height="24" rx="3" class="a1 s1" stroke-width="1"/><text x="279.2" y="38.0" text-anchor="middle" class="lbl small">Training set 11,250 (459 events)</text><rect x="440.5" y="22" width="107.5" height="24" rx="3" class="a2 s2" stroke-width="1"/><text x="494.2" y="38.0" text-anchor="middle" class="lbl small">Test set 3,750</text><line x1="118" y1="58" x2="440.5" y2="58" class="ref" stroke-width="1"/><text x="118.0" y="76.0" text-anchor="start" class="lbl mute small">5-fold cross-validation inside the training set</text><text x="108.0" y="103.0" text-anchor="end" class="lbl">Round 1</text><rect x="119.0" y="88" width="62.5" height="20" rx="3" class="f3" stroke-width="1"/><text x="150.2" y="102.0" text-anchor="middle" class="lbl small strong">valid</text><rect x="183.5" y="88" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><text x="214.8" y="102.0" text-anchor="middle" class="lbl small">train</text><rect x="248.0" y="88" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><text x="279.2" y="102.0" text-anchor="middle" class="lbl small">train</text><rect x="312.5" y="88" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><text x="343.8" y="102.0" text-anchor="middle" class="lbl small">train</text><rect x="377.0" y="88" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><text x="408.2" y="102.0" text-anchor="middle" class="lbl small">train</text><rect x="441.5" y="88" width="106.5" height="20" rx="3" class="a4" stroke-width="1"/><text x="494.8" y="102.0" text-anchor="middle" class="lbl mute small">not used</text><text x="558.0" y="103.0" text-anchor="start" class="lbl small">AUC 0.739</text><text x="108.0" y="133.0" text-anchor="end" class="lbl">Round 2</text><rect x="119.0" y="118" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="183.5" y="118" width="62.5" height="20" rx="3" class="f3" stroke-width="1"/><text x="214.8" y="132.0" text-anchor="middle" class="lbl small strong">valid</text><rect x="248.0" y="118" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="312.5" y="118" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="377.0" y="118" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="441.5" y="118" width="106.5" height="20" rx="3" class="a4" stroke-width="1"/><text x="558.0" y="133.0" text-anchor="start" class="lbl small">AUC 0.787</text><text x="108.0" y="163.0" text-anchor="end" class="lbl">Round 3</text><rect x="119.0" y="148" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="183.5" y="148" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="248.0" y="148" width="62.5" height="20" rx="3" class="f3" stroke-width="1"/><text x="279.2" y="162.0" text-anchor="middle" class="lbl small strong">valid</text><rect x="312.5" y="148" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="377.0" y="148" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="441.5" y="148" width="106.5" height="20" rx="3" class="a4" stroke-width="1"/><text x="558.0" y="163.0" text-anchor="start" class="lbl small">AUC 0.756</text><text x="108.0" y="193.0" text-anchor="end" class="lbl">Round 4</text><rect x="119.0" y="178" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="183.5" y="178" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="248.0" y="178" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="312.5" y="178" width="62.5" height="20" rx="3" class="f3" stroke-width="1"/><text x="343.8" y="192.0" text-anchor="middle" class="lbl small strong">valid</text><rect x="377.0" y="178" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="441.5" y="178" width="106.5" height="20" rx="3" class="a4" stroke-width="1"/><text x="558.0" y="193.0" text-anchor="start" class="lbl small">AUC 0.727</text><text x="108.0" y="223.0" text-anchor="end" class="lbl">Round 5</text><rect x="119.0" y="208" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="183.5" y="208" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="248.0" y="208" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="312.5" y="208" width="62.5" height="20" rx="3" class="a1 s1" stroke-width="1"/><rect x="377.0" y="208" width="62.5" height="20" rx="3" class="f3" stroke-width="1"/><text x="408.2" y="222.0" text-anchor="middle" class="lbl small strong">valid</text><rect x="441.5" y="208" width="106.5" height="20" rx="3" class="a4" stroke-width="1"/><text x="558.0" y="223.0" text-anchor="start" class="lbl small">AUC 0.732</text><text x="558.0" y="250.0" text-anchor="start" class="lbl strong">mean 0.748</text><line x1="556" y1="236" x2="632" y2="236" class="ref" stroke-width="1"/><text x="118.0" y="276.0" text-anchor="start" class="lbl mute small">Choose C by the mean, refit on all 11,250, then evaluate once on the test set</text></svg></div></div><figcaption>그림 0-1. 이 과목의 자료 나누기와 5겹 교차검증. 시험 자료(주황)는 처음에 떼어 두고, 학습 자료를 다섯 겹으로 나눠 한 겹씩 돌아가며 검증 자료(초록)로 씁니다. 오른쪽 숫자는 셀 17에서 C = 1인 로지스틱 회귀로 구한 겹별 AUC입니다.</figcaption></figure>

<h3>숫자로 따라가기</h3>
<ol>
<li>학습 자료 11,250명을 입원 비율이 같게 다섯 겹(2,250명씩)으로 나눕니다(셀 16).</li>
<li>1회차에는 1겹을 검증 자료로 두고 나머지 4겹(9,000명)으로 C = 1인 모형을 학습해 1겹에서 AUC 0.739를 얻습니다.</li>
<li>2–5회차도 같은 방식으로 0.787, 0.756, 0.727, 0.732를 얻습니다(셀 17).</li>
<li>평균 (0.739 + 0.787 + 0.756 + 0.727 + 0.732) ÷ 5 = 0.748이 C = 1의 교차검증 AUC입니다. 겹 사이의 표준편차 0.022는 같은 모형도 누구로 평가하느냐에 따라 이만큼 달라진다는 뜻입니다.</li>
<li>C 후보 6개마다 1–4를 반복하면 30번 학습합니다. 평균이 가장 높은 C로 학습 자료 전체를 한 번 더 학습하고(31번째), 그 모형을 시험 자료에 한 번 적용합니다(셀 18, 19).</li>
</ol>

<h3>겹 나누기와 교차검증</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 16</span><span class="cell-t">5겹으로 나누기 (StratifiedKFold)</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.model_selection import StratifiedKFold

skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=2026)
for k, (tr, va) in enumerate(skf.split(X_train, y_train), start=1):
    print(&quot;fold&quot;, k, &quot; train:&quot;, len(tr), &quot; valid:&quot;, len(va),
          &quot; events in valid:&quot;, y_train.iloc[va].sum())</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>fold 1  train: 9000  valid: 2250<span class="mk">1</span>  events in valid: 91<span class="mk">2</span>
fold 2  train: 9000  valid: 2250  events in valid: 92
fold 3  train: 9000  valid: 2250  events in valid: 92
fold 4  train: 9000  valid: 2250  events in valid: 92
fold 5  train: 9000  valid: 2250  events in valid: 92</pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">4개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>StratifiedKFold(n_splits=5, shuffle=True, random_state=2026)</code><span>층화 k겹 분할기입니다. <code>n_splits</code>는 겹의 수, <code>shuffle=True</code>는 나누기 전에 순서를 섞으라는 뜻이고(자료가 어떤 순서로 정렬되어 있어도 겹이 고르게 됩니다), <code>random_state</code>는 그 섞는 순서의 seed입니다. 이 과목의 교차검증은 모두 이 설정을 씁니다.</span></li>
<li><code>skf.split(X_train, y_train)</code><span>회차마다 (학습할 행의 위치, 검증할 행의 위치) 한 쌍을 차례로 내놓습니다. 위치는 0부터 센 행의 순서이고 인덱스가 아닙니다.</span></li>
<li><code>for k, (tr, va) in enumerate(…, start=1):</code><span><code>enumerate</code>는 반복할 때마다 번호를 붙여 줍니다. <code>start=1</code>로 1부터 셉니다. 번호는 <code>k</code>에, 위치 한 쌍은 <code>tr</code>과 <code>va</code>에 담깁니다.</span></li>
<li><code>y_train.iloc[va].sum()</code><span><code>.iloc</code>은 위치로 고르는 방법입니다. 검증 겹의 입원자 수입니다.</span></li>
</ol></details>
<ol class="marks">
<li><span class="mk">1</span><span><b>학습 9,000명, 검증 2,250명.</b> 다섯 회차 모두 같습니다.</span></li>
<li><span class="mk">2</span><span><b>검증 겹의 입원 91–92명.</b> 층화 덕분에 겹마다 4.1% 안팎입니다.</span></li>
</ol>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 17</span><span class="cell-t">교차검증 AUC (cross_val_score)</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.model_selection import cross_val_score

auc5 = cross_val_score(make_pipe(LogisticRegression(max_iter=1000)),

print(auc5.round(3))
print(&quot;mean:&quot;, round(auc5.mean(), 3), &quot; SD:&quot;, round(auc5.std(), 3))</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>[0.739 0.787 0.756 0.727 0.732]<span class="mk">1</span>
mean: 0.748  SD: 0.022<span class="mk">2</span></pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">2개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>cross_val_score(make_pipe(…), X_train, y_train, cv=skf, scoring="roc_auc")</code><span>모형(파이프라인), 특성, 목표, 겹 나누는 법, 점수의 종류를 받아 다섯 번 학습하고 다섯 개의 점수를 numpy 배열로 돌려줍니다. 파이프라인을 넘겼으므로 회차마다 중앙값과 표준화 기준도 그 회차의 학습 겹으로만 다시 구합니다. <code>scoring</code>에는 <code>"accuracy"</code>, <code>"neg_mean_squared_error"</code> 같은 이름도 쓸 수 있으며, 회귀의 오차 지표는 '클수록 좋다'로 맞추려고 음수(neg)로 돌려줍니다.</span></li>
<li><code>auc5.std()</code><span>numpy의 표준편차는 n으로 나눕니다. 겹 사이의 흔들림을 보려는 값입니다.</span></li>
</ol></details>
<ol class="marks">
<li><span class="mk">1</span><span><b>겹별 AUC</b> 0.727–0.787입니다. 그림 0-1 오른쪽의 숫자입니다.</span></li>

<h3>시험 자료로 한 번 평가</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 19</span><span class="cell-t">시험 자료로 한 번 평가</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">final = gs.best_estimator_      # 고른 C로 학습 자료 전체에 다시 맞춘 모형
