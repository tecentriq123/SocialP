<p><code>gs.best_estimator_</code>는 고른 C = 0.1로 학습 자료 11,250명 전체에 다시 맞춘 파이프라인입니다. 출력 <span class="mk">1</span>의 시험 AUC 0.742는 교차검증 평균 0.7486과 비슷합니다. 둘의 차이는 시험 자료 153명의 사건에서 오는 우연 변동(95% 신뢰구간 0.695–0.785) 안에 있습니다.</p>

<div class="callout warn"><p class="ct">흔한 오해</p>
<ul>
<li><span class="wrong">교차검증 AUC가 가장 높은 C = 0.1이 C = 1보다 확실히 낫다.</span> 차이는 0.0006이고 겹 사이 SD는 0.022입니다. 순위는 같은 겹에서의 비교라 SD보다는 덜 흔들리지만, 이 정도 차이는 겹을 다르게 나누면 뒤집힐 수 있습니다. 비슷하면 단순한 쪽이나 규제가 강한 쪽을 택해도 됩니다.</li>
<li><span class="wrong">조절값은 시험 자료 성능을 보고 골라도 된다.</span> 시험 자료로 고르면 C = 0.01(시험 AUC 0.746)이 뽑힙니다. 그 0.746은 여섯 번 가운데 운이 가장 좋았던 값이라 새 환자에서의 성능보다 부풀려 있습니다. 같은 이유로 교차검증으로 고른 C의 교차검증 점수(0.7486)도 조금 낙관적입니다. 그래서 한 번도 쓰지 않은 시험 자료로 마지막 평가를 하고, 시험 자료가 따로 없을 때는 바깥 교차검증 안에서 조절값 탐색을 되풀이하는 중첩 교차검증<span class="en">(nested cross-validation)</span>을 씁니다<a class="cite" href="#ml90-ref-varma2006" title="Varma S, Simon R. Bias in error estimation when using cross-validation for model selection. BMC Bioinformatics. 2006;7:91.">[1]</a>.</li>
</ul></div>

<div class="paper">
<div class="paper-h"><b>논문에서는 이렇게 보입니다 · 예측모형의 Methods</b><span>이 장의 결과로 만든 가상의 예시</span></div>
<div class="paper-b">
<p class="excerpt">We randomly split the cohort (n = 15,000; 612 emergency admissions) into a training set (75%; n = 11,250; 459 events) and a test set (25%; n = 3,750; 153 events), <span class="hl">stratified by the outcome</span> <span class="mk">1</span>. Missing values of health-screening variables (31% to 32%) were <span class="hl">imputed with the training-set median for continuous variables and coded as a separate category for categorical variables</span> <span class="mk">2</span>; continuous predictors were standardized and categorical predictors were one-hot encoded. <span class="hl">All preprocessing steps were fitted within the training data</span> <span class="mk">3</span>. The inverse regularization strength (C) of an L2-penalized logistic regression model was selected from six values (0.001 to 100) by <span class="hl">stratified 5-fold cross-validation in the training set</span>, maximizing the area under the receiver operating characteristic curve (AUC) <span class="mk">4</span>. The final model was refitted on the entire training set and <span class="hl">evaluated once in the test set</span> <span class="mk">5</span>. Analyses were performed with scikit-learn 1.9.1<a class="cite" href="#ml90-ref-pedregosa2011" title="Pedregosa F, Varoquaux G, Gramfort A, et al. Scikit-learn: machine learning in Python. J Mach Learn Res. 2011;12:2825-2830.">[2]</a>.</p>
<ol class="marks">
<li><span class="mk">1</span><span><b>나눈 방법과 사건 수.</b> 셀 6의 출력입니다. 비율, 층화 여부, 자료마다의 사건 수를 적어야 독자가 시험 성능이 몇 명의 사건에 기댄 것인지 압니다. 이 예처럼 무작위로 나눈 시험 자료는 같은 시기·같은 기관의 자료라서 외부 검증이 아니라 내부 검증입니다.</span></li>
<li><span class="mk">2</span><span><b>결측의 비율과 처리.</b> 셀 3과 셀 13입니다. 어떤 값으로 채웠는지, 결측을 범주로 남겼는지를 적습니다. 결측이 많으면 다중대체 같은 다른 처리와 비교한 민감도 분석을 덧붙이기도 합니다.</span></li>
<li><span class="mk">3</span><span><b>전처리를 학습 자료 안에서.</b> 셀 15 아래 문단의 누수를 피했다는 문장입니다. 파이프라인을 썼다면 교차검증의 겹마다 다시 맞췄다는 뜻도 됩니다. 이 문장이 없으면 시험 성능이 부풀려졌는지 독자가 판단할 수 없습니다.</span></li>

<li><span class="mk">5</span><span><b>시험 자료는 한 번.</b> 셀 19입니다. 예측모형 보고 지침 TRIPOD<a class="cite" href="#ml90-ref-collins2015" title="Collins GS, Reitsma JB, Altman DG, Moons KGM. Transparent reporting of a multivariable prediction model for individual prognosis or diagnosis (TRIPOD): the TRIPOD statement. BMJ. 2015;350:g7594.">[3]</a>와 머신러닝까지 포함한 개정판 TRIPOD+AI<a class="cite" href="#ml90-ref-collins2024" title="Collins GS, Moons KGM, Dhiman P, et al. TRIPOD+AI statement: updated guidance for reporting clinical prediction models that use regression or machine learning methods. BMJ. 2024;385:e078378.">[4]</a>는 자료 분할, 결측 처리, 조절값 탐색, 성능 지표를 이런 수준으로 적도록 요구합니다.</span></li>

<div class="keypoints"><p class="kt">정리</p><ul>
<li>조절값은 학습 자료 안의 교차검증으로 고릅니다. <code>StratifiedKFold(n_splits=5, shuffle=True, random_state=2026)</code>로 나누고 <code>cross_val_score</code>나 <code>GridSearchCV</code>에 파이프라인째 넘깁니다.</li>
<li>파이프라인 안의 조절값 이름은 <code>"model__C"</code>처럼 '단계 이름 + 밑줄 두 개 + 인자 이름'입니다.</li>
<li>이 자료에서 C는 0.01–100 사이에서 교차검증 AUC가 거의 같았고(0.7475–0.7486), 고른 C = 0.1 모형의 시험 AUC는 0.742였습니다. 차이를 해석할 때는 겹 사이 SD(0.022)와 함께 봅니다.</li>
<li>시험 자료는 모든 결정을 끝낸 뒤 한 번만 씁니다.</li>

<h2><span class="sec-no">마.</span>성능을 재는 지표</h2>

<h3>쉽게 말하면</h3>
<ul>
<li><b>분류.</b> 확률을 내는 모형은 두 가지로 평가합니다. 사람들의 순서를 잘 매기는가(AUC), 그리고 기준선을 정해 고위험군을 골랐을 때 몇 명을 맞히고 놓치는가(혼동행렬과 정밀도·재현율)입니다. 기준선을 <strong>임계값</strong><span class="en">(threshold)</span>이라고 합니다.</li>
<li><b>회귀.</b> 사람마다 실제 값과 예측값의 차이(오차)를 구해, 그 크기를 평균하는 방식에 따라 MAE와 RMSE가 나오고, 평균만으로 예측할 때보다 얼마나 나아졌는지가 R²입니다.</li>
</ul>

<h3>숫자로 따라가기</h3>
<p>라 절에서 고른 모형으로 시험 자료 3,750명을 예측하고, 입원 확률 0.10 이상을 고위험으로 분류한 결과입니다(셀 21). 실제 입원은 153명입니다.</p>
<div class="tbl-wrap"><table class="tbl" style="max-width:36rem">
<thead><tr><th>임계값 0.10</th><th class="r">실제 입원</th><th class="r">입원 안 함</th><th class="r">합계</th></tr></thead>
<tbody>
<tr><td>고위험 (예측 ≥ 0.10)</td><td class="r">참양성 TP 53</td><td class="r">위양성 FP 178</td><td class="r">231</td></tr>
<tr><td>저위험 (예측 &lt; 0.10)</td><td class="r">위음성 FN 100</td><td class="r">참음성 TN 3,419</td><td class="r">3,519</td></tr>
<tr><td>합계</td><td class="r">153</td><td class="r">3,597</td><td class="r">3,750</td></tr>
</tbody></table></div>
<ol>
<li><strong>정밀도</strong><span class="en">(precision)</span> = TP ÷ (TP + FP) = 53 ÷ 231 = 0.229. 고위험으로 고른 사람 가운데 실제로 입원한 비율이며 통계 과목의 양성예측도(PPV)입니다.</li>
<li><strong>재현율</strong><span class="en">(recall)</span> = TP ÷ (TP + FN) = 53 ÷ 153 = 0.346. 실제로 입원한 사람 가운데 고위험으로 잡아낸 비율이며 민감도입니다.</li>
<li><strong>F1 점수</strong><span class="en">(F1 score)</span> = 2 × 정밀도 × 재현율 ÷ (정밀도 + 재현율) = 2 × 0.229 × 0.346 ÷ 0.575 = 0.276. 두 값의 조화평균이라 둘 가운데 작은 쪽으로 끌립니다.</li>
<li>특이도는 3,419 ÷ 3,597 = 0.951, <strong>정확도</strong><span class="en">(accuracy)</span>는 맞게 분류한 비율 (53 + 3,419) ÷ 3,750 = 0.926입니다. 그런데 모두를 '입원 안 함'으로 분류하면 한 명도 잡아내지 못하는데도 정확도가 3,597 ÷ 3,750 = 0.959로 더 높습니다.</li>
</ol>
<p>회귀는 다섯 사람의 오차(실제 − 예측)가 10, 20, 30, 40, 900만원인 예로 봅니다.</p>
<ol>
<li><strong>평균절대오차</strong><span class="en">(mean absolute error, MAE)</span> = 오차 크기의 평균 = (10 + 20 + 30 + 40 + 900) ÷ 5 = 200만원.</li>
<li><strong>평균제곱근오차</strong><span class="en">(root mean squared error, RMSE)</span> = 오차 제곱의 평균의 제곱근 = √[(10² + 20² + 30² + 40² + 900²) ÷ 5] = √162,600 = 403.2만원.</li>
<li>900만원 틀린 한 사람을 빼면 MAE는 25만원, RMSE는 27.4만원입니다. 제곱을 하므로 RMSE는 큰 오차 하나에 크게 끌립니다.</li>
<li><strong>결정계수</strong><span class="en">(R²)</span> = 1 − (모형의 오차 제곱합 ÷ 모두를 평균으로 예측했을 때의 오차 제곱합). 통계 6장의 R²(<a href="stats.html#ch06-s3">6장 다 절</a>)와 같은 식이지만 시험 자료에서 계산하므로 평균보다 못한 모형이면 음수도 나옵니다.</li>
</ol>

<h3>정확도의 함정</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 20</span><span class="cell-t">정확도의 함정</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.metrics import accuracy_score

all0 = np.zeros(len(y_test), dtype=int)     # 모두 &#x27;입원 안 함&#x27;
pred05 = final.predict(X_test)              # 임계값 0.5
print(&quot;accuracy, all 0  :&quot;, round(accuracy_score(y_test, all0), 4))
print(&quot;accuracy, model  :&quot;, round(accuracy_score(y_test, pred05), 4))
print(&quot;predicted 1 (0.5):&quot;, pred05.sum())</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>accuracy, all 0  : 0.9592<span class="mk">1</span>
accuracy, model  : 0.9632<span class="mk">2</span>
predicted 1 (0.5): 29<span class="mk">3</span></pre></div></div>
<p><code>np.zeros(n, dtype=int)</code>는 0이 n개인 정수 배열, <code>accuracy_score(실제, 예측)</code>은 정확도, <code>final.predict</code>는 확률 0.5를 임계값으로 쓴 0/1 예측입니다.</p>
<ol class="marks">
<li><span class="mk">1</span><span><b>모두 0으로 예측하면 0.9592.</b> 모형 없이도 95.9%를 맞힙니다.</span></li>
<li><span class="mk">2</span><span><b>모형은 0.9632.</b> 0.4%p 높을 뿐입니다.</span></li>
<li><span class="mk">3</span><span><b>1로 예측한 사람 29명.</b> 임계값 0.5에서는 3,750명 가운데 29명만 고위험이 됩니다. 입원할 153명 대부분을 놓치는데도 정확도는 높습니다. 드문 결과에서는 정확도로 모형을 고르지 않습니다.</span></li>
</ol>

<h3>혼동행렬과 정밀도·재현율·F1</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 21</span><span class="cell-t">혼동행렬과 정밀도·재현율·F1</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.metrics import (confusion_matrix, precision_score,
                             recall_score, f1_score)

pred10 = (p_final &gt;= 0.10).astype(int)      # 임계값 0.10
print(confusion_matrix(y_test, pred10))
print(&quot;precision:&quot;, round(precision_score(y_test, pred10), 3))
print(&quot;recall   :&quot;, round(recall_score(y_test, pred10), 3))
print(&quot;F1       :&quot;, round(f1_score(y_test, pred10), 3))</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>[[3419  178]<span class="mk">1</span>
 [ 100   53]]<span class="mk">2</span>
precision: 0.229<span class="mk">3</span>
recall   : 0.346<span class="mk">4</span>
F1       : 0.276<span class="mk">5</span></pre></div></div>
<p>임계값을 정해 0/1로 바꾸는 법과 <strong>혼동행렬</strong><span class="en">(confusion matrix, 교재에 따라 오차 행렬)</span>의 배치(행은 실제, 열은 예측, 0이 먼저)는 <a href="stats.html#lab09-s4">실습 9 라 절</a>과 같습니다. 새로 쓴 것은 <code>precision_score</code>, <code>recall_score</code>, <code>f1_score</code>이고, 모두 (실제, 0/1 예측) 순서로 넣으며 1을 관심 사건으로 봅니다.</p>
<ol class="marks">
<li><span class="mk">1</span><span><b>첫 줄 [3419 178].</b> 실제로 입원하지 않은 3,597명 가운데 3,419명은 저위험(참음성), 178명은 고위험(위양성)입니다.</span></li>
<li><span class="mk">2</span><span><b>둘째 줄 [100 53].</b> 실제 입원 153명 가운데 100명을 놓쳤고(위음성) 53명을 잡았습니다(참양성).</span></li>
<li><span class="mk">3</span><span><b>정밀도 0.229.</b> 고위험 231명(6.2%) 가운데 실제 입원은 4–5명 중 1명입니다. 그래도 전체 입원 비율 4.1%의 5.6배입니다.</span></li>
<li><span class="mk">4</span><span><b>재현율 0.346.</b> 입원할 사람의 3분의 1을 잡아냅니다.</span></li>
<li><span class="mk">5</span><span><b>F1 0.276.</b> 임계값을 낮추면 재현율은 오르고 정밀도는 대개 내려갑니다. 0.10은 "6%를 골라 퇴원 후 약사 상담을 한다"처럼 쓰임새를 가정한 예시이고, 임계값을 고르는 방법과 예측 확률이 실제 비율과 맞는지 보는 교정<span class="en">(calibration)</span>은 나중에 다룹니다.</span></li>
</ol>

<h3>ROC 곡선과 정밀도-재현율 곡선</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 22</span><span class="cell-t">ROC 곡선과 정밀도-재현율 곡선</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.metrics import (roc_curve, precision_recall_curve,
                             average_precision_score)

fpr, tpr, _ = roc_curve(y_test, p_final)
prec, rec, _ = precision_recall_curve(y_test, p_final)
print(&quot;AUC:&quot;, round(roc_auc_score(y_test, p_final), 3),
      &quot; AP:&quot;, round(average_precision_score(y_test, p_final), 3))

fig, ax = plt.subplots(1, 2, figsize=(9, 3.8))
ax[0].plot(fpr, tpr)
ax[0].plot([0, 1], [0, 1], &quot;--&quot;, color=&quot;gray&quot;)
ax[0].set_xlabel(&quot;1 - specificity&quot;)
ax[0].set_ylabel(&quot;Sensitivity (recall)&quot;)
ax[0].set_title(&quot;ROC curve&quot;)
ax[1].plot(rec, prec)
ax[1].axhline(y_test.mean(), ls=&quot;--&quot;, color=&quot;gray&quot;)
ax[1].set_xlabel(&quot;Recall&quot;)
ax[1].set_ylabel(&quot;Precision&quot;)
ax[1].set_title(&quot;Precision-recall curve&quot;)

<li><span class="mk">2</span><span><b>AP 0.268.</b> 오른쪽 그림의 기준선(입원 비율 0.041)의 6.6배입니다. 곡선의 왼쪽(재현율이 낮은 곳)은 위험이 가장 높은 소수만 고른 경우라 정밀도가 높고, 오른쪽으로 갈수록 더 많은 사람을 고위험으로 잡으면서 정밀도가 기준선 쪽으로 떨어집니다. 드문 결과에서는 ROC 곡선이 무난해 보여도 정밀도가 낮을 수 있다는 점을 이 그림이 바로 보여 줍니다. AP는 사건 비율에 따라 크기가 달라지므로 다른 자료의 AP와 직접 비교하지 않습니다.</span></li>
</ol>

<h3>회귀의 지표</h3>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 23</span><span class="cell-t">회귀: 2023년 의료비 예측</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.linear_model import LinearRegression
from sklearn.metrics import (mean_absolute_error,
                             mean_squared_error, r2_score)

c_train = df.loc[X_train.index, &quot;cost_2023&quot;]    # 같은 사람들의 비용
c_test = df.loc[X_test.index, &quot;cost_2023&quot;]
reg = make_pipe(LinearRegression())
reg.fit(X_train, c_train)
c_pred = reg.predict(X_test)

print(&quot;MAE :&quot;, round(mean_absolute_error(c_test, c_pred), 1))
print(&quot;RMSE:&quot;, round(np.sqrt(mean_squared_error(c_test, c_pred)), 1))
print(&quot;R2  :&quot;, round(r2_score(c_test, c_pred), 3))
print(&quot;negative predictions:&quot;, (c_pred &lt; 0).sum())</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>MAE : 183.0<span class="mk">1</span>
RMSE: 430.1<span class="mk">2</span>
R2  : 0.445<span class="mk">3</span>
negative predictions: 196<span class="mk">4</span></pre></div></div>
<details class="lines-box"><summary>코드 한 줄씩 설명<span class="cnt">5개 항목 · 눌러서 펼치기</span></summary><ol class="lines">
<li><code>c_train = df.loc[X_train.index, "cost_2023"]</code><span><code>train_test_split</code>는 원래 행 번호(인덱스)를 그대로 가져가므로, 그 번호로 같은 사람들의 2023년 의료비를 꺼냅니다. 회귀도 분류와 같은 분할을 씁니다.</span></li>

<li><span class="mk">2</span><span><b>RMSE 430.1만원.</b> MAE의 2.4배입니다. 아래 셀에서 이유를 봅니다.</span></li>
<li><span class="mk">3</span><span><b>R² 0.445.</b> 모두에게 평균 의료비를 예측할 때보다 제곱오차의 합을 44.5% 줄였다는 뜻입니다.</span></li>
<li><span class="mk">4</span><span><b>음수 예측 196명(5.2%).</b> 선형회귀는 직선이라 의료비가 0원보다 작다고 예측하기도 합니다. 5장에서 다룹니다.</span></li>

<p class="excerpt">In the test set (n = 3,750; 153 emergency admissions [4.1%]), the model had an <span class="hl">AUC of 0.742 (95% bootstrap CI, 0.695 to 0.785)</span> <span class="mk">1</span> and an <span class="hl">average precision of 0.27</span> <span class="mk">2</span>. At a predicted-risk threshold of 0.10, 231 patients (6.2%) were classified as high risk, with a <span class="hl">precision (positive predictive value) of 22.9% (53/231) and a recall (sensitivity) of 34.6% (53/153)</span> <span class="mk">3</span>. For medical costs in 2023, the linear regression model had a <span class="hl">mean absolute error of 1.83 million KRW, a root mean squared error of 4.30 million KRW, and an R² of 0.445</span> <span class="mk">4</span>.</p>

<section class="sec" id="ml00-s6">
<h2><span class="sec-no">바.</span>과제</h2>

<p>앞의 셀을 모두 실행한 상태에서 이어서 풉니다. 먼저 스스로 해 본 뒤 정답을 펼쳐 보세요.</p>

<h3>과제 1. 특성 묶음 바꾸기</h3>
<p>의료이용과 건강검진 없이 나이, 성별, 소득 분위, 진단 15개, 처방 6개(숫자 열)와 보험 종류, 지역(글자 열)만 쓰는 파이프라인을 <code>make_pipe</code>의 <code>num</code>, <code>cat</code> 인자로 만드세요. 셀 16의 <code>skf</code>로 교차검증 AUC를 구해 모든 특성을 쓴 파이프라인과 비교하세요.</p>
<details class="hw-ans"><summary>정답 코드와 풀이</summary><div>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 25</span><span class="cell-t">과제 1 정답. 특성 묶음 바꾸기</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">comorb = [&quot;htn&quot;, &quot;dm&quot;, &quot;dyslip&quot;, &quot;ckd&quot;, &quot;hf&quot;, &quot;af&quot;, &quot;cad&quot;, &quot;stroke&quot;,
          &quot;copd&quot;, &quot;asthma&quot;, &quot;depress&quot;, &quot;dementia&quot;, &quot;cancer&quot;,
          &quot;liver&quot;, &quot;oa&quot;]
drugs = [&quot;anticoag&quot;, &quot;insulin&quot;, &quot;opioid&quot;, &quot;benzo&quot;, &quot;antipsych&quot;,
         &quot;diuretic&quot;]
small = make_pipe(LogisticRegression(max_iter=1000),
                  num=[&quot;age&quot;, &quot;female&quot;, &quot;income_q&quot;] + comorb + drugs,
                  cat=[&quot;insurance&quot;, &quot;region&quot;])
full = make_pipe(LogisticRegression(max_iter=1000))
for name, p in [(&quot;dx + drugs only&quot;, small), (&quot;all features&quot;, full)]:
    s = cross_val_score(p, X_train, y_train, cv=skf,
                        scoring=&quot;roc_auc&quot;)
    print(f&quot;{name:16s} CV AUC {s.mean():.3f} (SD {s.std():.3f})&quot;)</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>dx + drugs only  CV AUC 0.731 (SD 0.019)
all features     CV AUC 0.748 (SD 0.022)</pre></div></div>
<p><code>ColumnTransformer</code>는 목록에 없는 열을 버리므로 <code>X_train</code>을 그대로 넘겨도 됩니다. 진단·처방과 인구학적 특성만 쓴 모형의 교차검증 AUC는 0.731, 모든 특성은 0.748입니다. 같은 다섯 겹에서 겹마다 비교하면 다섯 겹 모두 모든 특성 쪽이 높았습니다(0.722 대 0.739 … 0.716 대 0.732). 차이 0.017은 겹 사이 SD(0.02)와 비슷한 크기이지만, 같은 사람들로 짝지어 비교한 차이가 다섯 번 모두 같은 방향이므로 우연만으로 생긴 차이로 보기는 어렵습니다. 의료이용과 검진이 진단·처방 목록에 더해 주는 정보가 있다는 뜻입니다. 시험 자료는 쓰지 않았습니다. 특성 묶음을 고르는 것도 모형을 고르는 일이기 때문입니다.</p>
</div></details>

<h3>과제 2. k 바꾸기</h3>
<p>C = 1인 파이프라인(<code>make_pipe(LogisticRegression(max_iter=1000))</code>)의 교차검증을 k = 3, 5, 10으로 해서 AUC의 평균, 겹 사이 SD, 최솟값, 최댓값을 비교하세요. 힌트. <code>StratifiedKFold</code>의 <code>n_splits</code>만 바꿉니다.</p>
<details class="hw-ans"><summary>정답 코드와 풀이</summary><div>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 26</span><span class="cell-t">과제 2 정답. k 바꾸기</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">for k in [3, 5, 10]:
    cv_k = StratifiedKFold(n_splits=k, shuffle=True,
                           random_state=2026)
    s = cross_val_score(make_pipe(LogisticRegression(max_iter=1000)),
                        X_train, y_train, cv=cv_k, scoring=&quot;roc_auc&quot;)
    print(f&quot;k={k:2d}  train per fold {len(X_train) * (k - 1) // k:5d}&quot;
          f&quot;  mean {s.mean():.3f}  SD {s.std():.3f}&quot;
          f&quot;  min {s.min():.3f}  max {s.max():.3f}&quot;)</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>k= 3  train per fold  7500  mean 0.746  SD 0.013  min 0.732  max 0.764
k= 5  train per fold  9000  mean 0.748  SD 0.022  min 0.727  max 0.787
k=10  train per fold 10125  mean 0.745  SD 0.029  min 0.701  max 0.799</pre></div></div>
<p>평균은 0.746, 0.748, 0.745로 거의 같습니다. 겹 사이 SD는 0.013, 0.022, 0.029로 k가 클수록 커지고 최솟값과 최댓값의 폭도 넓어집니다(k = 10에서 0.701–0.799). k가 크면 검증 겹이 작아지기 때문입니다. k = 10의 검증 겹은 1,125명에 입원이 46명 안팎이라 겹 하나의 AUC가 크게 흔들립니다. 반대로 학습 겹은 7,500명(k = 3)에서 10,125명(k = 10)으로 커져 최종 모형(11,250명)에 가까워지고, 계산은 k번 합니다. 흔히 5나 10을 쓰며, 결과가 흔들리면 겹 나누기를 seed만 바꿔 여러 번 되풀이한 평균을 씁니다. 겹 사이 SD는 평균의 표준오차가 아니라는 점도 기억해 둡니다.</p>
</div></details>

<h3>과제 3. 로그 변환한 목표</h3>
<p>2023년 의료비를 log(1 + 비용)으로 바꿔 선형회귀를 다시 맞추세요. 치우친 특성 세 개(<code>n_outpt</code>, <code>los_days</code>, <code>cost_2022</code>)도 <code>np.log1p</code>로 바꿉니다. 원래 단위(만원)에서 MAE, RMSE, R²와 예측값의 평균을 셀 23의 모형과 비교하세요. 힌트. <code>TransformedTargetRegressor(regressor=LinearRegression(), func=np.log1p, inverse_func=np.expm1)</code>은 목표를 <code>func</code>로 바꿔 학습하고 예측값을 <code>inverse_func</code>로 되돌려 줍니다.</p>
<details class="hw-ans"><summary>정답 코드와 풀이</summary><div>
<div class="cell"><div class="cell-h"><span class="cell-n">셀 27</span><span class="cell-t">과제 3 정답. 로그 변환한 목표</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-python">from sklearn.compose import TransformedTargetRegressor

skewed = [&quot;n_outpt&quot;, &quot;los_days&quot;, &quot;cost_2022&quot;]
Xtr_log, Xte_log = X_train.copy(), X_test.copy()
for col in skewed:                       # 치우친 특성도 log(1 + x)로
    Xtr_log[col] = np.log1p(Xtr_log[col])
    Xte_log[col] = np.log1p(Xte_log[col])

log_model = TransformedTargetRegressor(
    regressor=LinearRegression(),
    func=np.log1p, inverse_func=np.expm1)    # 목표도 log(1 + 비용)
reg_log = make_pipe(log_model)
reg_log.fit(Xtr_log, c_train)
c_pred_log = reg_log.predict(Xte_log)        # 만원 단위로 되돌린 예측

for name, pr in [(&quot;raw&quot;, c_pred), (&quot;log&quot;, c_pred_log)]:
    print(f&quot;{name}  MAE {mean_absolute_error(c_test, pr):5.1f}&quot;
          f&quot;  RMSE {np.sqrt(mean_squared_error(c_test, pr)):5.1f}&quot;
          f&quot;  R2 {r2_score(c_test, pr):.3f}&quot;
          f&quot;  mean of predictions {pr.mean():5.1f}&quot;)
print(&quot;mean of actual cost:&quot;, round(c_test.mean(), 1))</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>raw  MAE 183.0  RMSE 430.1  R2 0.445  mean of predictions 285.9
log  MAE 156.7  RMSE 414.7  R2 0.484  mean of predictions 197.6
mean of actual cost: 281.5</pre></div></div>
<p>특성 변환은 사람마다 따로 계산하고 학습 자료에서 구하는 기준값이 없으므로 나누기 전에 해도 누수가 없지만, 학습 자료와 시험 자료에 똑같이 적용해야 합니다(<code>.copy()</code>로 원본은 그대로 둡니다). 로그 모형은 MAE 183.0 → 156.7, RMSE 430.1 → 414.7, R² 0.445 → 0.484로 세 지표가 모두 나아졌습니다. 2023년 의료비가 2022년 의료비에 비례해 곱하기 꼴로 움직이는 구조를 로그 척도의 직선이 더 잘 잡기 때문입니다. 그러나 예측의 평균은 197.6만원으로 실제 평균 281.5만원보다 30% 낮습니다. 로그 척도의 예측을 되돌리면 산술평균이 아니라 기하평균에 가까운 값이 나오기 때문이며, 환자 수를 곱해 총 의료비나 예산을 추정하면 크게 모자랍니다. 이 재변환 문제와 smearing 보정은 <a href="stats.html#ch21-s2">통계 21장 나 절</a>에 있고 5장에서 다시 다룹니다. 특성 세 개를 원래대로 두고 목표만 로그로 바꾸면, 2022년 의료비가 큰 사람에서 로그 척도의 직선이 지수함수로 되돌려지며 한 사람의 예측이 56.6억 원(565,704만원)까지 커지고 R²가 −256이 됩니다. 목표를 바꾸면 특성의 척도도 함께 살펴야 합니다.</p>

      <p class="crumbs"><a href="index.html">홈</a><span>/</span><span>검색</span></p>
      <h1 style="font-family:var(--f-serif);margin:0 0 6px">본문 검색</h1>
      <p style="color:var(--ink-2);margin:0">공개된 장의 본문 전체에서 찾습니다. 예: 오즈비, censoring, 비례위험 가정, SMD</p>
      <form class="search-box" id="sform"><input id="sq" type="search" placeholder="검색어 입력" autocomplete="off" aria-label="검색어"></form>
      <ul class="results" id="sres"></ul></div>`;
    const input = document.getElementById("sq");
    const run = () => {
      const terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const out = document.getElementById("sres");
      // 검색어를 주소에 남겨 둔다: 결과를 눌렀다가 뒤로 오면 같은 검색 결과가 다시 보인다
      try { history.replaceState(history.state, "", "#search" + (input.value.trim() ? "/" + encodeURIComponent(input.value.trim()) : "")); } catch (e) {}
      if (!terms.length) { out.innerHTML = ""; return; }
      const hits = [];
      for (const it of searchIndex()) {
        const low = it.text.toLowerCase();
        if (terms.every(t => low.includes(t) || it.title.toLowerCase().includes(t))) {
          const i = Math.max(0, low.indexOf(terms[0]));
          const start = Math.max(0, i - 50);
          let snip = it.text.slice(start, start + 150);
          snip = esc(snip);
          for (const t of terms) snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
          hits.push(`<li><div class="rp">${esc(it.ch)}</div><a href="#${it.id}">${esc(it.title)}</a><p>${start > 0 ? "…" : ""}${snip}…</p></li>`);
        }
      }
      out.innerHTML = hits.length ? hits.join("") : '<li><p>일치하는 내용이 없습니다. 다른 표현(한글/영문)으로 찾아보세요.</p></li>';
    };
    input.addEventListener("input", run);
    document.getElementById("sform").addEventListener("submit", e => { e.preventDefault(); run(); });
    if (q) { input.value = q; run(); }
    input.focus();
  }

  let _idx = null;
  function searchIndex() {
    if (_idx) return _idx;
    _idx = [];
    for (const c of CH.filter(c => c.ready)) {
      const tpl = document.getElementById("tpl-" + c.id);
      if (!tpl) continue;
      const frag = tpl.content.cloneNode(true);
      frag.querySelectorAll("svg, script, details.code").forEach(n => n.remove());
      frag.querySelectorAll("section.sec").forEach(sec => {
        const h = sec.querySelector("h2");
        _idx.push({ id: sec.id, ch: c.lab ? `실습 ${+c.no} ${c.title}` : (c.review ? `종합 ${c.title}` : (c.appendix ? `부록 ${c.no} ${c.title}` : `${+c.no}장 ${c.title}`)), title: h ? h.textContent.replace(/\s+/g, " ").trim() : c.title, text: sec.textContent.replace(/\\\(.*?\\\)|\\\[.*?\\\]/g, " ").replace(/\s+/g, " ").trim() });
      });
    }
    return _idx;
  }

  let spy = null;
  function renderChapter(id, anchor, keepScroll) {
    const c = byId[id];
    if (!c || !c.ready) {
      app.innerHTML = `<div class="wrap" style="max-width:46rem"><p class="crumbs"><a href="index.html">홈</a><span>/</span><a href="#toc">${esc(COURSE.title)}</a></p>
        <h1 style="font-family:var(--f-serif)">${c ? esc(c.no + ". " + c.title) : "찾을 수 없는 페이지"}</h1>
        <div class="soon-box">이 장은 아직 작성 중입니다. <a href="#toc">목차로 돌아가기</a></div></div>`;
      return;
    }
    const tpl = document.getElementById("tpl-" + id);
    const g = META.groups.find(g => g.key === c.group);
    const readyList = CH.filter(x => x.ready);
    const i = readyList.findIndex(x => x.id === id);
    const prev = readyList[i - 1], next = readyList[i + 1];
    const secs = c.sections || [];
    app.innerHTML = `<div class="reader">
      ${railHTML(id)}
      <article class="article" id="article">
        <header class="ch-head">
          <p class="crumbs"><a href="index.html">홈</a><span>/</span><a href="#toc">${esc(COURSE.title)}</a><span>/</span><span>${esc(g.label)}</span></p>
          <p class="ch-no">${c.appendix ? "APPENDIX " + c.no : (c.lab ? "PYTHON LAB " + c.no : (c.review ? "PART 1 REVIEW" : "CHAPTER " + c.no))}</p>
          <h1>${esc(c.title)}</h1>
          <div id="leadSlot"></div>
          ${secs.length > 1 ? `<nav class="ch-map" aria-label="이 장의 절">${secs.map(s => `<a href="#${s.id}">${esc(s.no)}. ${esc(s.title)}</a>`).join("")}</nav>` : ""}
        </header>
        <div id="body"></div>
        <nav class="pager" aria-label="이전·다음 장">
          ${prev ? `<a href="#${prev.id}"><small>← 이전</small><span>${numLabel(prev)} ${esc(prev.title)}</span></a>` : "<span></span>"}
          ${next ? `<a class="nx" href="#${next.id}"><small>다음 →</small><span>${numLabel(next)} ${esc(next.title)}</span></a>` : ""}
        </nav>
      </article>
      <aside class="onpage">${secs.length ? `<h4>이 장의 구성</h4><ol>${secs.map(s => `<li><a href="#${s.id}" data-sec="${s.id}">${esc(s.no)}. ${esc(s.title)}</a></li>`).join("")}</ol>` : ""}</aside>
    </div>`;
    const body = document.getElementById("body");
    body.appendChild(tpl.content.cloneNode(true));
    const lead = body.querySelector(":scope > .lead");
    if (lead) document.getElementById("leadSlot").appendChild(lead);
    initWidgets(body);
    highlightCode(body);
    lastTypeset = typesetNow() || Promise.resolve();
    if (spy) spy.disconnect();
    const links = [...document.querySelectorAll(".onpage a[data-sec]")];
    if (links.length && "IntersectionObserver" in window) {
      spy = new IntersectionObserver(entries => {
        for (const e of entries) if (e.isIntersecting) {
          links.forEach(l => l.classList.toggle("on", l.dataset.sec === e.target.id));
        }
      }, { rootMargin: "-20% 0px -70% 0px" });
      body.querySelectorAll("section.sec").forEach(s => spy.observe(s));
    }
    if (keepScroll) return;
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) { requestAnimationFrame(() => el.scrollIntoView({ block: "start" })); return; }
    }
    window.scrollTo(0, 0);
  }

  /* ---------- 읽던 곳으로 돌아가기 ----------
     본문 속 링크(다른 장·절, 참고문헌 번호)를 누르면 그 순간의 위치를 기억해 두고,
     왼쪽 위 단추나 브라우저의 뒤로 가기로 그 자리에 되돌아온다.
     위치는 "화면 맨 위에 있던 문단이 몇 번째인지 + 펼쳐 둔 접힌 상자"로 기억한다
     (수식이 그려지면서 높이가 바뀌어도 같은 문단으로 돌아가기 위해). */
  let lastTypeset = Promise.resolve();
  let pendingRestore = null, restoreToken = 0;
  const BACK_KEY = "srn-back-" + (COURSE.key || "home");
  const ANCH = "p, li, h2, h3, h4, tr, figure, pre, summary";
  let backStack = [];
  try { backStack = JSON.parse(sessionStorage.getItem(BACK_KEY) || "[]") || []; } catch (e) { backStack = []; }
  const saveBack = () => { try { sessionStorage.setItem(BACK_KEY, JSON.stringify(backStack)); } catch (e) {} };
  const chName = c => c.lab ? `실습 ${+c.no}` : (c.review ? "종합" : (c.appendix ? `부록 ${c.no}` : `${+c.no}장`));
  const topEdge = () => (document.querySelector(".topbar")?.getBoundingClientRect().bottom || 56) + 8;

  function hereState() {
    const body = document.getElementById("body");
    const c = byId[app.dataset.ch];
    const st = { hash: location.hash, y: Math.round(window.scrollY), ch: c ? c.id : "" };
    if (!body || !c) return st;
    st.open = [...body.querySelectorAll("details")].map((d, i) => d.open ? i : -1).filter(i => i >= 0);
    const edge = topEdge(), els = body.querySelectorAll(ANCH);
    for (let i = 0; i < els.length; i++) {
      const r = els[i].getBoundingClientRect();
      if (r.height > 0 && r.bottom > edge) { st.a = { i, off: Math.round(r.top) }; break; }
    }
    let sec = null;
    body.querySelectorAll("section.sec").forEach(x => { if (x.getBoundingClientRect().top <= edge + 80) sec = x; });
    const sm = sec && (c.sections || []).find(x => x.id === sec.id);
    st.label = chName(c) + (sm ? ` ${sm.no} 절` : "");
    return st;
  }

  function restoreTo(st) {
    const body = document.getElementById("body");
    const token = ++restoreToken;
    if (body && st.open) { const ds = body.querySelectorAll("details"); st.open.forEach(i => { if (ds[i]) ds[i].open = true; }); }
    const place = () => {
      if (token !== restoreToken) return;
      const el = body && st.a ? body.querySelectorAll(ANCH)[st.a.i] : null;
      const top = el && el.getBoundingClientRect().height > 0 ? window.scrollY + el.getBoundingClientRect().top - st.a.off : (st.y || 0);
      window.scrollTo({ top: Math.max(0, top), behavior: "instant" });
    };
    place();
    requestAnimationFrame(place);
    lastTypeset.then(() => requestAnimationFrame(place));   // 수식이 그려진 뒤 한 번 더 맞춘다
    setTimeout(() => { if (token === restoreToken) restoreToken++; }, 4000);
    // 읽는 사람이 직접 움직이기 시작하면 더는 건드리지 않는다
    const stop = () => { if (token === restoreToken) restoreToken++; };
    ["wheel", "touchstart", "keydown", "mousedown"].forEach(ev => window.addEventListener(ev, stop, { once: true, passive: true }));
  }

  function updateBackBtn() {
    const btn = document.getElementById("backBtn");
    const top = backStack[backStack.length - 1];
    btn.hidden = HOME || !top;
    if (top) {
      document.getElementById("backWhere").textContent = top.label || "";
      btn.title = (top.label ? top.label + "의 " : "") + "읽던 곳으로 돌아가기";
    }
  }

  document.addEventListener("click", e => {
    if (HOME || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a || a.getAttribute("href") === location.hash) return;
    const st = hereState();
    try { history.replaceState(st, ""); } catch (err) {}      // 브라우저 뒤로 가기에서도 같은 자리로
    if (st.ch && (a.closest("#body, #leadSlot") || a.id === "searchBtn")) {   // 본문 속 링크와, 읽다가 누른 검색만 단추에 쌓는다
      backStack.push(st); if (backStack.length > 12) backStack.shift();
      saveBack();
    }
  }, true);

  document.getElementById("backBtn").addEventListener("click", () => {
    const st = backStack.pop();
    saveBack();
    if (!st) { updateBackBtn(); return; }
    if (st.hash === location.hash || (st.ch && st.ch === app.dataset.ch && !st.hash)) {
      restoreTo(st); updateBackBtn();
    } else { pendingRestore = st; location.hash = st.hash || "#" + st.ch; }
  });

  window.addEventListener("popstate", e => {
    const st = e.state;
    if (!st || typeof st.y !== "number") return;
    pendingRestore = st;
    const top = backStack[backStack.length - 1];
    if (top && top.hash === st.hash && top.y === st.y) { backStack.pop(); saveBack(); }   // 뒤로 가기로 이미 돌아온 경우
  });
  try { history.scrollRestoration = "manual"; } catch (e) {}

  function route() {
    closeDrawer();
    const h = decodeURIComponent(location.hash.slice(1));
    const pr = pendingRestore; pendingRestore = null;
    restoreToken++;
    let cur = null;
    if (HOME) {
      // old links such as index.html#ch11-s1 pointed at the single-file site: send them to the course page
      if (/^ml\d\d/.test(h) || h === "ml") { location.replace("ml.html#" + (h === "ml" ? "toc" : h)); return; }
      if (/^(?:(?:ch|lab|rv|ap)\d\d|stats$|toc$|search)/.test(h)) { location.replace("stats.html#" + (h === "stats" ? "toc" : h)); return; }
      renderHome(); window.scrollTo(0, 0);
    }
    else if (h === "home") { location.href = "index.html"; return; }
    else if (!h || h === "toc" || h === COURSE.key) { renderPart(); window.scrollTo(0, 0); }
    else if (h.startsWith("search")) { renderSearch(h.slice(7)); window.scrollTo(0, 0); }
    else {
      const m = h.match(/^((?:ch|lab|rv|ap|ml)\d\d)(?:-(.+))?$/);
      if (m) {
        cur = m[1];
        const already = app.dataset.ch === cur && document.getElementById("article");
        if (already && pr && pr.ch === cur) { restoreTo(pr); return; }
        if (already && m[2]) { const el = document.getElementById(h); if (el) { el.scrollIntoView({ block: "start" }); return; } }
        const back = pr && pr.ch === cur;
        renderChapter(cur, m[2] ? h : null, back);
        if (back) { app.dataset.ch = cur; restoreTo(pr); }
      } else renderPart();
    }
    if (pr && !cur && !pr.ch && pr.hash === location.hash) requestAnimationFrame(() => window.scrollTo({ top: pr.y, behavior: "instant" }));   // 목차·검색 화면도 보던 자리로
    app.dataset.ch = cur || "";
    document.getElementById("menuBtn").hidden = !cur;
    document.getElementById("courseBtn").hidden = HOME;
    document.getElementById("searchBtn").hidden = HOME;
  }

  // drawer for small screens
  const dRoot = document.getElementById("drawerRoot");
  function openDrawer() { document.getElementById("drawer").innerHTML = railHTML(app.dataset.ch); dRoot.hidden = false; }
  function closeDrawer() { dRoot.hidden = true; }
  document.getElementById("menuBtn").addEventListener("click", openDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

  // ---------- widgets ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  const fmt = (v, d = 1) => v.toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });

  const WIDGETS = {
    fwer(el) {
      el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">계산기</span></p>
        <p class="wd">검정 횟수를 바꾸면 우연한 '유의' 결과가 하나라도 나올 확률과 Bonferroni 기준이 어떻게 변하는지 봅니다.</p>
        <div class="wrow"><label for="fwk">검정 횟수 k = <b id="fwkv">10</b></label><input id="fwk" type="range" min="1" max="50" value="10"></div>
        <div class="stats">
          <div class="stat"><div class="sl">하나라도 위양성일 확률</div><div class="sv" id="fw1"></div></div>
          <div class="stat"><div class="sl">기대되는 위양성 개수</div><div class="sv" id="fw2"></div></div>
          <div class="stat"><div class="sl">Bonferroni 검정별 기준</div><div class="sv" id="fw3"></div></div>
        </div>`;
      const k = el.querySelector("#fwk");
      const up = () => { const n = +k.value; el.querySelector("#fwkv").textContent = n;
        el.querySelector("#fw1").textContent = fmt((1 - Math.pow(0.95, n)) * 100, 1) + "%";
        el.querySelector("#fw2").textContent = fmt(0.05 * n, 2) + "개";
        el.querySelector("#fw3").textContent = "p < " + (0.05 / n).toPrecision(2); };
      k.addEventListener("input", up); up();
    },
    clt(el) {
      const MU = 3, SG = 0.9, POPM = Math.exp(MU + SG * SG / 2), POPSD = POPM * Math.sqrt(Math.exp(SG * SG) - 1);
      let n = 5, seed = 11;
      el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">시뮬레이션</span></p>
        <p class="wd">모집단: 환자 1인당 연간 외래 약제비(만원). 오른쪽으로 크게 치우친 분포입니다(평균 ${fmt(POPM)}, 중앙값 20.1, 표준편차 ${fmt(POPSD)}). 여기서 n명씩 뽑아 평균을 내는 일을 3,000번 반복하고, 그 3,000개 표본평균의 분포를 그립니다.</p>
        <div class="wrow"><span>표본 크기 n</span><div class="seg" role="group" aria-label="표본 크기">${[1, 5, 30, 100].map(v => `<button type="button" data-n="${v}" aria-pressed="${v === n}">${v}</button>`).join("")}</div>
        <button type="button" class="wbtn" id="cltRe">다시 뽑기</button></div>
        <div class="wchart" id="cltChart"></div>
        <div class="stats">
          <div class="stat"><div class="sl">표본평균들의 평균</div><div class="sv" id="c1"></div></div>
          <div class="stat"><div class="sl">표본평균들의 표준편차 (관측)</div><div class="sv" id="c2"></div></div>
          <div class="stat"><div class="sl">이론적 표준오차 σ/√n</div><div class="sv" id="c3"></div></div>
        </div>`;
      const draw = () => {
        const r = mulberry32(seed), R = 3000, means = new Float64Array(R);
        for (let i = 0; i < R; i++) { let s = 0; for (let j = 0; j < n; j++) s += Math.exp(MU + SG * gauss(r)); means[i] = s / n; }
        let m = 0; for (const v of means) m += v; m /= R;
        let v2 = 0; for (const v of means) v2 += (v - m) ** 2; const sd = Math.sqrt(v2 / (R - 1));
        const W = 640, H = 260, L = 50, Rr = 20, T = 16, B = 44, lo = 0, hi = 100, bw = 2, nb = (hi - lo) / bw;
        const cnt = new Array(nb).fill(0); let over = 0;
        for (const v of means) { const b = Math.floor((v - lo) / bw); if (b >= 0 && b < nb) cnt[b]++; else over++; }
        const ymax = Math.max(...cnt) * 1.12;
        const sx = x => L + (x - lo) / (hi - lo) * (W - L - Rr), sy = y => H - B - y / ymax * (H - T - B);
        let s = "";
        for (let t = 0; t <= 100; t += 20) s += `<line x1="${sx(t)}" y1="${T}" x2="${sx(t)}" y2="${H - B}" class="grid"/><text x="${sx(t)}" y="${H - B + 18}" text-anchor="middle" class="tick">${t}</text>`;
        s += `<line x1="${L}" y1="${H - B}" x2="${W - Rr}" y2="${H - B}" class="axis"/>`;
        cnt.forEach((c, i) => { if (!c) return; const x = sx(lo + i * bw) + 0.8, w = sx(lo + (i + 1) * bw) - sx(lo + i * bw) - 1.6; s += `<rect x="${x.toFixed(1)}" y="${sy(c).toFixed(1)}" width="${w.toFixed(1)}" height="${(sy(0) - sy(c)).toFixed(1)}" class="f1"/>`; });
        if (n > 1) {
          const se = POPSD / Math.sqrt(n); let d = "";
          for (let x = 0; x <= 100; x += 0.25) { const y = R * bw * Math.exp(-0.5 * ((x - POPM) / se) ** 2) / (se * Math.sqrt(2 * Math.PI)); d += (d ? " L" : "M") + sx(x).toFixed(1) + "," + sy(Math.min(y, ymax)).toFixed(1); }
          s += `<path d="${d}" class="ln s2" stroke-width="2" fill="none"/>`;
          s += `<line x1="${W - Rr - 196}" y1="${T + 10}" x2="${W - Rr - 174}" y2="${T + 10}" class="ln s2" stroke-width="2.4"/><text x="${W - Rr - 168}" y="${T + 14}" class="lbl">같은 평균·SE의 정규곡선</text>`;
        }
        s += `<line x1="${sx(POPM)}" y1="${T}" x2="${sx(POPM)}" y2="${H - B}" class="ref" stroke-dasharray="4 4"/><text x="${sx(POPM) + 6}" y="${T + 12}" class="lbl mute small">모평균 ${fmt(POPM)}</text>`;
        s += `<text x="${(L + W - Rr) / 2}" y="${H - 8}" text-anchor="middle" class="axlab">${n === 1 ? "환자 1명의 약제비 (만원) — 모집단 분포 그대로" : `${n}명 표본의 평균 약제비 (만원)`}</text>`;
        if (over) s += `<text x="${W - Rr}" y="${T + 34}" text-anchor="end" class="lbl mute small">100 초과 ${over}개는 그림에서 생략</text>`;
        el.querySelector("#cltChart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="viz" role="img" aria-label="표본평균의 분포">${s}</svg>`;
        el.querySelector("#c1").textContent = fmt(m) + "만원";
        el.querySelector("#c2").textContent = fmt(sd, 2);
        el.querySelector("#c3").textContent = fmt(POPSD / Math.sqrt(n), 2);
      };
      el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { n = +b.dataset.n; el.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); }));
      el.querySelector("#cltRe").addEventListener("click", () => { seed = (seed * 7 + 13) % 100000; draw(); });
      draw();
    }
  };

  function highlightCode(root) {
    if (!window.hljs) return;
    root.querySelectorAll("pre.cell-in code, details.code code.language-python").forEach(el => { if (!el.dataset.hl) { try { window.hljs.highlightElement(el); } catch (e) {} el.dataset.hl = "1"; } });
  }
  window.__hlReady = () => highlightCode(document.getElementById("app"));
  document.addEventListener("click", e => {
    const b = e.target.closest("button.copy");
    if (!b) return;
    const code = b.closest(".cell").querySelector("pre.cell-in code");
    const text = code ? code.textContent : "";
    const done = ok => { b.textContent = ok ? "복사됨" : "선택됨 · Ctrl+C"; setTimeout(() => { b.textContent = "복사"; }, 1800); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); done(false); };
    try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (err) { fallback(); }
  });
  const HELP = { mulberry32, gauss, fmt, esc };
  function initWidgets(root) {
    root.querySelectorAll("[data-widget]").forEach(el => {
      const f = WIDGETS[el.dataset.widget] || (window.EXTRA_WIDGETS || {})[el.dataset.widget];
      if (f) { try { f(el, HELP); } catch (e) { console.error("widget", el.dataset.widget, e); } }
    });
  }

  document.getElementById("courseBtnTxt").textContent = COURSE.title;
  if (COURSE.title) document.title = COURSE.title + " · 사회약학 연구방법 노트";
  window.addEventListener("hashchange", () => { route(); updateBackBtn(); });
  route(); updateBackBtn();
})();
</script>

</body></html>
