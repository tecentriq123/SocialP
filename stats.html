<script>
window.EXTRA_WIDGETS["ch10_margcond"] = function (el, H) {
  // defaults = random-intercept logistic fit of the chapter example (3-month visit)
  const D = { sig: 1.64, or: 3.77, p0: 0.674 };
  el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">계산기</span></p>
    <p class="wd">환자별(조건부) 오즈비는 고정한 채 환자 간 차이(무작위 절편의 SD)를 바꿔 보세요. 모든 환자에게서 오즈비가 같아도, 환자 분포 전체로 평균한 순응률로 계산한 모집단 평균(주변) 오즈비는 SD가 클수록 1 쪽으로 줄어듭니다. 처음 값은 이 장 예제의 혼합모형 추정값입니다.</p>
    <div class="wrow"><label for="w10s">환자 간 SD σ<sub>u</sub> = <b id="w10sv"></b></label><input id="w10s" type="range" min="0" max="3" step="0.01" value="${D.sig}"></div>
    <div class="wrow"><label for="w10o">환자별(조건부) OR = <b id="w10ov"></b></label><input id="w10o" type="range" min="1" max="6" step="0.01" value="${D.or}"></div>
    <div class="wrow"><label for="w10p">통상치료군 '중간' 환자(u = 0)의 순응 확률 = <b id="w10pv"></b></label><input id="w10p" type="range" min="0.1" max="0.9" step="0.001" value="${D.p0}"></div>
    <div class="wrow"><button type="button" class="wbtn" id="w10r">예제 값으로</button></div>
    <div class="wchart" id="w10c"></div>
    <div class="stats">
      <div class="stat"><div class="sl">조건부 OR (혼합모형)</div><div class="sv" id="w10a"></div></div>
      <div class="stat"><div class="sl">모집단 평균 순응률 (통상 / 중재)</div><div class="sv" id="w10b"></div></div>
      <div class="stat"><div class="sl">주변 OR (GEE가 추정하는 값)</div><div class="sv" id="w10m"></div></div>
      <div class="stat"><div class="sl">근사식 β / √(1 + 0.346σ²)</div><div class="sv" id="w10x"></div></div>
    </div>`;
  const $ = (id) => el.querySelector("#" + id);
  const expit = (x) => 1 / (1 + Math.exp(-x));
  const logit = (p) => Math.log(p / (1 - p));
  function marg(eta, sig) {
    if (sig < 1e-6) return expit(eta);
    // integrate expit(eta + u) over u ~ N(0, sig^2) on a fine grid (Simpson's rule, +-7 SD)
    const n = 400, a = -7 * sig, h = (14 * sig) / n;
    let s = 0;
    for (let i = 0; i <= n; i++) {
      const u = a + i * h, w = (i === 0 || i === n) ? 1 : (i % 2 ? 4 : 2);
      s += w * expit(eta + u) * Math.exp(-0.5 * (u / sig) ** 2);
    }
    return s * h / 3 / (sig * Math.sqrt(2 * Math.PI));
  }
  function draw() {
    const sig = +$("w10s").value, or = +$("w10o").value, p0 = +$("w10p").value;
    $("w10sv").textContent = H.fmt(sig, 2);
    $("w10ov").textContent = H.fmt(or, 2);
    $("w10pv").textContent = H.fmt(p0 * 100, 1) + "%";
    const b0 = logit(p0), b1 = Math.log(or);
    const P0 = marg(b0, sig), P1 = marg(b0 + b1, sig);
    const mor = (P1 / (1 - P1)) / (P0 / (1 - P0));
    const approx = Math.exp(b1 / Math.sqrt(1 + 0.346 * sig * sig));
    const W = 640, Hh = 320, L = 62, R = 20, T = 18, B = 52;
    const sx = (x) => L + (x + 4.5) / 9 * (W - L - R), sy = (y) => Hh - B - y * (Hh - T - B);
    let s = "";
    for (const y of [0, 0.2, 0.4, 0.6, 0.8, 1]) s += `<line x1="${L}" y1="${sy(y)}" x2="${W - R}" y2="${sy(y)}" class="grid"/><text x="${L - 8}" y="${sy(y) + 4}" text-anchor="end" class="tick">${Math.round(y * 100)}%</text>`;
    s += `<line x1="${L}" y1="${sy(0)}" x2="${W - R}" y2="${sy(0)}" class="axis"/>`;
    for (let x = -4; x <= 4; x++) s += `<text x="${sx(x)}" y="${sy(0) + 18}" text-anchor="middle" class="tick">${x}</text>`;
    s += `<text x="${(L + W - R) / 2}" y="${Hh - 10}" text-anchor="middle" class="axlab">환자 고유의 순응 성향 u (로짓 척도)</text>`;
    // density of u
    if (sig > 0.05) {
      let d = `M${sx(-4.5)},${sy(0)}`;
      const pk = 1 / (sig * Math.sqrt(2 * Math.PI));
      for (let i = 0; i <= 180; i++) { const u = -4.5 + 9 * i / 180; const f = Math.exp(-0.5 * (u / sig) ** 2) / (sig * Math.sqrt(2 * Math.PI)); d += ` L${sx(u).toFixed(1)},${sy(0.16 * f / pk).toFixed(1)}`; }
      d += ` L${sx(4.5)},${sy(0)} Z`;
      s += `<path d="${d}" class="a4"/>`;
    }
    const curve = (b) => { let d = ""; for (let i = 0; i <= 180; i++) { const u = -4.5 + 9 * i / 180; d += (i ? " L" : "M") + sx(u).toFixed(1) + "," + sy(expit(b + u)).toFixed(1); } return d; };
    s += `<path d="${curve(b0 + b1)}" class="ln s1" stroke-width="2.4" fill="none"/>`;
    s += `<path d="${curve(b0)}" class="ln s2" stroke-width="2.4" stroke-dasharray="6 5" fill="none"/>`;
    for (const [P, lab] of [[P1, "중재군 평균"], [P0, "통상치료군 평균"]]) {
      s += `<line x1="${L}" y1="${sy(P)}" x2="${W - R}" y2="${sy(P)}" class="ref" stroke-dasharray="4 4"/>`;
      s += `<text x="${L + 6}" y="${sy(P) - 6}" class="lbl small">${lab} ${H.fmt(P * 100, 1)}%</text>`;
    }
    s += `<line x1="${L + 6}" y1="${sy(0.97)}" x2="${L + 28}" y2="${sy(0.97)}" class="ln s1" stroke-width="2.4"/><text x="${L + 34}" y="${sy(0.97) + 4}" class="lbl small">중재군 환자</text>`;
    s += `<line x1="${L + 6}" y1="${sy(0.97) + 18}" x2="${L + 28}" y2="${sy(0.97) + 18}" class="ln s2" stroke-width="2.4" stroke-dasharray="6 4"/><text x="${L + 34}" y="${sy(0.97) + 22}" class="lbl small">통상치료군 환자</text>`;
    $("w10c").innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" class="viz" role="img" aria-label="조건부와 주변 순응 확률">${s}</svg>`;
    $("w10a").textContent = H.fmt(or, 2);
    $("w10b").textContent = H.fmt(P0 * 100, 1) + "% / " + H.fmt(P1 * 100, 1) + "%";
    $("w10m").textContent = H.fmt(mor, 2);
    $("w10x").textContent = H.fmt(approx, 2);
  }
  ["w10s", "w10o", "w10p"].forEach((id) => $(id).addEventListener("input", draw));
  $("w10r").addEventListener("click", () => { $("w10s").value = D.sig; $("w10o").value = D.or; $("w10p").value = D.p0; draw(); });
  draw();
};

</script>
<script>
window.EXTRA_WIDGETS["ch11_hrrr"] = function (el, H) {
  // control group: Weibull S_B(t) = exp(-(t/b)^k) with median m -> b = m / (ln 2)^(1/k); treatment S_A = S_B^HR (PH)
  let hr = 0.73, k = 1.0, med = 20, tq = 36;
  const shapes = [[0.6, "감소 (k = 0.6)"], [1.0, "일정 (k = 1)"], [1.6, "증가 (k = 1.6)"]];
  el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">계산기</span></p>
    <p class="wd">대조군(약물 B)의 생존시간이 Weibull 분포를 따르고, 위험비가 전 기간 일정하다고(비례위험) 가정합니다. 이때 치료군의 생존곡선은 S<sub>A</sub>(t) = S<sub>B</sub>(t)<sup>HR</sup>입니다. 위험비, 대조군 위험률의 모양, 대조군 중앙생존기간, 비교 시점을 바꿔 가며 같은 위험비가 시점별 누적 사망위험의 비(상대위험도)와 중앙생존기간의 비로 어떻게 바뀌는지 봅니다.</p>
    <div class="wrow"><label for="w11hr">위험비 HR = <b id="w11hrv"></b></label><input id="w11hr" type="range" min="-1.2" max="1.2" step="0.01" value="${Math.log(hr).toFixed(2)}"></div>
    <div class="wrow"><span>대조군 위험률의 모양</span><div class="seg" role="group" aria-label="대조군 위험률의 모양">${shapes.map(([v, lab]) => `<button type="button" data-k="${v}" aria-pressed="${v === k}">${lab}</button>`).join("")}</div></div>
    <div class="wrow"><label for="w11m">대조군 중앙생존기간 = <b id="w11mv"></b>개월</label><input id="w11m" type="range" min="6" max="60" step="1" value="${med}"></div>
    <div class="wrow"><label for="w11t">비교 시점 t = <b id="w11tv"></b>개월</label><input id="w11t" type="range" min="3" max="60" step="1" value="${tq}"></div>
    <div class="wchart" id="w11chart"></div>
    <div class="stats">
      <div class="stat"><div class="sl">대조군 t까지 누적 사망위험</div><div class="sv" id="w11r0"></div></div>
      <div class="stat"><div class="sl">치료군 t까지 누적 사망위험</div><div class="sv" id="w11r1"></div></div>
      <div class="stat"><div class="sl">상대위험도 RR(t)</div><div class="sv" id="w11rr"></div></div>
      <div class="stat"><div class="sl">위험차 (치료 − 대조)</div><div class="sv" id="w11rd"></div></div>
      <div class="stat"><div class="sl">중앙생존기간의 비 (치료 ÷ 대조)</div><div class="sv" id="w11mr"></div></div>
    </div>
    <p class="wd" id="w11note" style="margin-top:10px"></p>`;

  const S0 = (t, b) => Math.exp(-Math.pow(t / b, k));
  function draw() {
    const b = med / Math.pow(Math.LN2, 1 / k);
    const W = 640, Hh = 300, L = 60, R = 20, Tp = 16, B = 50;
    const sx = x => L + x / 60 * (W - L - R), sy = y => Hh - B - y * (Hh - Tp - B);
    let s = "";
    for (const y of [0, 0.2, 0.4, 0.6, 0.8, 1]) s += `<line x1="${L}" y1="${sy(y)}" x2="${W - R}" y2="${sy(y)}" class="grid"/><text x="${L - 8}" y="${sy(y) + 4}" text-anchor="end" class="tick">${Math.round(y * 100)}%</text>`;
    s += `<line x1="${L}" y1="${sy(0)}" x2="${W - R}" y2="${sy(0)}" class="axis"/>`;
    for (const x of [0, 12, 24, 36, 48, 60]) s += `<text x="${sx(x)}" y="${sy(0) + 18}" text-anchor="middle" class="tick">${x}</text>`;
    s += `<text x="${(L + W - R) / 2}" y="${Hh - 8}" text-anchor="middle" class="axlab">개월</text>`;
    s += `<text x="14" y="${(Tp + Hh - B) / 2}" text-anchor="middle" transform="rotate(-90 14 ${(Tp + Hh - B) / 2})" class="axlab">누적 사망위험 1 − S(t)</text>`;
    let d0 = "", d1 = "";
    for (let i = 0; i <= 240; i++) {
      const x = i / 4, s0 = S0(x, b), s1 = Math.pow(s0, hr);
      d0 += (i ? " L" : "M") + sx(x).toFixed(1) + "," + sy(1 - s0).toFixed(1);
      d1 += (i ? " L" : "M") + sx(x).toFixed(1) + "," + sy(1 - s1).toFixed(1);
    }
    s += `<path d="${d0}" class="ln s2" stroke-width="2.4" fill="none"/><path d="${d1}" class="ln s1" stroke-width="2.4" fill="none"/>`;
    const s0t = S0(tq, b), s1t = Math.pow(s0t, hr), r0 = 1 - s0t, r1 = 1 - s1t;
    s += `<line x1="${sx(tq)}" y1="${sy(0)}" x2="${sx(tq)}" y2="${sy(1)}" class="ref" stroke-dasharray="4 4"/>`;
    s += `<circle cx="${sx(tq)}" cy="${sy(r0)}" r="4.5" class="pt f2"/><circle cx="${sx(tq)}" cy="${sy(r1)}" r="4.5" class="pt f1"/>`;
    s += `<line x1="${L + 14}" y1="${Tp + 10}" x2="${L + 36}" y2="${Tp + 10}" class="ln s2" stroke-width="2.4"/><text x="${L + 42}" y="${Tp + 14}" class="lbl">대조군 (약물 B)</text>`;
    s += `<line x1="${L + 14}" y1="${Tp + 30}" x2="${L + 36}" y2="${Tp + 30}" class="ln s1" stroke-width="2.4"/><text x="${L + 42}" y="${Tp + 34}" class="lbl">치료군 (약물 A)</text>`;
    el.querySelector("#w11chart").innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" class="viz" role="img" aria-label="두 군의 누적 사망위험 곡선">${s}</svg>`;
    const rr = r1 / r0, mr = Math.pow(hr, -1 / k);
    el.querySelector("#w11hrv").textContent = H.fmt(hr, 2);
    el.querySelector("#w11mv").textContent = med;
    el.querySelector("#w11tv").textContent = tq;
    el.querySelector("#w11r0").textContent = H.fmt(r0 * 100, 1) + "%";
    el.querySelector("#w11r1").textContent = H.fmt(r1 * 100, 1) + "%";
    el.querySelector("#w11rr").textContent = H.fmt(rr, 2);
    el.querySelector("#w11rd").textContent = (r1 - r0 >= 0 ? "+" : "−") + H.fmt(Math.abs(r1 - r0) * 100, 1) + "%p";
    el.querySelector("#w11mr").textContent = H.fmt(mr, 2) + "배";
    let note;
    if (Math.abs(hr - 1) < 0.005) note = "위험비가 1이면 두 곡선이 같습니다.";
    else if (hr < 1) note = `‘1 − HR’로 읽으면 ${H.fmt((1 - hr) * 100, 0)}% 감소이지만, ${tq}개월까지의 누적 사망위험은 ${H.fmt((1 - rr) * 100, 1)}% 줄어듭니다. 중앙생존기간은 ${H.fmt(mr, 2)}배로, 1/HR = ${H.fmt(1 / hr, 2)}배와 같아지는 것은 위험률이 일정할 때(k = 1)뿐입니다.`;
    else note = `‘HR − 1’로 읽으면 ${H.fmt((hr - 1) * 100, 0)}% 증가이지만, ${tq}개월까지의 누적 사망위험은 ${H.fmt((rr - 1) * 100, 1)}% 늘어납니다. 대조군의 누적위험이 클수록 상대위험도는 1 쪽으로 줄어듭니다.`;
    if (r0 < 0.1 && r1 < 0.1) note += " 두 군의 누적위험이 모두 10% 미만으로 작을 때는 상대위험도가 위험비와 거의 같습니다.";
    el.querySelector("#w11note").textContent = note;
  }
  el.querySelector("#w11hr").addEventListener("input", e => { hr = Math.exp(+e.target.value); draw(); });
  el.querySelector("#w11m").addEventListener("input", e => { med = +e.target.value; draw(); });
  el.querySelector("#w11t").addEventListener("input", e => { tq = +e.target.value; draw(); });
  el.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
    k = +btn.dataset.k;
    el.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === btn));
    draw();
  }));
  draw();
};

</script>
<script>
window.EXTRA_WIDGETS["ch12_disp"] = function (el, H) {
  // Poisson(mu) vs negative binomial NB2(mu, alpha): same mean, variance mu + alpha * mu^2
  let mu = 4, alpha = 0.5;
  const AL = [0, 0.25, 0.5, 1, 2];
  el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">계산기</span></p>
    <p class="wd">평균 건수 μ와 과산포 모수 α를 바꿔 봅니다. 파란 막대는 평균이 μ이고 분산이 μ + αμ²인 음이항 분포, 주황 점은 평균이 같은 포아송 분포(분산 = μ)입니다. α = 0이면 두 분포가 같아집니다.</p>
    <div class="wrow"><label for="c12mu">평균 μ = <b id="c12muv"></b></label><input id="c12mu" type="range" min="0.5" max="12" step="0.5" value="4"></div>
    <div class="wrow"><span>과산포 α</span><div class="seg" role="group" aria-label="과산포 모수">${AL.map(a => `<button type="button" data-a="${a}" aria-pressed="${a === alpha}">${a}</button>`).join("")}</div></div>
    <div class="wchart" id="c12chart"></div>
    <div class="stats">
      <div class="stat"><div class="sl">분산: 포아송 / 음이항</div><div class="sv" id="c12v"></div></div>
      <div class="stat"><div class="sl">분산 ÷ 평균 (음이항)</div><div class="sv" id="c12r"></div></div>
      <div class="stat"><div class="sl">0건일 확률: 포아송 / 음이항</div><div class="sv" id="c12z"></div></div>
      <div class="stat"><div class="sl" id="c12tl"></div><div class="sv" id="c12t"></div></div>
    </div>
    <p class="wd" id="c12note" style="margin-top:10px"></p>`;

  function pois(m, K) { const p = [Math.exp(-m)]; for (let k = 1; k <= K; k++) p.push(p[k - 1] * m / k); return p; }
  function nb(m, a, K) {
    if (a === 0) return pois(m, K);
    const r = 1 / a, q = m / (m + r); const p = [Math.pow(1 + a * m, -r)];
    for (let k = 1; k <= K; k++) p.push(p[k - 1] * (k - 1 + r) / k * q);
    return p;
  }
  const pct = v => v >= 0.001 ? H.fmt(v * 100, 1) + "%" : "&lt; 0.1%";
  const box = el.querySelector("#c12chart");
  // 칸이 640px보다 좁으면(휴대폰) 그 너비를 viewBox 폭으로 써서, 가로 스크롤 없이 글자 크기를 유지한다
  const chartW = () => { const c = Math.round(box.clientWidth); return c > 0 && c < 640 ? Math.max(260, c) : 640; };
  let drawnW = 0;

  function draw() {
    const v = mu + alpha * mu * mu;
    const K = Math.min(40, Math.max(12, Math.ceil(mu + 4 * Math.sqrt(v))));
    const pp = pois(mu, 200), pn = nb(mu, alpha, 200);
    const W = chartW(), narrow = W < 520, Hh = narrow ? 300 : 270, L = 54, R = 16, T = narrow ? 50 : 18, B = 46;
    drawnW = W;
    const ymax = Math.max(0.1, Math.ceil(Math.max(...pp.slice(0, K + 1), ...pn.slice(0, K + 1)) * 1.12 * 20) / 20);
    const sx = x => L + (x + 0.6) / (K + 1.2) * (W - L - R), sy = y => Hh - B - y / ymax * (Hh - T - B);
    let s = "";
    const step = ymax > 0.5 ? 0.2 : ymax > 0.2 ? 0.1 : 0.05;
    for (let y = 0; y <= ymax + 1e-9; y += step) s += `<line x1="${L}" y1="${sy(y).toFixed(1)}" x2="${W - R}" y2="${sy(y).toFixed(1)}" class="grid"/><text x="${L - 8}" y="${(sy(y) + 4).toFixed(1)}" text-anchor="end" class="tick">${y.toFixed(2)}</text>`;
    s += `<line x1="${L}" y1="${sy(0)}" x2="${W - R}" y2="${sy(0)}" class="axis"/>`;
    const xstep = narrow ? (K > 24 ? 10 : K > 12 ? 4 : 2) : (K > 24 ? 5 : K > 14 ? 2 : 1);
    for (let k = 0; k <= K; k += xstep) s += `<text x="${sx(k).toFixed(1)}" y="${sy(0) + 18}" text-anchor="middle" class="tick">${k}</text>`;
    s += `<text x="${(L + W - R) / 2}" y="${Hh - 8}" text-anchor="middle" class="axlab">건수 k</text>`;
    s += `<text x="14" y="${(T + Hh - B) / 2}" text-anchor="middle" transform="rotate(-90 14 ${(T + Hh - B) / 2})" class="axlab">P(X = k)</text>`;
    const bw = (sx(1) - sx(0)) * 0.62;
    for (let k = 0; k <= K; k++) {
      const x = sx(k) - bw / 2, y = sy(Math.min(pn[k], ymax));
      s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(sy(0) - y).toFixed(1)}" class="f1"/>`;
    }
    const pr = Math.max(2, Math.min(4, (sx(1) - sx(0)) * 0.4));
    for (let k = 0; k <= K; k++) s += `<circle cx="${sx(k).toFixed(1)}" cy="${sy(Math.min(pp[k], ymax)).toFixed(1)}" r="${pr.toFixed(1)}" class="pt f2"/>`;
    s += `<line x1="${sx(mu).toFixed(1)}" y1="${T}" x2="${sx(mu).toFixed(1)}" y2="${sy(0)}" class="ref" stroke-dasharray="4 4"/>`;
    s += `<text x="${(sx(mu) + 6).toFixed(1)}" y="${T + 10}" class="lbl mute small">평균 μ</text>`;
    const lx = narrow ? L : W - R - 200, ly = narrow ? 4 : T + 22;   // 좁은 화면에서는 범례를 그림 위로
    s += `<rect x="${lx}" y="${ly}" width="12" height="12" rx="2" class="f1"/><text x="${lx + 18}" y="${ly + 10}" class="lbl small">음이항 (분산 μ + αμ²)</text>`;
    s += `<circle cx="${lx + 6}" cy="${ly + 28}" r="4" class="pt f2"/><text x="${lx + 18}" y="${ly + 32}" class="lbl small">포아송 (분산 μ)</text>`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" class="viz" style="min-width:0" role="img" aria-label="포아송 분포와 음이항 분포 비교">${s}</svg>`;
    el.querySelector("#c12muv").textContent = H.fmt(mu, 1);
    el.querySelector("#c12v").textContent = `${H.fmt(mu, 1)} / ${H.fmt(v, 1)}`;
    el.querySelector("#c12r").textContent = H.fmt(1 + alpha * mu, 2) + "배";
    el.querySelector("#c12z").innerHTML = `${pct(pp[0])} / ${pct(pn[0])}`;
    const cut = Math.ceil(mu + 2 * Math.sqrt(mu));
    const tail = arr => 1 - arr.slice(0, cut).reduce((a, b) => a + b, 0);
    el.querySelector("#c12tl").textContent = `${cut}건 이상일 확률: 포아송 / 음이항`;
    el.querySelector("#c12t").innerHTML = `${pct(Math.max(0, tail(pp)))} / ${pct(Math.max(0, tail(pn)))}`;
    el.querySelector("#c12note").textContent = alpha === 0
      ? "α = 0이면 모든 환자의 발생률이 같다고 보는 포아송 분포 그대로입니다. 평균과 분산이 같습니다."
      : `평균은 그대로 ${H.fmt(mu, 1)}건인데 분산은 포아송의 ${H.fmt(1 + alpha * mu, 2)}배입니다. 사건이 전혀 없는 사람(0건)과 아주 많은 사람(오른쪽 꼬리)이 함께 늘고, 가운데 값은 줄어듭니다. 환자마다 발생률이 다를 때 생기는 모양입니다.`;
  }
  el.querySelector("#c12mu").addEventListener("input", e => { mu = +e.target.value; draw(); });
  el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    alpha = +b.dataset.a;
    el.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    draw();
  }));
  draw();
  if (window.ResizeObserver) new ResizeObserver(() => { if (chartW() !== drawnW) draw(); }).observe(box);
};

</script>
<script>
window.EXTRA_WIDGETS["ch13_ni"] = function (el, H) {
  // difference = new - standard (higher is better), margin -D; normal approximation
  const PRE = {
    A: [8.0, 5.5], B: [1.0, 6.5], C: [-4.5, 4.0], D: [-2.5, 10.5], E: [-8.5, 6.0], F: [-17.0, 6.0],
  };
  let est = 1.0, hw = 6.5, D = 10;
  const mfmt = (v, d = 1) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
  function Phi(x) { // Abramowitz & Stegun 26.2.17
    const t = 1 / (1 + 0.2316419 * Math.abs(x));
    const d = 0.3989422804014327 * Math.exp(-x * x / 2);
    const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
    return x >= 0 ? 1 - p : p;
  }
  const pfmt = p => p < 0.001 ? "< 0.001" : p.toFixed(3);
  const peq = p => p < 0.001 ? "p < 0.001" : "p = " + p.toFixed(3);
  el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">계산기</span></p>
    <p class="wd">가로축은 완치율 차이(신약 − 표준, %p)이고 클수록 신약이 좋습니다. 점추정값, 95% 신뢰구간의 반폭(= 1.96 × 표준오차), 비열등성 한계 Δ를 바꾸거나 그림을 좌우로 끌어 보세요. 가는 선은 95% CI, 굵은 띠는 90% CI입니다. A–F는 그림 13-1의 여섯 경우입니다.</p>
    <div class="wrow"><label for="niEst">점추정값 <b id="niEstV"></b></label><input id="niEst" type="range" min="-20" max="15" step="0.5"></div>
    <div class="wrow"><label for="niHw">95% CI 반폭 <b id="niHwV"></b></label><input id="niHw" type="range" min="1" max="12" step="0.5"></div>
    <div class="wrow"><label for="niD">비열등성 한계 Δ <b id="niDV"></b></label><input id="niD" type="range" min="2" max="15" step="0.5"></div>
    <div class="wrow"><span>그림 13-1의 경우</span><div class="seg" role="group" aria-label="예시 경우">${Object.keys(PRE).map(k => `<button type="button" data-k="${k}" aria-pressed="false">${k}</button>`).join("")}</div></div>
    <div class="wchart" id="niChart"></div>
    <div class="stats">
      <div class="stat"><div class="sl">95% 신뢰구간</div><div class="sv" id="niCI"></div></div>
      <div class="stat"><div class="sl">비열등성 (95% 하한 &gt; −Δ)</div><div class="sv" id="niNI"></div></div>
      <div class="stat"><div class="sl">우월성 (95% 하한 &gt; 0)</div><div class="sv" id="niSup"></div></div>
      <div class="stat"><div class="sl">동등성 (90% CI가 ±Δ 안)</div><div class="sv" id="niEq"></div></div>
      <div class="stat"><div class="sl">p (차이 = 0, 양측)</div><div class="sv" id="niP0"></div></div>
      <div class="stat"><div class="sl">p (비열등성, 단측)</div><div class="sv" id="niP1"></div></div>
    </div>
    <p class="wd" id="niNote" style="margin-top:10px"></p>`;
  const $ = s => el.querySelector(s);
  const iE = $("#niEst"), iH = $("#niHw"), iD = $("#niD");
  const W = 640, Hh = 200, L = 24, R = 24, Tp = 40, B = 50, X0 = -30, X1 = 20;
  const sx = x => L + (x - X0) / (X1 - X0) * (W - L - R);
  const invx = X => X0 + (X - L) / (W - L - R) * (X1 - X0);

  function category(lo, hi) {
    if (lo > 0) return ["A", "우월성 입증 (비열등성도 입증)"];
    if (lo > -D && hi >= 0) return ["B", "비열등성 입증 (우월성은 입증 못함)"];
    if (lo > -D && hi < 0) return ["C", "비열등성 입증, 단 신약이 통계적으로 유의하게 낮음"];
    if (hi <= -D) return ["F", "열등 (구간 전체가 −Δ보다 왼쪽)"];
    if (hi >= 0) return ["D", "결론 불가 (차이도, 비열등성도 입증 못함)"];
    return ["E", "결론 불가 (신약이 통계적으로 낮고, 비열등성도 입증 못함)"];
  }

  function draw() {
    const se = hw / 1.959964, hw90 = 1.644854 * se;
    const lo = est - hw, hi = est + hw, lo9 = est - hw90, hi9 = est + hw90;
    const yc = 105, base = Hh - B;
    let s = "";
    s += `<rect x="${sx(X0)}" y="${Tp}" width="${sx(-D) - sx(X0)}" height="${base - Tp}" class="a2"/>`;
    for (const t of [-30, -20, -10, 0, 10, 20]) s += `<line x1="${sx(t)}" y1="${base}" x2="${sx(t)}" y2="${base + 4}" class="axis"/><text x="${sx(t)}" y="${base + 18}" text-anchor="middle" class="tick">${mfmt(t, 0)}</text>`;
    s += `<line x1="${L}" y1="${base}" x2="${W - R}" y2="${base}" class="axis"/>`;
    s += `<text x="${(L + W - R) / 2}" y="${Hh - 10}" text-anchor="middle" class="axlab">완치율 차이 (신약 − 표준, %p)</text>`;
    s += `<line x1="${sx(-D)}" y1="${Tp}" x2="${sx(-D)}" y2="${base}" class="ref strongref" stroke-width="1.4"/>`;
    s += `<line x1="${sx(D)}" y1="${Tp}" x2="${sx(D)}" y2="${base}" class="ref" stroke-width="1.2" stroke-dasharray="3 4"/>`;
    s += `<line x1="${sx(0)}" y1="${Tp}" x2="${sx(0)}" y2="${base}" class="ref" stroke-width="1.2" stroke-dasharray="4 4"/>`;
    s += `<text x="${sx(-D)}" y="${Tp - 8}" text-anchor="middle" class="lbl small">−Δ = ${mfmt(-D)}</text>`;
    s += `<text x="${sx(D)}" y="${Tp - 8}" text-anchor="middle" class="lbl small mute">+Δ</text>`;
    s += `<text x="${sx(0)}" y="${Tp - 22}" text-anchor="middle" class="lbl small mute">0</text>`;
    if (sx(-D) - sx(X0) > 70) s += `<text x="${(sx(X0) + sx(-D)) / 2}" y="${Tp + 16}" text-anchor="middle" class="lbl small">열등 영역</text>`;
    const cl = v => Math.max(X0, Math.min(X1, v));
    s += `<rect x="${sx(cl(lo9))}" y="${yc - 9}" width="${Math.max(0, sx(cl(hi9)) - sx(cl(lo9)))}" height="18" rx="3" class="a1"/>`;
    s += `<line x1="${sx(cl(lo))}" y1="${yc}" x2="${sx(cl(hi))}" y2="${yc}" class="ln s1" stroke-width="2.4"/>`;
    for (const v of [lo, hi]) if (v >= X0 && v <= X1) s += `<line x1="${sx(v)}" y1="${yc - 12}" x2="${sx(v)}" y2="${yc + 12}" class="ln s1" stroke-width="2"/>`;
    s += `<rect x="${sx(cl(est)) - 6}" y="${yc - 6}" width="12" height="12" class="f1"/>`;
    s += `<text x="${sx(cl(est))}" y="${yc + 32}" text-anchor="middle" class="lbl small">${mfmt(est)} (${mfmt(lo)} ~ ${mfmt(hi)})</text>`;
    $("#niChart").innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" class="viz" role="img" aria-label="신뢰구간과 비열등성 한계" style="touch-action:pan-y;cursor:ew-resize">${s}</svg>`;
    $("#niEstV").textContent = mfmt(est) + "%p";
    $("#niHwV").textContent = "±" + hw.toFixed(1) + "%p";
    $("#niDV").textContent = D.toFixed(1) + "%p";
    iE.value = est; iH.value = hw; iD.value = D;
    $("#niCI").textContent = `${mfmt(lo)} ~ ${mfmt(hi)}`;
    const ni = lo > -D, sup = lo > 0, eq = lo9 > -D && hi9 < D;
    $("#niNI").textContent = ni ? "입증" : "입증 못함";
    $("#niSup").textContent = sup ? "입증" : "입증 못함";
    $("#niEq").textContent = eq ? "입증" : "입증 못함";
    const p0 = 2 * (1 - Phi(Math.abs(est / se)));
    const p1 = 1 - Phi((est + D) / se);
    $("#niP0").textContent = pfmt(p0);
    $("#niP1").textContent = pfmt(p1);
    const [k, txt] = category(lo, hi);
    let note = `판정: ${k}. ${txt}. 표준오차 = ${hw.toFixed(1)} ÷ 1.96 = ${se.toFixed(2)}%p, 90% CI = ${mfmt(lo9)} ~ ${mfmt(hi9)}.`;
    if (!sup && p0 >= 0.05 && !ni) note += " 차이 검정은 '유의하지 않음'이지만 비열등성도 입증하지 못했습니다. \"유의한 차이가 없으므로 비슷하다\"고 쓰면 안 되는 경우입니다.";
    else if (ni && p0 >= 0.05) note += ` 차이 검정은 유의하지 않고(${peq(p0)}), 비열등성은 입증되었습니다(단측 ${peq(p1)}, 기준 0.025).`;
    if (ni && !eq) note += " 비열등성은 입증됐지만 90% CI가 ±Δ를 벗어나 동등성은 입증하지 못했습니다.";
    $("#niNote").textContent = note;
    el.querySelectorAll(".seg button").forEach(b => {
      const q = PRE[b.dataset.k];
      b.setAttribute("aria-pressed", Math.abs(q[0] - est) < 1e-9 && Math.abs(q[1] - hw) < 1e-9 && D === 10);
    });
  }
  iE.addEventListener("input", () => { est = +iE.value; draw(); });
  iH.addEventListener("input", () => { hw = +iH.value; draw(); });
  iD.addEventListener("input", () => { D = +iD.value; draw(); });
  el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { [est, hw] = PRE[b.dataset.k]; D = 10; draw(); }));
  const chart = $("#niChart");
  let drag = false;
  function moveTo(ev) {
    const svg = chart.querySelector("svg");
    if (!svg) return;
    const r = svg.getBoundingClientRect();
    const X = (ev.clientX - r.left) / r.width * W;
    est = Math.max(-20, Math.min(15, Math.round(invx(X) * 2) / 2));
    draw();
  }
  chart.addEventListener("pointerdown", ev => { drag = true; moveTo(ev); });
  window.addEventListener("pointermove", ev => { if (drag) moveTo(ev); });
  window.addEventListener("pointerup", () => { drag = false; });
  draw();
};

</script>
<script>
(() => {
  const META = JSON.parse(document.getElementById("meta").textContent);
  const CH = META.chapters || [];
  const HOME = META.mode === "home";
  const COURSE = META.course || { key: "", title: "" };
  const byId = Object.fromEntries(CH.map(c => [c.id, c]));
  const app = document.getElementById("app");
  const ICON = {
    note: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    doc: '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>'
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const numLabel = c => c.lab ? `실습 ${+c.no}.` : (c.review ? "종합." : (c.appendix ? `부록 ${c.no}.` : `${c.no}.`));

  // PART 안의 접히는 묶음(PART 5 A·B): 펼쳐 둔 묶음을 이 탭에서 기억한다
  const SUB_KEY = "srn-sub-open-" + (COURSE.key || "home");
  let subOpen = [];
  try { subOpen = JSON.parse(sessionStorage.getItem(SUB_KEY) || "[]") || []; } catch (e) { subOpen = []; }
  document.addEventListener("toggle", e => {
    const d = e.target;
    if (!d.dataset || !d.dataset.sub) return;
    subOpen = subOpen.filter(k => k !== d.dataset.sub);
    if (d.open) subOpen.push(d.dataset.sub);
    try { sessionStorage.setItem(SUB_KEY, JSON.stringify(subOpen)); } catch (err) {}
  }, true);
  const subCount = list => { const n = list.filter(c => c.ready).length; return n === list.length ? `${n}개` : (n ? `${n}개 공개 · ${list.length - n}개 준비 중` : `${list.length}개 준비 중`); };

  function railHTML(activeId) {
    let h = `<a class="back" href="#toc">← ${esc(COURSE.title)} 목차</a>`;
    const item = c => {
      const inner = `<span class="rn">${c.no}</span><span>${esc(c.title)}</span>`;
      return c.ready ? `<li><a href="#${c.id}" class="${c.id === activeId ? "on" : ""}">${inner}</a></li>` : `<li><span>${inner}</span></li>`;
    };
    for (const g of META.groups) {
      const list = CH.filter(c => c.group === g.key);
      h += `<h4>${esc(g.label)}</h4>`;
      if (g.subs) {
        for (const sb of g.subs) {
          const sl = list.filter(c => c.sub === sb.key);
          const open = sl.some(c => c.id === activeId) || subOpen.includes(sb.key);
          h += `<details class="rail-sub" data-sub="${sb.key}"${open ? " open" : ""}><summary>${esc(sb.label)}. ${esc(sb.title)} <small>${sl.length}</small></summary><ol>${sl.map(item).join("")}</ol></details>`;
        }
      } else h += `<ol>${list.map(item).join("")}</ol>`;
    }
    return `<nav class="rail" aria-label="장 목록">${h}</nav>`;
  }

  function renderHome() {
    const cards = (META.courses || []).map(c => c.href
      ? `<a class="part-card" href="${c.href}">
          <div class="pc-top"><span class="pc-tag">${esc(c.tag)}</span><span class="pill ok">${esc(c.status)}</span></div>
          <h2>${esc(c.title)}</h2>
          <p>${esc(c.desc)}</p>
          <div class="pc-meta">${c.meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>
        </a>`
      : `<div class="part-card soon">
          <div class="pc-top"><span class="pc-tag">${esc(c.tag)}</span><span class="pill">${esc(c.status)}</span></div>
          <h2>${esc(c.title)}</h2>
          <p>${esc(c.desc)}</p>
          <div class="pc-meta">${c.meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>
        </div>`).join("");
    app.innerHTML = `<div class="wrap">
      <section class="home-hero">
        <p class="eyebrow">사회약학 · 약물역학 · 약물경제학</p>
        <h1>사회약학 연구방법 노트</h1>
        <p>연구실에 새로 들어온 대학원생이 논문을 읽고 분석을 시작하기 전에 알아야 할 내용을 정리한 자료입니다. 처음이라면 과목 목차 맨 위의 '읽는 순서'부터 봅니다.</p>
      </section>
      <div class="parts">${cards}</div>
      <div class="home-how">
        <div><h3>과목 구성</h3><p>과목마다 이론 장과 파이썬 실습이 있습니다. '보건통계학 기초'에는 통계 검정과 회귀모형뿐 아니라 청구자료 연구의 설계와 약물경제성 평가도 들어 있습니다.</p></div>
        <div><h3>읽는 방법</h3><p>장 첫머리의 '처음 읽을 때' 상자가 논문을 읽는 데 필요한 부분과 직접 분석할 때 읽을 부분을 나눠 알려 줍니다. '심화' 표시가 붙은 부분은 접혀 있어서, 필요할 때 눌러서 펼쳐 봅니다.</p></div>
        <div><h3>예시 자료</h3><p>본문의 숫자 예제와 표는 설명을 위해 만든 가상 자료이며, 통계량은 실제로 계산한 값입니다. '실제 논문으로 읽어 보기' 상자만 실제 논문의 수치입니다.</p></div>
      </div>
    </div>`;
  }

  function renderPart() {
    const L = (id, t) => `<a href="#${id}">${t}</a>`;
    let toc = "";
    const row = c => {

  function renderSearch(q) {
    app.innerHTML = `<div class="wrap" style="max-width:46rem">
      <p class="crumbs"><a href="index.html">홈</a><span>/</span><span>검색</span></p>
      <h1 style="font-family:var(--f-serif);margin:0 0 6px">본문 검색</h1>
      <p style="color:var(--ink-2);margin:0">공개된 장의 본문 전체에서 찾습니다. 예: 오즈비, censoring, 비례위험 가정, SMD</p>
      <form class="search-box" id="sform"><input id="sq" type="search" placeholder="검색어 입력" autocomplete="off" aria-label="검색어"></form>
      <ul class="results" id="sres"></ul></div>`;
    const input = document.getElementById("sq");
    let runSeq = 0;
    const run = async () => {
      const seq = ++runSeq;
      const terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const out = document.getElementById("sres");
      let index;
      try {
        if (terms.length && META.split && !_idx) out.innerHTML = '<li><p>검색할 본문을 불러오는 중입니다…</p></li>';
        index = terms.length ? await searchIndexAsync() : [];
      } catch (e) {
        out.innerHTML = '<li><p>검색할 본문을 불러오지 못했습니다. 연결을 확인하고 검색어를 다시 입력해 주세요.</p></li>';
        return;
      }
      if (seq !== runSeq) return;
      // 검색어를 주소에 남겨 둔다: 결과를 눌렀다가 뒤로 오면 같은 검색 결과가 다시 보인다
      try { history.replaceState(history.state, "", "#search" + (input.value.trim() ? "/" + encodeURIComponent(input.value.trim()) : "")); } catch (e) {}
      if (!terms.length) { out.innerHTML = ""; return; }
      const hits = [];
      for (const it of index) {
        const low = it.text.toLowerCase();
        if (terms.every(t => low.includes(t) || it.title.toLowerCase().includes(t))) {
          const i = Math.max(0, low.indexOf(terms[0]));
          const start = Math.max(0, i - 50);
          let snip = it.text.slice(start, start + 150);
          snip = esc(snip);
          for (const t of terms) snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
          hits.push(`<li><div class="rp">${esc(it.ch)}</div><a href="#${it.id}">${esc(it.title)}</a><p>${start > 0 ? "…" : ""}${snip}…</p></li>`);
        }
      }
      out.innerHTML = hits.length ? hits.join("") : '<li><p>일치하는 내용이 없습니다. 다른 표현(한글/영문)으로 찾아보세요.</p></li>';
    };
    input.addEventListener("input", run);
    document.getElementById("sform").addEventListener("submit", e => { e.preventDefault(); run(); });
    if (q) { input.value = q; run(); }
    input.focus();
  }

  let _idx = null, _idxP = null;
  // 장을 따로 받는 배포판(META.split)은 빌드 때 만든 search.json을 받아 쓴다
  function searchIndexAsync() {
    if (!META.split) return Promise.resolve(searchIndex());
    if (_idx) return Promise.resolve(_idx);
    if (!_idxP) _idxP = getJSON(META.data + "search.json" + (META.sh ? "?v=" + META.sh : ""))
      .then(j => (_idx = j)).catch(e => { _idxP = null; throw e; });
    return _idxP;
  }
  function searchIndex() {
    if (_idx) return _idx;
    _idx = [];
    for (const c of CH.filter(c => c.ready)) {
      const tpl = document.getElementById("tpl-" + c.id);
      if (!tpl) continue;
      const frag = tpl.content.cloneNode(true);
      frag.querySelectorAll("svg, script, details.code").forEach(n => n.remove());
      frag.querySelectorAll("section.sec").forEach(sec => {
        const h = sec.querySelector("h2");
        _idx.push({ id: sec.id, ch: c.lab ? `실습 ${+c.no} ${c.title}` : (c.review ? `종합 ${c.title}` : (c.appendix ? `부록 ${c.no} ${c.title}` : `${+c.no}장 ${c.title}`)), title: h ? h.textContent.replace(/\s+/g, " ").trim() : c.title, text: sec.textContent.replace(/\\\(.*?\\\)|\\\[.*?\\\]/g, " ").replace(/\s+/g, " ").trim() });
      });
    }
    return _idx;
  }

  /* ---------- 장을 필요할 때 받아 오기 (2026-10-13) ----------
     배포판은 장 내용을 chapters/<과목>/<id>.json으로 따로 둔다(META.split). 작업용 한 파일 빌드는
     <template id="tpl-…">가 페이지에 들어 있으므로 받지 않는다. 휴대폰에서 연결이 잠깐 끊겨도
     읽을 수 있게 세 번까지 다시 받는다. */
  const _loading = {};
  function getJSON(url, tries = 3) {
    return fetch(url, { cache: "default" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(e => tries > 1 ? new Promise(res => setTimeout(res, 700)).then(() => getJSON(url, tries - 1)) : Promise.reject(e));
  }
  const haveTpl = id => !!document.getElementById("tpl-" + id);
  function loadTpl(id) {
    if (haveTpl(id)) return Promise.resolve();
    if (_loading[id]) return _loading[id];
    const c = byId[id];
    _loading[id] = getJSON(META.data + id + ".json" + (c && c.h ? "?v=" + c.h : "")).then(j => {
      if (haveTpl(id)) return;
      const t = document.createElement("template");
      t.id = "tpl-" + id;
      t.innerHTML = j.html;
      document.body.appendChild(t);
    }).finally(() => { delete _loading[id]; });
    return _loading[id];
  }
  function prefetchNext(id) {
    if (!META.split) return;
    const list = CH.filter(x => x.ready), i = list.findIndex(x => x.id === id), nx = list[i + 1];
    if (!nx || haveTpl(nx.id)) return;
    const go = () => loadTpl(nx.id).catch(() => {});
    if ("requestIdleCallback" in window) requestIdleCallback(go, { timeout: 4000 }); else setTimeout(go, 1500);
  }
  function showLoading(id, failed) {
    const c = byId[id];
    app.innerHTML = `<div class="wrap" style="max-width:46rem"><p class="crumbs"><a href="index.html">홈</a><span>/</span><a href="#toc">${esc(COURSE.title)}</a></p>
      <h1 style="font-family:var(--f-serif)">${c ? esc(numLabel(c) + " " + c.title) : ""}</h1>
      ${failed ? `<div class="soon-box">이 장을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 <a href="#" id="retryLoad">다시 시도</a>해 주세요.</div>`
               : `<p style="color:var(--muted)">불러오는 중입니다…</p>`}</div>`;
    const r = document.getElementById("retryLoad");
    if (r) r.addEventListener("click", e => { e.preventDefault(); route(); });
  }

      spy = new IntersectionObserver(entries => {
        for (const e of entries) if (e.isIntersecting) {

      body.querySelectorAll("section.sec").forEach(s => spy.observe(s));
    }
    // 절이 하나뿐인 장: 지금 읽는 단계도 표시한다
    const stepLinks = [...document.querySelectorAll(".onpage a[data-step]")];
    if (stepSpy) { stepSpy.disconnect(); stepSpy = null; }
    if (stepLinks.length && "IntersectionObserver" in window) {
      stepSpy = new IntersectionObserver(entries => {
        for (const e of entries) if (e.isIntersecting) {
          stepLinks.forEach(l => l.classList.toggle("on", l.dataset.step === e.target.id));
        }
      }, { rootMargin: "-10% 0px -80% 0px" });
      stepLinks.forEach(l => { const h = document.getElementById(l.dataset.step); if (h) stepSpy.observe(h); });
    }

      const el = document.getElementById(anchor);
      if (el) { requestAnimationFrame(() => el.scrollIntoView({ block: "start" })); return; }

  /* ---------- 읽던 곳으로 돌아가기 ----------
     본문 속 링크(다른 장·절, 참고문헌 번호)를 누르면 그 순간의 위치를 기억해 두고,
     왼쪽 위 단추나 브라우저의 뒤로 가기로 그 자리에 되돌아온다.
     위치는 "화면 맨 위에 있던 문단이 몇 번째인지 + 펼쳐 둔 접힌 상자"로 기억한다
     (수식이 그려지면서 높이가 바뀌어도 같은 문단으로 돌아가기 위해). */
  let lastTypeset = Promise.resolve();
  let pendingRestore = null, restoreToken = 0;
  const BACK_KEY = "srn-back-" + (COURSE.key || "home");
  const ANCH = "p, li, h2, h3, h4, tr, figure, pre, summary";
  let backStack = [];
  try { backStack = JSON.parse(sessionStorage.getItem(BACK_KEY) || "[]") || []; } catch (e) { backStack = []; }
  const saveBack = () => { try { sessionStorage.setItem(BACK_KEY, JSON.stringify(backStack)); } catch (e) {} };
  const chName = c => c.lab ? `실습 ${+c.no}` : (c.review ? "종합" : (c.appendix ? `부록 ${c.no}` : `${+c.no}장`));
  const topEdge = () => (document.querySelector(".topbar")?.getBoundingClientRect().bottom || 56) + 8;

  function hereState() {
    const body = document.getElementById("body");
    const c = byId[app.dataset.ch];
    const st = { hash: location.hash, y: Math.round(window.scrollY), ch: c ? c.id : "" };
    if (!body || !c) return st;
    st.open = [...body.querySelectorAll("details")].map((d, i) => d.open ? i : -1).filter(i => i >= 0);
    const edge = topEdge(), els = body.querySelectorAll(ANCH);
    for (let i = 0; i < els.length; i++) {
      const r = els[i].getBoundingClientRect();
      if (r.height > 0 && r.bottom > edge) { st.a = { i, off: Math.round(r.top) }; break; }
    }
    let sec = null;
    body.querySelectorAll("section.sec").forEach(x => { if (x.getBoundingClientRect().top <= edge + 80) sec = x; });
    const sm = sec && (c.sections || []).find(x => x.id === sec.id);
    st.label = chName(c) + (sm ? ` ${sm.no} 절` : "");
    return st;
  }

  function restoreTo(st) {
    const body = document.getElementById("body");
    const token = ++restoreToken;
    if (body && st.open) { const ds = body.querySelectorAll("details"); st.open.forEach(i => { if (ds[i]) ds[i].open = true; }); }
    const place = () => {
      if (token !== restoreToken) return;
      const el = body && st.a ? body.querySelectorAll(ANCH)[st.a.i] : null;
      const top = el && el.getBoundingClientRect().height > 0 ? window.scrollY + el.getBoundingClientRect().top - st.a.off : (st.y || 0);
      window.scrollTo({ top: Math.max(0, top), behavior: "instant" });
    };
    place();
    requestAnimationFrame(place);
    lastTypeset.then(() => requestAnimationFrame(place));   // 수식이 그려진 뒤 한 번 더 맞춘다
    setTimeout(() => { if (token === restoreToken) restoreToken++; }, 4000);
    // 읽는 사람이 직접 움직이기 시작하면 더는 건드리지 않는다
    const stop = () => { if (token === restoreToken) restoreToken++; };
    ["wheel", "touchstart", "keydown", "mousedown"].forEach(ev => window.addEventListener(ev, stop, { once: true, passive: true }));
  }

  function updateBackBtn() {
    const btn = document.getElementById("backBtn");
    const top = backStack[backStack.length - 1];
    btn.hidden = HOME || !top;
    if (top) {
      document.getElementById("backWhere").textContent = top.label || "";
      btn.title = (top.label ? top.label + "의 " : "") + "읽던 곳으로 돌아가기";
    }
  }

  document.addEventListener("click", e => {
    if (HOME || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a || a.getAttribute("href") === location.hash) return;
    const st = hereState();
    try { history.replaceState(st, ""); } catch (err) {}      // 브라우저 뒤로 가기에서도 같은 자리로
    if (st.ch && (a.closest("#body, #leadSlot") || a.id === "searchBtn")) {   // 본문 속 링크와, 읽다가 누른 검색만 단추에 쌓는다
      backStack.push(st); if (backStack.length > 12) backStack.shift();
      saveBack();
    }
  }, true);

  document.getElementById("backBtn").addEventListener("click", () => {
    const st = backStack.pop();
    saveBack();
    if (!st) { updateBackBtn(); return; }
    if (st.hash === location.hash || (st.ch && st.ch === app.dataset.ch && !st.hash)) {
      restoreTo(st); updateBackBtn();
    } else { pendingRestore = st; location.hash = st.hash || "#" + st.ch; }
  });

  window.addEventListener("popstate", e => {
    const st = e.state;
    if (!st || typeof st.y !== "number") return;
    pendingRestore = st;
    const top = backStack[backStack.length - 1];
    if (top && top.hash === st.hash && top.y === st.y) { backStack.pop(); saveBack(); }   // 뒤로 가기로 이미 돌아온 경우
  });
  try { history.scrollRestoration = "manual"; } catch (e) {}

  function route() {
    closeDrawer();
    const h = decodeURIComponent(location.hash.slice(1));
    const pr = pendingRestore; pendingRestore = null;
    restoreToken++;
    let cur = null;
    if (HOME) {
      // old links such as index.html#ch11-s1 pointed at the single-file site: send them to the course page
      if (/^ml\d\d/.test(h) || h === "ml") { location.replace("ml.html#" + (h === "ml" ? "toc" : h)); return; }
      if (/^(?:(?:ch|lab|rv|ap)\d\d|stats$|toc$|search)/.test(h)) { location.replace("stats.html#" + (h === "stats" ? "toc" : h)); return; }
      renderHome(); window.scrollTo(0, 0);
    }
    else if (h === "home") { location.href = "index.html"; return; }
    else if (!h || h === "toc" || h === COURSE.key) { renderPart(); window.scrollTo(0, 0); }
    else if (h.startsWith("search")) { renderSearch(h.slice(7)); window.scrollTo(0, 0); }
    else {
      const m = h.match(/^((?:ch|lab|rv|ap|ml)\d\d)(?:-(.+))?$/);
      if (m) {
        cur = m[1];
        if (META.split && byId[cur] && byId[cur].ready && !haveTpl(cur)) {
          // 아직 받지 않은 장: 받는 동안 '불러오는 중'을 보이고, 다 받으면 같은 주소로 다시 그린다
          pendingRestore = pr;
          app.dataset.ch = "";
          showLoading(cur);
          window.scrollTo(0, 0);
          const want = location.hash;
          loadTpl(cur).then(() => { if (location.hash === want) route(); })
            .catch(() => { if (location.hash === want) { pendingRestore = pr; showLoading(cur, true); } });
          document.getElementById("menuBtn").hidden = false;
          document.getElementById("courseBtn").hidden = HOME;
          document.getElementById("searchBtn").hidden = HOME;
          return;
        }
        const already = app.dataset.ch === cur && document.getElementById("article");
        if (already && pr && pr.ch === cur) { restoreTo(pr); return; }
        if (already && m[2]) { const el = document.getElementById(h); if (el) { el.scrollIntoView({ block: "start" }); return; } }
        const back = pr && pr.ch === cur;
        renderChapter(cur, m[2] ? h : null, back);
        if (back) { app.dataset.ch = cur; restoreTo(pr); }
      } else renderPart();
    }
    if (pr && !cur && !pr.ch && pr.hash === location.hash) requestAnimationFrame(() => window.scrollTo({ top: pr.y, behavior: "instant" }));   // 목차·검색 화면도 보던 자리로
    app.dataset.ch = cur || "";
    document.getElementById("menuBtn").hidden = !cur;
    document.getElementById("courseBtn").hidden = HOME;
    document.getElementById("searchBtn").hidden = HOME;
  }

  // drawer for small screens
  const dRoot = document.getElementById("drawerRoot");
  function openDrawer() { document.getElementById("drawer").innerHTML = railHTML(app.dataset.ch); dRoot.hidden = false; }
  function closeDrawer() { dRoot.hidden = true; }
  document.getElementById("menuBtn").addEventListener("click", openDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

  // ---------- widgets ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  const fmt = (v, d = 1) => v.toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });

  const WIDGETS = {
    fwer(el) {
      el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">계산기</span></p>
        <p class="wd">검정 횟수를 바꾸면 우연한 '유의' 결과가 하나라도 나올 확률과 Bonferroni 기준이 어떻게 변하는지 봅니다.</p>
        <div class="wrow"><label for="fwk">검정 횟수 k = <b id="fwkv">10</b></label><input id="fwk" type="range" min="1" max="50" value="10"></div>
        <div class="stats">
          <div class="stat"><div class="sl">하나라도 위양성일 확률</div><div class="sv" id="fw1"></div></div>
          <div class="stat"><div class="sl">기대되는 위양성 개수</div><div class="sv" id="fw2"></div></div>
          <div class="stat"><div class="sl">Bonferroni 검정별 기준</div><div class="sv" id="fw3"></div></div>
        </div>`;
      const k = el.querySelector("#fwk");
      const up = () => { const n = +k.value; el.querySelector("#fwkv").textContent = n;
        el.querySelector("#fw1").textContent = fmt((1 - Math.pow(0.95, n)) * 100, 1) + "%";
        el.querySelector("#fw2").textContent = fmt(0.05 * n, 2) + "개";
        el.querySelector("#fw3").textContent = "p < " + (0.05 / n).toPrecision(2); };
      k.addEventListener("input", up); up();
    },
    clt(el) {
      const MU = 3, SG = 0.9, POPM = Math.exp(MU + SG * SG / 2), POPSD = POPM * Math.sqrt(Math.exp(SG * SG) - 1);
      let n = 5, seed = 11;
      el.innerHTML = `<p class="wt">직접 바꿔 보기 <span class="pill">시뮬레이션</span></p>
        <p class="wd">모집단: 환자 1인당 연간 외래 약제비(만원). 오른쪽으로 크게 치우친 분포입니다(평균 ${fmt(POPM)}, 중앙값 20.1, 표준편차 ${fmt(POPSD)}). 여기서 n명씩 뽑아 평균을 내는 일을 3,000번 반복하고, 그 3,000개 표본평균의 분포를 그립니다.</p>
        <div class="wrow"><span>표본 크기 n</span><div class="seg" role="group" aria-label="표본 크기">${[1, 5, 30, 100].map(v => `<button type="button" data-n="${v}" aria-pressed="${v === n}">${v}</button>`).join("")}</div>
        <button type="button" class="wbtn" id="cltRe">다시 뽑기</button></div>
        <div class="wchart" id="cltChart"></div>
        <div class="stats">
          <div class="stat"><div class="sl">표본평균들의 평균</div><div class="sv" id="c1"></div></div>
          <div class="stat"><div class="sl">표본평균들의 표준편차 (관측)</div><div class="sv" id="c2"></div></div>
          <div class="stat"><div class="sl">이론적 표준오차 σ/√n</div><div class="sv" id="c3"></div></div>
        </div>`;
      const box = el.querySelector("#cltChart");
      // 칸이 640px보다 좁으면(휴대폰) 그 너비를 그대로 viewBox 폭으로 써서 글자가 줄어들지 않게 한다
      const chartW = () => { const c = Math.round(box.clientWidth); return c > 0 && c < 640 ? Math.max(300, c) : 640; };
      let drawnW = 0;
      const draw = () => {
        const r = mulberry32(seed), R = 3000, means = new Float64Array(R);
        for (let i = 0; i < R; i++) { let s = 0; for (let j = 0; j < n; j++) s += Math.exp(MU + SG * gauss(r)); means[i] = s / n; }
        let m = 0; for (const v of means) m += v; m /= R;
        let v2 = 0; for (const v of means) v2 += (v - m) ** 2; const sd = Math.sqrt(v2 / (R - 1));
        const W = chartW(), narrow = W < 520, H = 260, L = narrow ? 16 : 50, Rr = narrow ? 16 : 20, T = narrow ? 40 : 16, B = 44, lo = 0, hi = 100, bw = 2, nb = (hi - lo) / bw;
        drawnW = W;
        const cnt = new Array(nb).fill(0); let over = 0;
        for (const v of means) { const b = Math.floor((v - lo) / bw); if (b >= 0 && b < nb) cnt[b]++; else over++; }
        const ymax = Math.max(...cnt) * 1.12;
        const sx = x => L + (x - lo) / (hi - lo) * (W - L - Rr), sy = y => H - B - y / ymax * (H - T - B);
        let s = "";
        for (let t = 0; t <= 100; t += 20) s += `<line x1="${sx(t)}" y1="${T}" x2="${sx(t)}" y2="${H - B}" class="grid"/><text x="${sx(t)}" y="${H - B + 18}" text-anchor="middle" class="tick">${t}</text>`;
        s += `<line x1="${L}" y1="${H - B}" x2="${W - Rr}" y2="${H - B}" class="axis"/>`;
        cnt.forEach((c, i) => { if (!c) return; const x = sx(lo + i * bw) + 0.8, w = sx(lo + (i + 1) * bw) - sx(lo + i * bw) - 1.6; s += `<rect x="${x.toFixed(1)}" y="${sy(c).toFixed(1)}" width="${w.toFixed(1)}" height="${(sy(0) - sy(c)).toFixed(1)}" class="f1"/>`; });
        if (n > 1) {
          const se = POPSD / Math.sqrt(n); let d = "";
          for (let x = 0; x <= 100; x += 0.25) { const y = R * bw * Math.exp(-0.5 * ((x - POPM) / se) ** 2) / (se * Math.sqrt(2 * Math.PI)); d += (d ? " L" : "M") + sx(x).toFixed(1) + "," + sy(Math.min(y, ymax)).toFixed(1); }
          s += `<path d="${d}" class="ln s2" stroke-width="2" fill="none"/>`;
          const lx = narrow ? L : W - Rr - 196, ly = narrow ? 16 : T + 10;   // 좁은 화면에서는 범례를 그림 위 왼쪽 줄로
          s += `<line x1="${lx}" y1="${ly}" x2="${lx + 22}" y2="${ly}" class="ln s2" stroke-width="2.4"/><text x="${lx + 28}" y="${ly + 4}" class="lbl">같은 평균·SE의 정규곡선</text>`;
        }
        s += `<line x1="${sx(POPM)}" y1="${T}" x2="${sx(POPM)}" y2="${H - B}" class="ref" stroke-dasharray="4 4"/><text x="${sx(POPM) + 6}" y="${T + 12}" class="lbl mute small">모평균 ${fmt(POPM)}</text>`;
        s += `<text x="${(L + W - Rr) / 2}" y="${H - 8}" text-anchor="middle" class="axlab">${n === 1 ? "환자 1명의 약제비 (만원) — 모집단 분포 그대로" : `${n}명 표본의 평균 약제비 (만원)`}</text>`;
        if (over) s += `<text x="${W - Rr}" y="${T + 34}" text-anchor="end" class="lbl mute small">100 초과 ${over}개는 그림에서 생략</text>`;
        el.querySelector("#cltChart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="viz" role="img" aria-label="표본평균의 분포">${s}</svg>`;
        el.querySelector("#c1").textContent = fmt(m) + "만원";
        el.querySelector("#c2").textContent = fmt(sd, 2);
        el.querySelector("#c3").textContent = fmt(POPSD / Math.sqrt(n), 2);
      };
      el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { n = +b.dataset.n; el.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); }));
      el.querySelector("#cltRe").addEventListener("click", () => { seed = (seed * 7 + 13) % 100000; draw(); });
      draw();
      if (window.ResizeObserver) new ResizeObserver(() => { if (chartW() !== drawnW) draw(); }).observe(box);
    }
  };

  function highlightCode(root) {
    if (!window.hljs) return;
    root.querySelectorAll("pre.cell-in code, details.code code.language-python").forEach(el => { if (!el.dataset.hl) { try { window.hljs.highlightElement(el); } catch (e) {} el.dataset.hl = "1"; } });
  }
  window.__hlReady = () => highlightCode(document.getElementById("app"));
  document.addEventListener("click", e => {
    const b = e.target.closest("button.copy");
    if (!b) return;
    const code = b.closest(".cell").querySelector("pre.cell-in code");
    const text = code ? code.textContent : "";
    const done = ok => { b.textContent = ok ? "복사됨" : "선택됨 · Ctrl+C"; setTimeout(() => { b.textContent = "복사"; }, 1800); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); done(false); };
    try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (err) { fallback(); }
  });
  const HELP = { mulberry32, gauss, fmt, esc };
  function initWidgets(root) {
    root.querySelectorAll("[data-widget]").forEach(el => {
      const f = WIDGETS[el.dataset.widget] || (window.EXTRA_WIDGETS || {})[el.dataset.widget];
      if (f) { try { f(el, HELP); } catch (e) { console.error("widget", el.dataset.widget, e); } }
    });
  }

  document.getElementById("courseBtnTxt").textContent = COURSE.title;
  if (COURSE.title) document.title = COURSE.title + " · 사회약학 연구방법 노트";
  window.addEventListener("hashchange", () => { route(); updateBackBtn(); });
  route(); updateBackBtn();
})();
</script>

</body></html>
