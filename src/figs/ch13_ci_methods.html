3-7. 같은 자료, 다른 신뢰구간 계산법. 비율이 중간 범위이고 표본이 큰 본 시험에서는 두 방법의 하한이 0.03%p밖에 차이 나지 않습니다. 반면 제균율이 100%에 가깝고 표본이 작은 시험에서는 Wald 하한(−9.4%p)이 한계를 넘지 않아 '비열등'이 되지만, Newcombe 하한(−13.5%p)으로는 입증하지 못합니다. 대조군 50명이 모두 성공해 Wald 표준오차에서 대조군 몫이 0이 된 것이 원인입니다.</figcaption></figure>
