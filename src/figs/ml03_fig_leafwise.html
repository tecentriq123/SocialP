 y2="106" class="ln s4" stroke-width="1.6"/><line x1="210" y1="52" x2="280" y2="94" class="ln s4" stroke-width="1.6"/><line x1="140" y1="106" x2="90" y2="160" class="ln s4" stroke-width="1.6"/><line x1="140" y1="106" x2="190" y2="148" class="ln s4" stroke-width="1.6"/><line x1="90" y1="160" x2="50" y2="202" class="ln s4" stroke-width="1.6"/><line x1="90" y1="160" x2="130" y2="202" class="ln s4" stroke-width="1.6"/><circle cx="210" cy="52" r="15" class="f1"/><text x="210" y="57" text-anchor="middle" class="lbl strong" fill="#fff" style="fill:#fff">1</text><circle cx="140" cy="106" r="15" class="f1"/><text x="140" y="111" text-anchor="middle" class="lbl strong" fill="#fff" style="fill:#fff">2</text><rect x="265" y="94" width="30" height="24" rx="3" class="a2 s2" stroke-width="1.2"/><circle cx="90" cy="160" r="15" class="f1"/><text x="90" y="165" text-anchor="middle" class="lbl strong" fill="#fff" style="fill:#fff">3</text><rect x="175" y="148" width="30" height="24" rx="3" class="a2 s2" stroke-width="1.2"/><rect x="35" y="202" width="30" height="24" rx="3" class="a2 s2" stroke-width="1.2"/><rect x="115" y="202" width="30" height="24" rx="3" class="a2 s2" stroke-width="1.2"/><text x="210.0" y="250.0" text-anchor="middle" class="lbl mute small">Always split the leaf that cuts the loss most</text></svg></div></div><figcaption>그림 3-3. 나누기 세 번(파란 원 안의 숫자는 나눈 순서)으로 잎 네 개(주황 네모)를 만든 두 가지 방법. A의 층 우선 성장은 한 층의 마디를 모두 나눈 뒤 다음 층으로 가므로 깊이(max_depth)로 크기를 정합니다. B의 잎 우선 성장은 지금 있는 잎 가운데 손실을 가장 많이 줄이는 잎 하나만 골라 나누므로 한쪽으로 깊어질 수 있고, 그래서 잎의 수(num_leaves, max_leaf_nodes)로 크기를 정합니다. 같은 잎 수라면 B가 손실을 더 많이 줄이지만 작은 무리를 깊게 파고들어 과적합하기도 쉽습니다.</figcaption></figure>
