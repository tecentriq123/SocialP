xt><text x="411.9" y="69.4" text-anchor="end" class="lbl">0.95 (95% CI 0.80–1.10)</text><text x="39.7" y="113.0" text-anchor="start" class="lbl strong">② M1: 비열등성 시험에서도 표준약에 있다고 믿을 수 있는 효과 = 95% CI의 보수적인 끝</text><text x="227.8" y="144.1" text-anchor="middle" class="lbl strong">M1 = 0.80</text><text x="39.7" y="187.6" text-anchor="start" class="lbl strong">③ M2: M1의 50%를 보존하도록 정한 비열등성 한계</text><text x="130.8" y="218.8" text-anchor="middle" class="lbl small">신약이 지켜야 할 효과 0.40</text><text x="324.9" y="218.8" text-anchor="middle" class="lbl small">잃어도 되는 최대 0.40 = Δ</text><text x="37.7" y="244.0" text-anchor="start" class="lbl small mute">위약 수준</text></svg></div></div><figcaption>그림 13-2. 비열등성 한계를 정하는 두 단계(가상의 예). 표준약이 위약보다 HbA1c를 0.95%p 더 낮춘다는 과거 자료에서 95% 신뢰구간의 보수적인 끝 0.80%p를 M1으로 잡고, 그 절반 0.40%p를 신약이 잃어도 되는 최대치(M2 = Δ)로 정했습니다. 신약 − 표준약 차이가 0.40%p보다 작다는 것을 보이면 신약은 위약 대비 적어도 0.40%p의 효과를 가진다고 간접적으로 추론할 수 있습니다.</figcaption></figure>
