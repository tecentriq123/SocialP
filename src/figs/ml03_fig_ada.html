ll">-3.07</text><text x="186.0" y="284.0" text-anchor="middle" class="lbl small">-3.07</text><text x="236.0" y="284.0" text-anchor="middle" class="lbl small">-3.07</text><text x="286.0" y="284.0" text-anchor="middle" class="lbl strong small">+0.67</text><text x="336.0" y="284.0" text-anchor="middle" class="lbl small">-1.28</text><text x="386.0" y="284.0" text-anchor="middle" class="lbl strong small">+0.67</text><text x="436.0" y="284.0" text-anchor="middle" class="lbl strong small">+1.12</text><text x="486.0" y="284.0" text-anchor="middle" class="lbl small">-1.28</text><text x="522.0" y="284.0" text-anchor="start" class="lbl mute small">&gt; 0 → admit</text><text x="14.0" y="342.0" text-anchor="start" class="lbl mute small">Circle area = weight at the start of the round. Dashed ring = misclassified by that round&#x27;s stump.</text></svg></div></div><figcaption>그림 3-1. AdaBoost를 환자 8명(가 절의 표, 주황은 입원한 환자)으로 세 번 돌린 모습. 원의 넓이가 그 회차의 가중치입니다. 1회차 그루터기(응급실 2회 이상 → 입원)는 7번만 틀려(점선 고리) 오차 0.125, 발언권 0.97이고, 그 결과 7번의 가중치가 커집니다(1/8 → 0.50). 2회차는 7번을 맞히려고 나이 65세를 고르고, 3회차는 2회차에 틀린 사람과 7번을 함께 보며 나이 85.5세를 고릅니다. 맨 아래 줄은 세 그루터기의 '입원(+1), 아님(−1)'에 발언권을 곱해 더한 값이며 0보다 크면 입원으로 분류합니다. 발언권은 ½ log((1 − 오차) ÷ 오차)입니다.</figcaption></figure>
