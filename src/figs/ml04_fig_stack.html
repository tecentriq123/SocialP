6.2 204.9,209.2" class="f4"/><line x1="210.0" y1="184.0" x2="210.0" y2="214.0" class="ref" stroke-width="1.3"/><polygon points="210.0,214.0 206.4,208.0 213.6,208.0" class="f4"/><line x1="346.0" y1="184.0" x2="210.0" y2="214.0" class="ref" stroke-width="1.3"/><polygon points="210.0,214.0 215.1,209.2 216.6,216.2" class="f4"/><rect x="60.0" y="216.0" width="300.0" height="40.0" rx="4" class="a1 s1" stroke-width="1"/><text x="210.0" y="233.0" text-anchor="middle" class="lbl small strong">Meta model (log-odds input)</text><text x="210.0" y="247.0" text-anchor="middle" class="lbl mute small">0.20, -0.49, 1.24; intercept -0.14</text><line x1="210.0" y1="256.0" x2="210.0" y2="280.0" class="ref" stroke-width="1.3"/><polygon points="210.0,280.0 206.4,274.0 213.6,274.0" class="f4"/><rect x="120.0" y="282.0" width="180.0" height="28.0" rx="4" class="a2 s2" stroke-width="1"/><text x="210.0" y="300.0" text-anchor="middle" class="lbl small strong">Final probability 0.459</text><text x="210.0" y="330.0" text-anchor="middle" class="lbl mute small">Same base models as in A, but fitted once on all data.</text></svg></div></div><figcaption>그림 4-1. 스태킹의 두 단계. A는 메타 모형의 학습 자료를 만드는 과정입니다. 학습 자료를 다섯 겹으로 나누고, 겹마다 그 겹을 뺀 나머지 네 겹으로 기본 모형 셋을 맞춰 그 겹 사람들의 확률을 냅니다(파란 칸의 'w/o 1'은 1겹을 빼고 배운 모형이라는 뜻). 이렇게 모은 11,250명 × 3열의 겹 밖 예측과 실제 결과(주황 칸)로 메타 모형이 열마다 무게를 배웁니다. B는 새 환자 한 명의 예측입니다. 기본 모형 셋은 학습 자료 전체로 한 번 더 맞춘 것을 쓰고, 셋의 확률 0.825, 0.290, 0.351을 로그 오즈로 바꿔 메타 모형의 무게를 곱해 더하고 절편을 더한 뒤 확률로 되돌리면 0.459가 됩니다. 이 환자는 셀 3 표의 넷째 줄(82세, 약 29가지, 심부전과 만성콩팥병이 함께 있음)이고 실제로 입원했습니다.</figcaption></figure>
