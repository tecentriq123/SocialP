<div class="cell"><div class="cell-h"><span class="cell-n">셀 6</span><span class="cell-t">Hodges–Lehmann 추정치</span><button class="copy" type="button" aria-label="코드 복사">복사</button></div><pre class="cell-in"><code class="language-r">d0 &lt;- d[d != 0]                                  # 0을 뺀 차이 12개
walsh &lt;- outer(d0, d0, &quot;+&quot;) / 2                   # 두 차이의 평균
median(walsh[upper.tri(walsh, diag = TRUE)])      # Walsh 평균 78개의 중앙값</code></pre><div class="cell-out"><div class="cell-out-h">출력</div><pre>[1] -2<span class="mk">1</span></pre></div></div>
